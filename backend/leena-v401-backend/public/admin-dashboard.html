  <link rel="stylesheet" href="/assets/leena.css">
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-header">
      <img src="/logo.png" alt="Leena logo" class="sidebar-logo">
      <span>Leena EMS</span>
    </div>
        <div class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">Overview</div>
                <a class="nav-item active" href="main-panel-v2.html"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">Management</div>
                <a class="nav-item" href="visitorlog-paginated.html"><i class="bi bi-people"></i><span>Visitors</span></a>
                <a class="nav-item" href="form-builder.html"><i class="bi bi-ui-checks-grid"></i><span>Forms</span></a>
                <a class="nav-item" href="checkins.html"><i class="bi bi-check2-square"></i><span>Check-ins</span></a>
                <a class="nav-item" href="terminals.html"><i class="bi bi-pc-display"></i><span>Terminals</span></a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">Communication</div>
                <a class="nav-item" href="email-templates.html"><i class="bi bi-envelope"></i><span>Email Templates</span></a>
                <a class="nav-item" href="email-segments.html"><i class="bi bi-megaphone"></i><span>Email Segments</span></a>

            <div class="nav-section">
                <div class="nav-section-title">Settings</div>
                <a class="nav-item" href="badge-templates.html"><i class="bi bi-person-badge"></i><span>Badge Templates</span></a>
            </div>
            <div class="nav-divider"></div>
            <div class="nav-section">

                <a class="nav-item" href="reports.html"><i class="bi bi-graph-up"></i><span>Reports</span></a>
                <a class="nav-item" href="import.html"><i class="bi bi-download"></i><span>Import</span></a>
            </div>
        </div>
</nav>

  <div class="main-wrapper">
    <header class="main-header">
      <h1>
        <i class="bi bi-shield-lock text-primary"></i>
        <span>Super Admin Panel</span>
      </h1>
    </header>

    <main class="main-container">
      <div class="form-section">
        <h2>Create New Organizer</h2>
        <input type="text" id="orgName" class="form-control" placeholder="Organizer Name" />
        <input type="email" id="orgEmail" class="form-control" placeholder="Email (login)" />
        <input type="password" id="orgPassword" class="form-control" placeholder="Password" />
        <input type="text" id="orgLogo" class="form-control" placeholder="Logo URL (optional)" />
        <button class="btn btn-primary" onclick="createOrganizer()">Create Organizer</button>
        <div id="createMessage" class="text-success mt-3"></div>
      </div>

      <div class="table-section">
        <h2>All Organizers</h2>
        <table id="organizerTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Logo</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Organizer rows will go here -->
      </tbody>
    </table>
      </div>
    </main>
  </div>

  <script>
    async function fetchOrganizers() {
      try {
        const res = await fetch('http://localhost:3000/api/organizers');
        const data = await res.json();
        const tbody = document.querySelector('#organizerTable tbody');
        tbody.innerHTML = '';

        data.forEach(org => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${org.id}</td>
            <td>${org.name}</td>
            <td>${org.email}</td>
            <td>${org.logo_url || ''}</td>
            <td>${new Date(org.created_at).toLocaleString()}</td>
            <td>
              <button onclick="exportVisitors(${org.id})">Export</button>
              <button class="delete-btn" onclick="deleteOrganizer(${org.id})">Delete</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error('Failed to load organizers', err);
      }
    }

    async function createOrganizer() {
      const name = document.getElementById('orgName').value.trim();
      const email = document.getElementById('orgEmail').value.trim();
      const password = document.getElementById('orgPassword').value.trim();
      const logo = document.getElementById('orgLogo').value.trim();
      const message = document.getElementById('createMessage');

      message.textContent = '';

      if (!name || !email || !password) {
        alert('Please fill in all required fields');
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, logo_url: logo })
        });

        if (res.ok) {
          message.textContent = 'Organizer created successfully!';
          document.getElementById('orgName').value = '';
          document.getElementById('orgEmail').value = '';
          document.getElementById('orgPassword').value = '';
          document.getElementById('orgLogo').value = '';
          fetchOrganizers();
        } else {
          alert('Failed to create organizer');
        }
      } catch (err) {
        alert('Server error. Try again.');
      }
    }

    async function deleteOrganizer(id) {
      if (!confirm('Are you sure you want to delete this organizer?')) return;

      try {
        const res = await fetch(`http://localhost:3000/api/organizers/${id}`, {
          method: 'DELETE'
        });
        if (res.ok) {
          fetchOrganizers();
        } else {
          alert('Failed to delete organizer');
        }
      } catch (err) {
        alert('Error deleting organizer');
      }
    }

    function exportVisitors(organizerId) {
      window.open(`http://localhost:3000/api/visitors/export/${organizerId}`, '_blank');
    }

    fetchOrganizers();
  </script>
</body>
</html>
