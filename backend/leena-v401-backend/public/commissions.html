<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
    <title>Commissions - Leena EMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #4a6fa5;
            --primary-hover: #3d5d8a;
            --primary-light: #eef2f7;
            --sidebar-bg: #1a1a2e;
            --sidebar-hover: #252542;
            --sidebar-active: #2d2d4a;
            --sidebar-text: #9ca3af;
            --sidebar-text-active: #ffffff;
            --sidebar-border: #252542;
            --bg: #f4f6fa;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text: #1f2937;
            --text-muted: #6b7280;
            --danger: #b91c1c;
            --warn: #92400e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); }
        .app-shell { display: flex; min-height: 100vh; }

        .sidebar { width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 24px 20px; border-bottom: 1px solid var(--sidebar-border); }
        .sidebar-logo { height: 32px; }
        .sidebar-nav { padding: 16px 12px; flex: 1; }
        .nav-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--sidebar-text); padding: 8px 12px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--sidebar-text); text-decoration: none; font-size: 14px; font-weight: 500; margin-bottom: 2px; }
        .nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
        .nav-item.active { background: var(--sidebar-active); color: var(--sidebar-text-active); }
        .nav-divider { height: 1px; background: var(--sidebar-border); margin: 12px 0; }

        .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .main-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 28px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .main-header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .main-content { padding: 24px 28px; }

        .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 20px; }
        .filter { display: flex; flex-direction: column; gap: 4px; }
        .filter label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; }
        .filter input { font-family: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); min-width: 150px; }
        .btn { font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fafbfc; }
        tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
        tbody tr:last-child td { border-bottom: none; }
        .muted { color: var(--text-muted); }
        .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .af a { color: var(--primary); font-weight: 600; text-decoration: none; }

        /* Period group */
        .period { margin-bottom: 28px; }
        .period-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .period-title i { color: var(--primary); }

        /* Agent block */
        .agent-block { margin-bottom: 16px; }
        .agent-head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 16px; background: #fafbfc; border: 1px solid var(--border); border-bottom: none; border-radius: 12px 12px 0 0; }
        .agent-name { font-weight: 700; font-size: 15px; }
        .agent-total { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .agent-total .lbl { font-weight: 500; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; margin-right: 8px; }
        .agent-block .card { border-radius: 0 0 12px 12px; border-top: none; }

        .role-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 2px 7px; border-radius: 999px; background: var(--primary-light); color: var(--primary); }
        .status-cancelled { color: var(--danger); font-weight: 600; }
        .cap-note { color: var(--warn); font-size: 12px; font-weight: 600; }
        .reversal-row td { background: #fdf6f6; }
        .neg { color: var(--danger); }

        .empty-state { padding: 60px 20px; text-align: center; color: var(--text-muted); }
        .footnote { font-size: 12px; color: var(--text-muted); margin-top: 20px; font-style: italic; }
    </style>
</head>
<body>
    <div class="app-shell">
        <nav class="sidebar">
            <div class="sidebar-header">
                <img src="assets/Leena_logo_white_nobg.png" alt="Leena" class="sidebar-logo">
            </div>
            <div class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Finance</div>
                    <a class="nav-item" href="contract-list.html">
                        <i class="bi bi-file-earmark-text"></i><span>Contracts</span>
                    </a>
                    <a class="nav-item" href="sales-agents.html">
                        <i class="bi bi-person-badge"></i><span>Sales Agents</span>
                    </a>
                    <a class="nav-item active" href="commissions.html">
                        <i class="bi bi-cash-coin"></i><span>Commissions</span>
                    </a>
                </div>
                <div class="nav-divider"></div>
                <div class="nav-section">
                    <a class="nav-item" href="dashboard_new.html">
                        <i class="bi bi-collection"></i><span>My Expos</span>
                    </a>
                    <a class="nav-item" href="#" onclick="logout(); return false;">
                        <i class="bi bi-box-arrow-right"></i><span>Logout</span>
                    </a>
                </div>
            </div>
        </nav>

        <div class="main-wrapper">
            <header class="main-header">
                <h1><i class="bi bi-cash-coin"></i> Commissions</h1>
            </header>

            <main class="main-content">
                <div class="toolbar">
                    <div class="filter">
                        <label for="fFrom">From (cut date)</label>
                        <input id="fFrom" type="date">
                    </div>
                    <div class="filter">
                        <label for="fTo">To (cut date)</label>
                        <input id="fTo" type="date">
                    </div>
                    <button class="btn btn-primary" onclick="load()"><i class="bi bi-search"></i> Load</button>
                </div>

                <div id="report">
                    <div class="empty-state">Loading…</div>
                </div>

                <div class="footnote">Totals are computed on unrounded slices.</div>
            </main>
        </div>
    </div>

    <script src="/leena-toast.js"></script>
    <script src="/leena-fetch.js"></script>
    <script>
        const API_URL = '/api';

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'login.html'; return; }
            load();   // default aralık backend'de (önceki ayın 1'i → bugün)
        });

        async function load() {
            const from = document.getElementById('fFrom').value;
            const to = document.getElementById('fTo').value;
            const qs = [];
            if (from) qs.push(`from=${encodeURIComponent(from)}`);
            if (to) qs.push(`to=${encodeURIComponent(to)}`);
            const url = `${API_URL}/commissions${qs.length ? '?' + qs.join('&') : ''}`;
            document.getElementById('report').innerHTML = '<div class="empty-state">Loading…</div>';
            try {
                const res = await leenaFetch(url);
                if (!res.ok) {
                    let msg = 'Failed to load commissions';
                    try { const e = await res.json(); if (e && e.error) msg = e.error; } catch (_) {}
                    document.getElementById('report').innerHTML =
                        `<div class="empty-state">${escapeHtml(msg)}</div>`;
                    return;
                }
                const data = await res.json();
                render(data.periods || []);
            } catch (err) {
                if (err.status === 401 || err.status === 403) return;
                document.getElementById('report').innerHTML =
                    '<div class="empty-state">Error loading commissions. <button class="btn btn-primary" onclick="load()">Retry</button></div>';
            }
        }

        function render(periods) {
            const root = document.getElementById('report');
            if (!periods.length) {
                root.innerHTML = '<div class="empty-state">No commission slices in this period.</div>';
                return;
            }
            root.innerHTML = periods.map(renderPeriod).join('');
        }

        function renderPeriod(p) {
            const agents = p.agents.map(renderAgent).join('');
            return `<div class="period">
                <div class="period-title"><i class="bi bi-calendar-range"></i> ${escapeHtml(p.label)}</div>
                ${agents}
            </div>`;
        }

        function renderAgent(a) {
            const rows = a.slices.map(renderSlice).join('');
            return `<div class="agent-block">
                <div class="agent-head">
                    <span class="agent-name">${escapeHtml(a.agent_name || '—')}</span>
                    <span class="agent-total"><span class="lbl">Period Total</span>${formatMoney(a.total_eur)} EUR</span>
                </div>
                <div class="card">
                    <table>
                        <thead>
                            <tr>
                                <th>Contract</th>
                                <th>Role</th>
                                <th>Payment Date</th>
                                <th class="num">Payment (EUR)</th>
                                <th class="num">Slice (EUR)</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            </div>`;
        }

        function renderSlice(s) {
            const af = s.af_number
                ? `<span class="af"><a href="contract-detail.html?id=${s.contract_id}">${escapeHtml(s.af_number)}</a></span>`
                : `<a class="af" href="contract-detail.html?id=${s.contract_id}">#${s.contract_id}</a>`;
            const cancelled = s.contract_status === 'Cancelled'
                ? ' <span class="status-cancelled">(Cancelled)</span>' : '';
            // Slice gösterimi: capped → "0.00 (cap)" veya kısmiyse "<val> (cap)".
            const sliceNum = formatMoney(s.slice_eur);
            const neg = Number(s.slice_eur) < 0 ? ' neg' : '';
            const sliceCell = s.capped
                ? `<span class="${neg.trim()}">${sliceNum}</span> <span class="cap-note">(cap)</span>`
                : `<span class="${neg.trim()}">${sliceNum}</span>`;
            const payNeg = Number(s.amount_eur) < 0 ? ' neg' : '';
            const rowCls = s.reversal ? ' class="reversal-row"' : '';
            return `<tr${rowCls}>
                <td class="af">${af}${cancelled}</td>
                <td><span class="role-badge">${escapeHtml(s.role)}</span></td>
                <td>${formatDate(s.payment_date)}</td>
                <td class="num"><span class="${payNeg.trim()}">${formatMoney(s.amount_eur)}</span></td>
                <td class="num">${sliceCell}</td>
            </tr>`;
        }

        function formatDate(d) {
            if (!d) return '<span class="muted">—</span>';
            // 'YYYY-MM-DD' → parça parça (TZ kaymasını önle).
            const [y, m, day] = String(d).split('-').map(Number);
            const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            if (!y || !m || !day) return escapeHtml(String(d));
            return `${MON[m-1]} ${day}, ${y}`;
        }
        function formatMoney(amount) {
            if (amount === null || amount === undefined || amount === '') return '';
            const n = Number(amount);
            if (!isFinite(n)) return '';
            return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
    </script>
</body>
</html>
