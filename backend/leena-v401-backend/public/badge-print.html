<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=100mm, initial-scale=1.0" />
  <title>Badge Print</title>
  <style>
    @page {
      size: 100mm 50mm;
      margin: 0;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100mm;
    }

    .badge {
      width: 100mm;
      height: 50mm;
      padding: 8mm;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-info {
      flex: 1;
      padding-right: 5mm;
    }

    .badge-name {
      font-size: clamp(12pt, 3vw, 16pt);
      font-weight: bold;
      margin-bottom: 3mm;
      word-wrap: break-word;
      white-space: normal;
    }

    .badge-company {
      font-size: clamp(10pt, 2.5vw, 12pt);
      word-wrap: break-word;
      white-space: normal;
    }

    .badge-qr {
      width: 25mm; /* ✅ %30 küçültüldü */
      height: 25mm;
    }

    .badge-qr img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="badge">
    <div class="badge-info">
      <div class="badge-name" id="name">Name</div>
      <div class="badge-company" id="company">Company</div>
    </div>
    <div class="badge-qr">
      <img id="qrcode" src="" alt="QR Code" />
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const qr = params.get("qr");

    if (qr) {
      fetch(`/api/visitors/badge/${qr}`)
        .then((res) => res.json())
        .then((data) => {
          document.getElementById("name").textContent =
            data.name || data.custom_fields?.name || "Unknown";
          document.getElementById("company").textContent =
            data.company || data.custom_fields?.company || "-";
          document.getElementById(
            "qrcode"
          ).src = `/api/qr-image/${data.qr_code}`;
        })
        .catch((err) => {
          document.getElementById("name").textContent = "Invalid QR";
          document.getElementById("company").textContent = "";
        });
    } else {
      document.getElementById("name").textContent = "Missing QR";
      document.getElementById("company").textContent = "";
    }
  </script>
</body>
</html>
