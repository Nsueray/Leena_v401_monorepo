<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
  <title>Your Event Badge / Votre badge événement</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f6f7fb;
      min-height: 100vh;
      color: #0f172a;
      padding: 20px 12px;
      line-height: 1.5;
    }
    .container { max-width: 600px; margin: 0 auto; }
    .header {
      text-align: center;
      padding: 12px 0 20px;
      color: #475569;
      font-size: 14px;
    }
    .badge {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      padding: 32px 24px;
      text-align: center;
    }
    .expo-name {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .expo-meta {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .visitor-info {
      text-align: left;
      margin: 20px 0;
      padding: 16px;
      background: #f8fafc;
      border-radius: 8px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .info-value {
      font-size: 15px;
      color: #0f172a;
      font-weight: 500;
      text-align: right;
      word-break: break-word;
      max-width: 60%;
    }
    .info-value.mono {
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      letter-spacing: 0.05em;
    }
    .qr-section {
      margin: 24px auto 12px;
      padding: 20px;
      background: #ffffff;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      display: inline-block;
    }
    .qr-code { display: flex; justify-content: center; align-items: center; }
    .qr-instruction { font-size: 12px; color: #64748b; margin-top: 12px; }
    .actions { margin-top: 24px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      background: #0f172a; color: white; border: none;
      padding: 12px 20px; border-radius: 6px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: background 0.15s;
    }
    .btn:hover { background: #1e293b; }
    .footer { text-align: center; padding: 20px 0; color: #94a3b8; font-size: 12px; }
    .loading, .error { text-align: center; padding: 60px 20px; color: #64748b; }
    .loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid #e2e8f0; border-top-color: #0f172a;
      border-radius: 50%; margin: 0 auto 16px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-icon { font-size: 48px; margin-bottom: 12px; }

    @media (max-width: 520px) {
      body { padding: 10px 8px; }
      .badge { padding: 20px 16px; }
      .info-row { flex-direction: column; align-items: flex-start; }
      .info-value { max-width: 100%; text-align: left; margin-top: 2px; }
      .expo-name { font-size: 18px; }
    }

    @media print {
      body { background: white; padding: 0; color: black; }
      .header, .actions, .footer { display: none; }
      .badge { border: 2px solid #0f172a; box-shadow: none; padding: 24px; }
      .qr-section { border-style: solid; }
      .visitor-info { background: white; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Your Event Badge · Votre badge événement</div>
    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div>Loading your badge… / Chargement du badge…</div>
      </div>
    </div>
    <div class="footer">Powered by Leena EMS · © Elan Expo</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script>
    const API_URL = '/api';

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getQRFromURL() {
      return new URLSearchParams(window.location.search).get('qr');
    }

    function formatDates(startDate, endDate) {
      if (!startDate) return '';
      const opts = { day: 'numeric', month: 'short', year: 'numeric' };
      const s = new Date(startDate);
      if (!endDate || startDate === endDate) return s.toLocaleDateString('en-GB', opts);
      const e = new Date(endDate);
      if (s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear()) {
        return `${s.getDate()}–${e.toLocaleDateString('en-GB', opts)}`;
      }
      return `${s.toLocaleDateString('en-GB', opts)} – ${e.toLocaleDateString('en-GB', opts)}`;
    }

    function venueLine(v) {
      const parts = [];
      if (v.expo_venue) parts.push(v.expo_venue);
      if (v.expo_city) parts.push(v.expo_city);
      else if (v.expo_location && !v.expo_venue) parts.push(v.expo_location);
      return parts.join(', ');
    }

    async function loadBadge() {
      const qrCode = getQRFromURL();
      if (!qrCode) { showError('Invalid badge link / Lien de badge invalide'); return; }
      try {
        const response = await fetch(`${API_URL}/visitors/badge/${qrCode}`);
        if (response.ok) {
          const data = await response.json();
          if (data.visitor) { displayBadge(data.visitor); return; }
        }
      } catch (err) { console.error(err); }
      // Fallback — QR alone if API fails or visitor not found
      displayBadge({
        qr_code: qrCode, name: 'Guest',
        badge_id: qrCode.substring(0, 8).toUpperCase()
      });
    }

    function displayBadge(v) {
      const qrValue = v.qr_code || getQRFromURL();
      const fullName = [v.name, v.last_name].filter(Boolean).join(' ').trim() || 'Guest';
      const badgeId = v.badge_id || qrValue.substring(0, 8).toUpperCase();
      const expoName = v.expo_name || 'Event Badge';
      const datesLine = formatDates(v.expo_start_date, v.expo_end_date);
      const venue = venueLine(v);
      const meta = [datesLine, venue].filter(Boolean).join(' · ');

      document.getElementById('content').innerHTML = `
        <div class="badge">
          <div class="expo-name">${esc(expoName)}</div>
          ${meta ? `<div class="expo-meta">${esc(meta)}</div>` : ''}
          <div class="visitor-info">
            <div class="info-row">
              <span class="info-label">Name / Nom</span>
              <span class="info-value">${esc(fullName)}</span>
            </div>
            ${v.company ? `
            <div class="info-row">
              <span class="info-label">Company / Société</span>
              <span class="info-value">${esc(v.company)}</span>
            </div>` : ''}
            ${v.booth_number ? `
            <div class="info-row">
              <span class="info-label">Booth / Stand</span>
              <span class="info-value">${esc(v.booth_number)}</span>
            </div>` : ''}
            <div class="info-row">
              <span class="info-label">Registration ID</span>
              <span class="info-value mono">${esc(badgeId)}</span>
            </div>
          </div>
          <div class="qr-section">
            <div class="qr-code" id="qrcode"></div>
            <div class="qr-instruction">Scan at the entrance / Scanner à l'entrée</div>
          </div>
          <div class="actions">
            <button class="btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
          </div>
        </div>
      `;

      // Client-side QR render — no external image fetch, works when /api/qr-image is down
      QRCode.toDataURL(qrValue,
        { width: 180, margin: 1, color: { dark: '#0f172a', light: '#ffffff' } },
        (err, url) => {
          if (err) {
            document.getElementById('qrcode').innerHTML = '<p style="color:#dc3545;">QR generation failed</p>';
            return;
          }
          const img = document.createElement('img');
          img.src = url; img.alt = 'QR Code'; img.width = 180; img.height = 180;
          document.getElementById('qrcode').appendChild(img);
        });
    }

    function showError(message) {
      document.getElementById('content').innerHTML = `
        <div class="badge">
          <div class="error">
            <div class="error-icon">⚠️</div>
            <div>${esc(message)}</div>
          </div>
        </div>
      `;
    }

    loadBadge();
  </script>
</body>
</html>
