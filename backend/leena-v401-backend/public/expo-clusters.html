<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
    <title>Expo Clusters - Leena EMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root{--primary:#4a6fa5;--primary-hover:#3d5d8a;--primary-light:#eef2f7;--sidebar-bg:#1a1a2e;--sidebar-hover:#252542;--sidebar-active:#2d2d4a;--sidebar-text:#9ca3af;--sidebar-text-active:#fff;--sidebar-border:#252542;--bg:#f4f6fa;--surface:#fff;--border:#e5e7eb;--text:#1f2937;--text-muted:#6b7280;}
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);}
        .app-shell{display:flex;min-height:100vh;}
        .sidebar{width:260px;background:var(--sidebar-bg);flex-shrink:0;}
        .sidebar-header{padding:24px 20px;border-bottom:1px solid var(--sidebar-border);}
        .sidebar-logo{height:32px;}
        .sidebar-nav{padding:16px 12px;}
        .nav-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--sidebar-text);padding:8px 12px;}
        .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--sidebar-text);text-decoration:none;font-size:14px;font-weight:500;margin-bottom:2px;}
        .nav-item:hover{background:var(--sidebar-hover);color:var(--sidebar-text-active);}
        .nav-item.active{background:var(--sidebar-active);color:var(--sidebar-text-active);}
        .nav-divider{height:1px;background:var(--sidebar-border);margin:12px 0;}
        .main-wrapper{flex:1;display:flex;flex-direction:column;min-width:0;}
        .main-header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;background:var(--surface);border-bottom:1px solid var(--border);}
        .main-header h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;}
        .main-content{padding:24px 28px;max-width:1000px;}
        .section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:20px;}
        .section h2{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:16px;}
        .grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;gap:14px;align-items:end;}
        .field{display:flex;flex-direction:column;gap:5px;}
        .field label{font-size:12px;font-weight:600;}
        .field input{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);}
        .btn{font-family:inherit;font-size:14px;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
        .btn-primary{background:var(--primary);color:#fff;}.btn-primary:hover{background:var(--primary-hover);}
        .btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border);}.btn-ghost:hover{background:var(--primary-light);}
        .btn-danger{background:#fff;color:#c0392b;border-color:#f0c7c2;}.btn-danger:hover{background:#fdecea;}
        .btn-sm{padding:6px 12px;font-size:13px;}
        .form-actions{display:flex;gap:10px;margin-top:14px;}
        table{width:100%;border-collapse:collapse;}
        thead th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--border);background:#fafbfc;}
        tbody td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:14px;}
        tbody tr:last-child td{border-bottom:none;}
        .pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#eef2f7;color:#3d5d8a;}
        .row-actions{text-align:right;white-space:nowrap;}
        .empty{padding:40px;text-align:center;color:var(--text-muted);}
        .muted{color:var(--text-muted);}
    </style>
</head>
<body>
    <div class="app-shell">
        <nav class="sidebar">
            <div class="sidebar-header"><img src="assets/Leena_logo_white_nobg.png" alt="Leena" class="sidebar-logo"></div>
            <div class="sidebar-nav">
                <div class="nav-section-title">Operations</div>
                <a class="nav-item" href="expo-list.html"><i class="bi bi-calendar-event"></i><span>Expo List</span></a>
                <a class="nav-item active" href="#"><i class="bi bi-diagram-3"></i><span>Clusters</span></a>
                <div class="nav-divider"></div>
                <a class="nav-item" href="dashboard_new.html"><i class="bi bi-collection"></i><span>My Expos</span></a>
                <a class="nav-item" href="#" onclick="logout();return false;"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
            </div>
        </nav>
        <div class="main-wrapper">
            <header class="main-header"><h1><i class="bi bi-diagram-3"></i> Clusters</h1></header>
            <main class="main-content">
                <div class="section">
                    <h2 id="formTitle">New Cluster</h2>
                    <div class="grid">
                        <div class="field"><label>Name</label><input type="text" id="name" placeholder="e.g. Nigeria May 2026"></div>
                        <div class="field"><label>City</label><input type="text" id="city"></div>
                        <div class="field"><label>Country</label><input type="text" id="country"></div>
                        <div class="field"><label>Start Date</label><input type="date" id="start_date"></div>
                        <div class="field"><label>End Date</label><input type="date" id="end_date"></div>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-primary" id="saveBtn" onclick="saveCluster()"><i class="bi bi-check-lg"></i> <span id="saveLabel">Create Cluster</span></button>
                        <button class="btn btn-ghost" id="cancelBtn" onclick="resetForm()" style="display:none;">Cancel</button>
                    </div>
                    <div class="muted" style="margin-top:10px;font-size:13px;">Equal-expo model: co-located expos that share venue and operations. Link expos to a cluster from the expo form.</div>
                </div>
                <div class="section">
                    <h2>All clusters</h2>
                    <table>
                        <thead><tr><th>Name</th><th>City</th><th>Country</th><th>Dates</th><th>Expos</th><th class="row-actions">Actions</th></tr></thead>
                        <tbody id="clusterBody"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="/leena-toast.js"></script>
    <script src="/leena-fetch.js"></script>
    <script>
        const API_URL='/api';
        let editingId=null;
        document.addEventListener('DOMContentLoaded',()=>{
            if(!localStorage.getItem('token')){location.href='login.html';return;}
            loadClusters();
        });
        async function loadClusters(){
            try{
                const r=await leenaFetch(`${API_URL}/clusters`);
                const {clusters}=await r.json();
                render(clusters);
            }catch(e){if(e.status===401||e.status===403)return;
                document.getElementById('clusterBody').innerHTML='<tr><td colspan="6" class="empty">Error loading clusters.</td></tr>';}
        }
        function render(list){
            const b=document.getElementById('clusterBody');
            if(!list||!list.length){b.innerHTML='<tr><td colspan="6" class="empty">No clusters yet. Create the first one above.</td></tr>';return;}
            b.innerHTML=list.map(c=>`<tr>
                <td style="font-weight:600;">${esc(c.name)}</td>
                <td>${esc(c.city)||'<span class="muted">—</span>'}</td>
                <td>${esc(c.country)||'<span class="muted">—</span>'}</td>
                <td>${c.start_date?fmt(c.start_date)+' – '+fmt(c.end_date):'<span class="muted">—</span>'}</td>
                <td><span class="pill">${c.expo_count} expo${c.expo_count===1?'':'s'}</span></td>
                <td class="row-actions">
                    <button class="btn btn-ghost btn-sm" onclick='editCluster(${JSON.stringify(c)})'><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-danger btn-sm" onclick="deleteCluster(${c.id})"><i class="bi bi-trash"></i></button>
                </td></tr>`).join('');
        }
        function editCluster(c){
            editingId=c.id;
            document.getElementById('name').value=c.name||'';
            document.getElementById('city').value=c.city||'';
            document.getElementById('country').value=c.country||'';
            document.getElementById('start_date').value=dateOnly(c.start_date);
            document.getElementById('end_date').value=dateOnly(c.end_date);
            document.getElementById('formTitle').textContent='Edit Cluster';
            document.getElementById('saveLabel').textContent='Save Changes';
            document.getElementById('cancelBtn').style.display='';
            window.scrollTo({top:0,behavior:'smooth'});
        }
        function resetForm(){
            editingId=null;
            ['name','city','country','start_date','end_date'].forEach(id=>document.getElementById(id).value='');
            document.getElementById('formTitle').textContent='New Cluster';
            document.getElementById('saveLabel').textContent='Create Cluster';
            document.getElementById('cancelBtn').style.display='none';
        }
        async function saveCluster(){
            const body={
                name:document.getElementById('name').value.trim(),
                city:document.getElementById('city').value.trim(),
                country:document.getElementById('country').value.trim(),
                start_date:document.getElementById('start_date').value,
                end_date:document.getElementById('end_date').value
            };
            if(!body.name){showToast('Name is required','error');return;}
            document.getElementById('saveBtn').disabled=true;
            try{
                const url=editingId?`${API_URL}/clusters/${editingId}`:`${API_URL}/clusters`;
                const method=editingId?'PUT':'POST';
                const r=await leenaFetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
                if(r.ok){showToast('Saved','success');resetForm();loadClusters();}
                else{const err=await r.json();showToast(err.error||'Save failed','error');}
            }catch(e){if(!(e.status===401||e.status===403))showToast('Save failed','error');}
            document.getElementById('saveBtn').disabled=false;
        }
        async function deleteCluster(id){
            if(!confirm('Delete this cluster? Any expos linked to it will be unlinked (the expos themselves are kept).'))return;
            try{
                const r=await leenaFetch(`${API_URL}/clusters/${id}`,{method:'DELETE'});
                if(r.ok){showToast('Deleted','success');loadClusters();}
                else{const err=await r.json();showToast(err.error||'Delete failed','error');}
            }catch(e){if(!(e.status===401||e.status===403))showToast('Delete failed','error');}
        }
        function fmt(d){return d?new Date(d).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'}):'—';}
        function dateOnly(d){if(!d)return '';const dt=new Date(d);return isNaN(dt)?'':`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;}
        function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
        function logout(){localStorage.clear();location.href='login.html';}
    </script>
</body>
</html>
