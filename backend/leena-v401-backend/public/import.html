<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Import Panel - Leena EMS v401</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/leena.css">
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <img src="/logo.png" alt="Leena logo" class="sidebar-logo">
            <span>Leena EMS</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="bi bi-grid"></i> All Expos</a></li>
            <li><a href="main-panel.html"><i class="bi bi-columns-gap"></i> Expo Panel</a></li>
            <li><a href="main-panel.html" onclick="localStorage.setItem('loadPage', 'visitors')"><i class="bi bi-people"></i> Visitors</a></li>
            <li><a href="main-panel.html" onclick="localStorage.setItem('loadPage', 'forms')"><i class="bi bi-card-list"></i> Forms</a></li>
            <li><a href="checkins.html"><i class="bi bi-check2-square"></i> Check-ins</a></li>
            <li><a href="terminals.html"><i class="bi bi-pc-display"></i> Terminals</a></li>
            <li><a href="email-templates.html"><i class="bi bi-envelope"></i> Email Templates</a></li>
            <li><a href="email-send.html"><i class="bi bi-send"></i> Send Emails</a></li>
            <li><a href="email-segments.html"><i class="bi bi-megaphone"></i> Email Segments</a></li>
            <li><a href="reports.html"><i class="bi bi-graph-up"></i> Reports</a></li>
            <li><a class="active" href="import.html"><i class="bi bi-download"></i> Import</a></li>
            <li><a href="visitorlog-paginated.html" target="_blank"><i class="bi bi-journals"></i> Visitor Log</a></li>
            <li><a href="admin-dashboard.html"><i class="bi bi-shield-lock"></i> Admin Panel</a></li>
        </ul>
    </nav>

    <div class="main-wrapper">
        <div class="spinner-overlay" id="loadingSpinner">
        <div class="spinner-border text-light" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
        </div>

        <header class="page-header">
            <div>
                <h1>
                    <i class="bi bi-cloud-upload"></i> Visitor Import Panel
                </h1>
                <div class="subtitle">Leena EMS v401 - Bulk Import System</div>
            </div>
            <div class="header-buttons">
                <a class="btn btn-light" href="main-panel.html">
                    <i class="bi bi-arrow-left"></i> Back to Panel
                </a>
            </div>
        </header>

        <main class="main-container">
            <div class="content-panel card" id="mainContent">
                <!-- Content will be loaded dynamically -->
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'https://leena.app/api';
        let selectedFile = null;
        let expos = [];
        let templates = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
        });

        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                showUnauthorized();
                return;
            }
            loadMainContent();
            loadExpos();
            loadTemplates();
        }

        function showUnauthorized() {
            document.getElementById('mainContent').innerHTML = `
                <div class="unauthorized-message">
                    <i class="bi bi-lock display-1"></i>
                    <h3 class="mt-3">Unauthorized Access</h3>
                    <p>Please login to access the import panel.</p>
                </div>
            `;
        }

        function loadMainContent() {
            document.getElementById('mainContent').innerHTML = `
                <div class="row">
                    <div class="col-12">
                        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                            <input type="file" id="fileInput" accept=".xlsx,.xls" style="display: none;" onchange="handleFileSelect(event)">
                            <i class="bi bi-file-earmark-excel display-1 text-primary"></i>
                            <h4 class="mt-3">Click to Upload Excel File</h4>
                            <p class="text-muted">or drag and drop here (Max: 10MB)</p>
                            <p class="small text-muted">Accepted formats: .xlsx, .xls</p>
                        </div>
                        
                        <div class="file-info" id="fileInfo">
                            <strong>Selected File:</strong> <span id="fileName"></span> 
                            (<span id="fileSize"></span>)
                            <button class="btn btn-sm btn-danger float-end" onclick="clearFile()">
                                <i class="bi bi-x"></i> Remove
                            </button>
                        </div>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="bi bi-calendar-event"></i> Select Expo
                        </label>
                        <select class="form-select" id="expoSelect">
                            <option value="">Loading expos...</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="bi bi-person-badge"></i> Visitor Type
                        </label>
                        <select class="form-select" id="visitorType">
                            <option value="visitor">Visitor</option>
                            <option value="exhibitor">Exhibitor</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="bi bi-tag"></i> Source (Optional)
                        </label>
                        <input type="text" class="form-control" id="sourceInput" 
                               placeholder="Will use 'manual' if not in Excel">
                        <small class="text-muted">Leave empty to use value from Excel or default</small>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="bi bi-geo-alt"></i> Origin
                        </label>
                        <input type="text" class="form-control" id="originInput" 
                               value="massimport" readonly disabled>
                        <small class="text-muted">Fixed value for bulk imports</small>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="sendEmailCheck" onchange="toggleEmailTemplate()">
                            <label class="form-check-label" for="sendEmailCheck">
                                <i class="bi bi-envelope"></i> Send confirmation email to imported visitors
                            </label>
                        </div>
                    </div>
                    
                    <div class="col-12 mb-3" id="templateSection" style="display: none;">
                        <label class="form-label">
                            <i class="bi bi-file-text"></i> Email Template
                        </label>
                        <select class="form-select" id="templateSelect">
                            <option value="">Select a template...</option>
                        </select>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-12">
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="#" onclick="downloadSampleExcel()" class="text-decoration-none">
                                <i class="bi bi-download"></i> Download Sample Excel
                            </a>
                            <button class="btn btn-primary" onclick="startImport()">
                                <i class="bi bi-upload"></i> Start Import
                            </button>
                        </div>
                    </div>
                </div>

                <div class="row mt-4" id="resultsSection" style="display: none;">
                    <div class="col-12">
                        <h5>Import Results</h5>
                        <div id="resultsList"></div>
                    </div>
                </div>
            `;
            
            setupDragDrop();
        }

        function setupDragDrop() {
            const zone = document.getElementById('uploadZone');
            if (!zone) return;
            
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('dragover');
            });
            
            zone.addEventListener('dragleave', () => {
                zone.classList.remove('dragover');
            });
            
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            });
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                handleFile(file);
            }
        }

        function handleFile(file) {
            // Check file size (10MB limit)
            if (file.size > 10 * 1024 * 1024) {
                alert('File size exceeds 10MB limit');
                return;
            }
            
            // Check file type
            if (!file.name.match(/\.(xlsx|xls)$/i)) {
                alert('Please select an Excel file (.xlsx or .xls)');
                return;
            }
            
            selectedFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            document.getElementById('fileInfo').classList.add('active');
        }

        function clearFile() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('fileInfo').classList.remove('active');
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            else if (bytes < 1048576) return Math.round(bytes / 1024) + ' KB';
            else return Math.round(bytes / 1048576) + ' MB';
        }

        async function loadExpos() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/expos`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    expos = await response.json();
                    const select = document.getElementById('expoSelect');
                    select.innerHTML = '<option value="">Select an expo...</option>';
                    
                    expos.forEach(expo => {
                        const option = document.createElement('option');
                        option.value = expo.id;
                        option.textContent = expo.name;
                        select.appendChild(option);
                    });
                    
                    // Auto-select if there's a selected expo in localStorage
                    const selectedExpoId = localStorage.getItem('selectedExpoId');
                    if (selectedExpoId) {
                        select.value = selectedExpoId;
                    }
                }
            } catch (error) {
                console.error('Error loading expos:', error);
            }
        }

        async function loadTemplates() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/email-templates`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    templates = data.templates || [];
                    const select = document.getElementById('templateSelect');
                    select.innerHTML = '<option value="">Select a template...</option>';
                    
                    templates.forEach(template => {
                        if (template.is_active) {
                            const option = document.createElement('option');
                            option.value = template.id;
                            option.textContent = template.name;
                            select.appendChild(option);
                        }
                    });
                }
            } catch (error) {
                console.error('Error loading templates:', error);
            }
        }

        function toggleEmailTemplate() {
            const checked = document.getElementById('sendEmailCheck').checked;
            document.getElementById('templateSection').style.display = checked ? 'block' : 'none';
        }

        async function startImport() {
            if (!selectedFile) {
                alert('Please select an Excel file');
                return;
            }
            
            const expoId = document.getElementById('expoSelect').value;
            if (!expoId) {
                alert('Please select an expo');
                return;
            }
            
            const sendEmail = document.getElementById('sendEmailCheck').checked;
            const templateId = document.getElementById('templateSelect').value;
            
            if (sendEmail && !templateId) {
                alert('Please select an email template');
                return;
            }
            
            // Show loading
            document.getElementById('loadingSpinner').classList.add('active');
            
            try {
                const token = localStorage.getItem('token');
                const formData = new FormData();
                
                formData.append('file', selectedFile);
                formData.append('expo_id', expoId);
                formData.append('visitor_type', document.getElementById('visitorType').value);
                formData.append('origin', 'massimport'); // Always massimport
                
                const sourceInput = document.getElementById('sourceInput').value.trim();
                if (sourceInput) {
                    formData.append('source_override', sourceInput);
                }
                
                if (sendEmail) {
                    formData.append('send_email', 'true');
                    formData.append('template_id', templateId);
                }
                
                const response = await fetch(`${API_URL}/visitors/import`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showResults(result);
                } else {
                    alert(result.message || 'Import failed');
                }
            } catch (error) {
                console.error('Import error:', error);
                alert('Import failed. Please try again.');
            } finally {
                document.getElementById('loadingSpinner').classList.remove('active');
            }
        }

        function showResults(result) {
            const resultsSection = document.getElementById('resultsSection');
            const resultsList = document.getElementById('resultsList');
            
            resultsSection.style.display = 'block';
            
            let html = `
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i> 
                    Import completed: ${result.success_count || 0} successful, 
                    ${result.failed_count || 0} failed
                </div>
            `;
            
            if (result.errors && result.errors.length > 0) {
                html += '<h6>Errors:</h6>';
                result.errors.forEach(error => {
                    html += `<div class="result-item error">Row ${error.row}: ${error.message}</div>`;
                });
            }
            
            if (result.imported && result.imported.length > 0) {
                html += '<h6>Successfully Imported:</h6>';
                result.imported.forEach(item => {
                    html += `
                        <div class="result-item">
                            ${item.name} - ${item.email} 
                            ${item.badge_id ? `(Badge: ${item.badge_id})` : ''}
                        </div>
                    `;
                });
            }
            
            resultsList.innerHTML = html;
        }

        function downloadSampleExcel() {
            const sampleData = [
                ['name', 'email', 'company', 'phone', 'country', 'job_title'],
                ['John Doe', 'john@example.com', 'ABC Corp', '+1234567890', 'USA', 'Manager'],
                ['Jane Smith', 'jane@example.com', 'XYZ Ltd', '+9876543210', 'UK', 'Director']
            ];
            
            // Create CSV content
            const csvContent = sampleData.map(row => row.join(',')).join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'sample_import.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
