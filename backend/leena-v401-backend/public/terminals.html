<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Management - Leena EMS v401</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/leena.css">
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <img src="/logo.png" alt="Leena logo" class="sidebar-logo">
            <span>Leena EMS</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="main-panel.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a href="checkins.html"><i class="bi bi-check2-square"></i> Check-ins</a></li>
            <li><a class="active" href="terminals.html"><i class="bi bi-pc-display"></i> Terminals</a></li>
            <li><a href="email-templates.html"><i class="bi bi-envelope"></i> Email Templates</a></li>
            <li><a href="email-segments.html"><i class="bi bi-megaphone"></i> Email Segments</a></li>
            <li><a href="reports.html"><i class="bi bi-graph-up"></i> Reports</a></li>
            <li><a href="import.html"><i class="bi bi-download"></i> Import</a></li>
        </ul>
    </nav>

    <div class="main-wrapper">
        <header class="page-header">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1>
                            <i class="bi bi-pc-display"></i>
                            Terminal Management
                        </h1>
                        <div class="subtitle">Configure check-in terminals for your expo</div>
                    </div>
                    <div>
                        <button class="btn btn-light" onclick="goBack()">
                            <i class="bi bi-arrow-left"></i> Back to Panel
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-container">
        <!-- Alert Messages -->
        <div id="alertMessage" style="display: none;"></div>

        <!-- Add Terminal Form -->
        <div class="card">
            <div class="card-header">
                <span><i class="bi bi-plus-circle"></i> Add New Terminal</span>
            </div>
            <div class="card-body">
                <form id="addTerminalForm">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="mb-3">
                                <label class="form-label">Hall <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="hall" placeholder="e.g. Hall A, Main" required>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="mb-3">
                                <label class="form-label">Terminal No <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="terminalNo" placeholder="e.g. T1, T2" required>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="mb-3">
                                <label class="form-label">Settings</label>
                                <div class="d-flex gap-4 mt-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="autoCheckin" checked>
                                        <label class="form-check-label" for="autoCheckin">
                                            Auto Check-in
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="isActive" checked>
                                        <label class="form-check-label" for="isActive">
                                            Active
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="mb-3">
                                <label class="form-label">&nbsp;</label>
                                <div>
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="bi bi-plus-lg"></i> Add Terminal
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Terminal Info Box -->
        <div class="terminal-info-box">
            <div class="row">
                <div class="col-md-4">
                    <div class="terminal-info-item">
                        <i class="bi bi-link-45deg text-primary"></i>
                        <span class="terminal-info-label">Scanner URL:</span>
                        <span class="terminal-info-value" id="scannerUrl">Loading...</span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="terminal-info-item">
                        <i class="bi bi-calendar-event text-primary"></i>
                        <span class="terminal-info-label">Current Expo:</span>
                        <span class="terminal-info-value" id="currentExpo">Loading...</span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="terminal-info-item">
                        <i class="bi bi-pc-display text-primary"></i>
                        <span class="terminal-info-label">Total Terminals:</span>
                        <span class="terminal-info-value" id="totalTerminals">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Terminals List -->
        <div class="card">
            <div class="card-header">
                <span><i class="bi bi-list"></i> Terminals</span>
                <button class="btn btn-sm btn-secondary" onclick="loadTerminals()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
            </div>
            <div class="card-body p-0">
                <div id="terminalsContent">
                    <div class="loading-spinner">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Configuration
        const API_BASE_URL = '/api';
        let terminals = [];
        let expoId = null;
        let token = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Get auth data
            token = localStorage.getItem('token');
            expoId = localStorage.getItem('selectedExpoId');
            
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            
            if (!expoId) {
                alert('No expo selected. Please select an expo first.');
                window.location.href = 'dashboard.html';
                return;
            }
            
            // Setup form listener
            document.getElementById('addTerminalForm').addEventListener('submit', handleAddTerminal);
            
            // Load initial data
            loadTerminals();
            displayInfo();
        });

        // Display info
        function displayInfo() {
            // Scanner URL
            const baseUrl = window.location.origin;
            document.getElementById('scannerUrl').textContent = `${baseUrl}/qrscanner.html`;
            
            // Current Expo
            const expoName = localStorage.getItem('selectedExpoName') || `Expo #${expoId}`;
            document.getElementById('currentExpo').textContent = expoName;
        }

        // Load terminals
        async function loadTerminals() {
            showLoading(true);
            
            try {
                const response = await fetch(`${API_BASE_URL}/terminals?expo_id=${expoId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load terminals');
                }
                
                const data = await response.json();
                terminals = data.terminals || [];
                
                renderTerminals();
                document.getElementById('totalTerminals').textContent = terminals.length;
                
            } catch (error) {
                console.error('Error loading terminals:', error);
                showAlert('Failed to load terminals. Please try again.', 'danger');
            } finally {
                showLoading(false);
            }
        }

        // Generate scanner URL for a terminal
        function generateScannerUrl(terminal) {
            if (!terminal.terminal_key) {
                return null;
            }
            const baseUrl = window.location.origin;
            const params = new URLSearchParams({
                terminalKey: terminal.terminal_key,
                hall: terminal.hall,
                terminal: terminal.terminal_no
            });
            return `${baseUrl}/qrscanner.html?${params.toString()}`;
        }

        // Render terminals table
        function renderTerminals() {
            const container = document.getElementById('terminalsContent');
            
            if (terminals.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="bi bi-pc-display"></i>
                        </div>
                        <h3>No Terminals Yet</h3>
                        <p>Add your first terminal to start managing check-in points</p>
                    </div>
                `;
                return;
            }
            
            let html = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Hall</th>
                                <th>Terminal No</th>
                                <th>Auto Check-in</th>
                                <th>Status</th>
                                <th>Terminal Key</th>
                                <th>Created</th>
                                <th>Scanner Link</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            terminals.forEach(terminal => {
                const createdAt = new Date(terminal.created_at).toLocaleDateString();
                const scannerUrl = generateScannerUrl(terminal);
                const hasKey = !!terminal.terminal_key;
                
                html += `
                    <tr>
                        <td><strong>${escapeHtml(terminal.hall)}</strong></td>
                        <td>${escapeHtml(terminal.terminal_no)}</td>
                        <td>
                            <span class="badge ${terminal.auto_checkin ? 'badge-success' : 'badge-secondary'}">
                                ${terminal.auto_checkin ? 'Enabled' : 'Disabled'}
                            </span>
                        </td>
                        <td>
                            <span class="badge ${terminal.is_active !== false ? 'badge-success' : 'badge-secondary'}">
                                ${terminal.is_active !== false ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td>
                            ${hasKey 
                                ? `<span class="badge badge-success"><i class="bi bi-key"></i> Generated</span>` 
                                : `<span class="badge badge-warning"><i class="bi bi-exclamation-triangle"></i> Not Generated</span>`
                            }
                        </td>
                        <td>${createdAt}</td>
                        <td>
                            ${hasKey 
                                ? `<button class="btn btn-sm btn-success" onclick="copyScannerUrl('${escapeHtml(scannerUrl)}')">
                                       <i class="bi bi-clipboard-check"></i> Copy Scanner URL
                                   </button>`
                                : `<button class="btn btn-sm btn-outline-primary" disabled title="Terminal key not generated">
                                       <i class="bi bi-clipboard"></i> Copy Scanner URL
                                   </button>
                                   <div class="no-key-text">Key not generated</div>`
                            }
                        </td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="deleteTerminal(${terminal.id})">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            html += `
                        </tbody>
                    </table>
                </div>
            `;
            
            container.innerHTML = html;
        }

        // Copy scanner URL to clipboard
        function copyScannerUrl(url) {
            navigator.clipboard.writeText(url).then(() => {
                showToast('Scanner URL copied to clipboard!', 'success');
            }).catch((err) => {
                console.error('Failed to copy:', err);
                showToast('Failed to copy URL', 'error');
            });
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            
            // Remove toast after 3 seconds
            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        // Add terminal
        async function handleAddTerminal(e) {
            e.preventDefault();
            
            const hall = document.getElementById('hall').value.trim();
            const terminalNo = document.getElementById('terminalNo').value.trim();
            const autoCheckin = document.getElementById('autoCheckin').checked;
            const isActive = document.getElementById('isActive').checked;
            
            if (!hall || !terminalNo) {
                showAlert('Please fill in all required fields', 'danger');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/terminals`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        expo_id: expoId,
                        hall: hall,
                        terminal_no: terminalNo,
                        auto_checkin: autoCheckin,
                        is_active: isActive
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to add terminal');
                }
                
                showAlert('Terminal added successfully!', 'success');
                document.getElementById('addTerminalForm').reset();
                loadTerminals();
                
            } catch (error) {
                console.error('Error adding terminal:', error);
                showAlert(error.message || 'Failed to add terminal', 'danger');
            }
        }

        // Delete terminal
        async function deleteTerminal(terminalId) {
            if (!confirm('Are you sure you want to delete this terminal?')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/terminals/${terminalId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to delete terminal');
                }
                
                showAlert('Terminal deleted successfully!', 'success');
                loadTerminals();
                
            } catch (error) {
                console.error('Error deleting terminal:', error);
                showAlert('Failed to delete terminal', 'danger');
            }
        }

        // Copy link to clipboard (legacy function kept for compatibility)
        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                showAlert('Scanner link copied to clipboard!', 'success');
            }).catch(() => {
                showAlert('Failed to copy link', 'danger');
            });
        }

        // UI Helper functions
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `
                <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                ${message}
            `;
            alertDiv.style.display = 'block';
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
        }

        function showLoading(show) {
            const container = document.getElementById('terminalsContent');
            if (show) {
                container.innerHTML = `
                    <div class="loading-spinner">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function goBack() {
            window.location.href = 'main-panel.html';
        }
    </script>
</body>
</html>
