<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminals - Leena EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4a6fa5; --primary-hover: #3d5d8a; --primary-light: #eef2f7;
            --sidebar-bg: #1a1a2e; --sidebar-hover: #252542; --sidebar-text: #9ca3af; --sidebar-text-active: #fff;
            --bg-main: #f8fafc; --bg-card: #fff; --border-color: #e2e8f0;
            --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
            --success: #10b981; --success-bg: #d1fae5; --warning: #f59e0b; --warning-bg: #fef3c7; --danger: #ef4444;
            --radius-md: 8px; --radius-lg: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-primary); font-size: 14px; }
        .app-shell { display: flex; min-height: 100vh; }
        .sidebar { width: 256px; background: var(--sidebar-bg); position: fixed; top: 0; left: 0; bottom: 0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #252542; }
        .sidebar-logo { height: 80px; }
        .sidebar-nav { flex: 1; padding: 16px 12px; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--sidebar-text); padding: 0 12px 8px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: var(--sidebar-text); text-decoration: none; border-radius: var(--radius-md); margin-bottom: 2px; transition: all 0.15s; }
        .nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
        .nav-item.active { background: #2d2d4a; color: var(--sidebar-text-active); }
        .nav-item i { font-size: 18px; width: 20px; }
        .nav-item span { font-size: 13px; font-weight: 500; }
        .nav-divider { height: 1px; background: #252542; margin: 16px 12px; }
        .main-wrapper { flex: 1; margin-left: 256px; display: flex; flex-direction: column; }
        .main-header { height: 64px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 50; }
        .main-header h1 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .main-header h1 i { color: var(--primary); }
        .main-content { flex: 1; padding: 24px; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; font-size: 13px; font-weight: 500; border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer; transition: all 0.15s; }
        .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border-color: var(--border-color); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: white; color: var(--danger); border-color: var(--border-color); }
        .btn-danger:hover { background: #fee2e2; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); margin-bottom: 24px; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .card-body { padding: 20px; }
        .form-label { font-size: 13px; font-weight: 500; margin-bottom: 6px; display: block; }
        .form-control, .form-select { padding: 9px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 13px; width: 100%; }
        .form-control:focus, .form-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(74,111,165,0.1); }
        .form-check { display: flex; align-items: center; gap: 8px; }
        .form-check-input { width: 16px; height: 16px; }
        .info-box { background: var(--primary-light); border: 1px solid #c7d9f1; border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 24px; }
        .info-row { display: flex; gap: 24px; flex-wrap: wrap; }
        .info-item { display: flex; align-items: center; gap: 8px; }
        .info-item i { color: var(--primary); }
        .info-label { color: var(--text-secondary); font-size: 12px; }
        .info-value { font-weight: 600; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--bg-main); padding: 12px 16px; text-align: left; font-weight: 600; color: var(--text-secondary); font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); }
        td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        tr:hover { background: var(--bg-main); }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
        .badge-success { background: var(--success-bg); color: #065f46; }
        .badge-warning { background: var(--warning-bg); color: #92400e; }
        .badge-secondary { background: #f3f4f6; color: #6b7280; }
        .empty-state { text-align: center; padding: 60px 24px; }
        .empty-state-icon { width: 64px; height: 64px; background: var(--bg-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; color: var(--text-muted); }
        .loading-spinner { display: flex; justify-content: center; padding: 40px; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .alert { padding: 12px 16px; border-radius: var(--radius-md); margin-bottom: 16px; display: none; }
        .alert-success { background: var(--success-bg); color: #065f46; }
        .alert-danger { background: #fee2e2; color: #991b1b; }
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast { background: var(--success); color: white; padding: 12px 20px; border-radius: var(--radius-md); margin-top: 8px; display: flex; align-items: center; gap: 8px; animation: slideIn 0.3s; }
        .toast.error { background: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 768px) { .sidebar { display: none; } .main-wrapper { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="app-shell">
        <nav class="sidebar">
            <div class="sidebar-header">
                <img src="assets/Leena_logo_white_nobg.png" alt="Leena" class="sidebar-logo">
            </div>
            <div class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Overview</div>
                    <a class="nav-item" href="main-panel-v2.html"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Management</div>
                    <a class="nav-item" href="visitorlog-paginated.html"><i class="bi bi-people"></i><span>Visitors</span></a>
                    <a class="nav-item" href="main-panel-v2.html" onclick="localStorage.setItem('loadPage','forms')"><i class="bi bi-ui-checks-grid"></i><span>Forms</span></a>
                    <a class="nav-item" href="checkins.html"><i class="bi bi-check2-square"></i><span>Check-ins</span></a>
                    <a class="nav-item active" href="terminals.html"><i class="bi bi-pc-display"></i><span>Terminals</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Communication</div>
                    <a class="nav-item" href="email-templates.html"><i class="bi bi-envelope"></i><span>Email Templates</span></a>
                    <a class="nav-item" href="email-send.html"><i class="bi bi-send"></i><span>Send Emails</span></a>
                    <a class="nav-item" href="email-segments.html"><i class="bi bi-megaphone"></i><span>Email Segments</span></a>
                </div>
                <div class="nav-divider"></div>
                <div class="nav-section">
                    <div class="nav-section-title">Tools</div>
                    <a class="nav-item" href="reports.html"><i class="bi bi-graph-up"></i><span>Reports</span></a>
                    <a class="nav-item" href="import.html"><i class="bi bi-download"></i><span>Import</span></a>
                </div>
            </div>
        </nav>
        
        <div class="main-wrapper">
            <header class="main-header">
                <h1><i class="bi bi-pc-display"></i> Terminal Management</h1>
                <button class="btn btn-secondary" onclick="window.location.href='main-panel-v2.html'"><i class="bi bi-arrow-left"></i> Back</button>
            </header>
            
            <main class="main-content">
                <div id="alertMessage" class="alert"></div>
                
                <div class="card">
                    <div class="card-header"><i class="bi bi-plus-circle"></i> Add New Terminal</div>
                    <div class="card-body">
                        <form id="addTerminalForm" style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;">
                            <div style="flex:1;min-width:150px;">
                                <label class="form-label">Hall *</label>
                                <input type="text" class="form-control" id="hall" placeholder="e.g. Hall A" required>
                            </div>
                            <div style="flex:1;min-width:150px;">
                                <label class="form-label">Terminal No *</label>
                                <input type="text" class="form-control" id="terminalNo" placeholder="e.g. T1" required>
                            </div>
                            <div style="flex:1;min-width:200px;">
                                <label class="form-label">Settings</label>
                                <div style="display:flex;gap:16px;padding-top:8px;">
                                    <label class="form-check"><input type="checkbox" class="form-check-input" id="autoCheckin" checked> Auto Check-in</label>
                                    <label class="form-check"><input type="checkbox" class="form-check-input" id="isActive" checked> Active</label>
                                </div>
                            </div>
                            <div>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add Terminal</button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="info-box">
                    <div class="info-row">
                        <div class="info-item"><i class="bi bi-link-45deg"></i><span class="info-label">Scanner URL:</span><span class="info-value" id="scannerUrl">Loading...</span></div>
                        <div class="info-item"><i class="bi bi-calendar-event"></i><span class="info-label">Expo:</span><span class="info-value" id="currentExpo">Loading...</span></div>
                        <div class="info-item"><i class="bi bi-pc-display"></i><span class="info-label">Total:</span><span class="info-value" id="totalTerminals">0</span></div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <span><i class="bi bi-list"></i> Terminals</span>
                        <button class="btn btn-sm btn-secondary" onclick="loadTerminals()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                    </div>
                    <div class="card-body" style="padding:0;">
                        <div id="terminalsContent"><div class="loading-spinner"><div class="spinner"></div></div></div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>

    <script>
        const API_BASE_URL = '/api';
        let terminals = [], expoId = null, token = null;

        document.addEventListener('DOMContentLoaded', () => {
            token = localStorage.getItem('token');
            expoId = localStorage.getItem('selectedExpoId');
            if (!token) { window.location.href = 'login_new.html'; return; }
            if (!expoId) { alert('No expo selected.'); window.location.href = 'dashboard_new.html'; return; }
            document.getElementById('addTerminalForm').addEventListener('submit', handleAddTerminal);
            loadTerminals();
            displayInfo();
        });

        function displayInfo() {
            document.getElementById('scannerUrl').textContent = `${window.location.origin}/qrscanner.html`;
            document.getElementById('currentExpo').textContent = localStorage.getItem('selectedExpoName') || `Expo #${expoId}`;
        }

        async function loadTerminals() {
            document.getElementById('terminalsContent').innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
            try {
                const response = await fetch(`${API_BASE_URL}/terminals?expo_id=${expoId}`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!response.ok) throw new Error('Failed');
                const data = await response.json();
                terminals = data.terminals || [];
                renderTerminals();
                document.getElementById('totalTerminals').textContent = terminals.length;
            } catch (e) { showAlert('Failed to load terminals', 'danger'); }
        }

        function generateScannerUrl(t) {
            if (!t.terminal_key) return null;
            return `${window.location.origin}/qrscanner.html?terminalKey=${t.terminal_key}&hall=${encodeURIComponent(t.hall)}&terminal=${encodeURIComponent(t.terminal_no)}`;
        }

        function renderTerminals() {
            const container = document.getElementById('terminalsContent');
            if (terminals.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><i class="bi bi-pc-display"></i></div><h3>No Terminals Yet</h3><p>Add your first terminal above</p></div>';
                return;
            }
            let html = '<table><thead><tr><th>Hall</th><th>Terminal</th><th>Auto Check-in</th><th>Status</th><th>Key</th><th>Created</th><th>Scanner Link</th><th>Actions</th></tr></thead><tbody>';
            terminals.forEach(t => {
                const url = generateScannerUrl(t);
                const hasKey = !!t.terminal_key;
                html += `<tr>
                    <td><strong>${escapeHtml(t.hall)}</strong></td>
                    <td>${escapeHtml(t.terminal_no)}</td>
                    <td><span class="badge ${t.auto_checkin ? 'badge-success' : 'badge-secondary'}">${t.auto_checkin ? 'Enabled' : 'Disabled'}</span></td>
                    <td><span class="badge ${t.is_active !== false ? 'badge-success' : 'badge-secondary'}">${t.is_active !== false ? 'Active' : 'Inactive'}</span></td>
                    <td><span class="badge ${hasKey ? 'badge-success' : 'badge-warning'}">${hasKey ? 'Generated' : 'Missing'}</span></td>
                    <td>${new Date(t.created_at).toLocaleDateString()}</td>
                    <td>${hasKey ? `<button class="btn btn-sm btn-success" onclick="copyScannerUrl('${escapeHtml(url)}')"><i class="bi bi-clipboard-check"></i> Copy</button>` : '<span class="text-muted">No key</span>'}</td>
                    <td><button class="btn btn-sm btn-danger" onclick="deleteTerminal(${t.id})"><i class="bi bi-trash"></i></button></td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function copyScannerUrl(url) {
            navigator.clipboard.writeText(url).then(() => showToast('Scanner URL copied!')).catch(() => showToast('Failed to copy', 'error'));
        }

        async function handleAddTerminal(e) {
            e.preventDefault();
            const hall = document.getElementById('hall').value.trim();
            const terminalNo = document.getElementById('terminalNo').value.trim();
            if (!hall || !terminalNo) { showAlert('Fill all fields', 'danger'); return; }
            try {
                const response = await fetch(`${API_BASE_URL}/terminals`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ expo_id: expoId, hall, terminal_no: terminalNo, auto_checkin: document.getElementById('autoCheckin').checked, is_active: document.getElementById('isActive').checked })
                });
                if (!response.ok) throw new Error('Failed');
                showAlert('Terminal added!', 'success');
                document.getElementById('addTerminalForm').reset();
                loadTerminals();
            } catch (e) { showAlert('Failed to add terminal', 'danger'); }
        }

        async function deleteTerminal(id) {
            if (!confirm('Delete this terminal?')) return;
            try {
                const response = await fetch(`${API_BASE_URL}/terminals/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                if (!response.ok) throw new Error('Failed');
                showAlert('Terminal deleted', 'success');
                loadTerminals();
            } catch (e) { showAlert('Failed to delete', 'danger'); }
        }

        function showAlert(msg, type) {
            const el = document.getElementById('alertMessage');
            el.className = `alert alert-${type}`;
            el.innerHTML = `<i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${msg}`;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'error' : ''}`;
            toast.innerHTML = `<i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${msg}`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }
    </script>
</body>
</html>
