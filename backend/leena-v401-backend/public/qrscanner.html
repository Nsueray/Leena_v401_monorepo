<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
    <title>Badge Scanner - Leena EMS v402</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-color: #667eea;
            --secondary-color: #764ba2;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .scanner-container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .scanner-header {
            background: var(--primary-gradient);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .scanner-header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .scanner-header .subtitle {
            opacity: 0.9;
            margin-top: 10px;
            font-size: 0.95rem;
        }
        
        .terminal-info {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px 15px;
            margin-top: 15px;
            display: inline-block;
        }
        
        .scanner-body { padding: 30px; }
        .scan-section { margin-bottom: 30px; }
        .scan-input-wrapper { position: relative; }
        .scan-input-wrapper i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 1.5rem; color: var(--primary-color); }
        .scan-input { width: 100%; padding: 20px 20px 20px 60px; font-size: 1.2rem; border: 2px solid #e9ecef; border-radius: 15px; transition: all 0.3s; }
        .scan-input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15); }
        .scan-input::placeholder { color: #adb5bd; }
        
        .divider { text-align: center; margin: 30px 0; position: relative; }
        .divider::before { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: #e9ecef; }
        .divider span { background: white; padding: 0 20px; position: relative; color: #6c757d; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .toggle-manual { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; cursor: pointer; user-select: none; }
        .toggle-manual input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        .toggle-manual label { margin: 0; cursor: pointer; font-weight: 500; color: #495057; }
        
        .manual-form { display: none; animation: slideDown 0.3s ease-out; }
        .manual-form.active { display: block; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-label { font-weight: 500; color: #495057; margin-bottom: 8px; font-size: 0.9rem; }
        .form-label .required { color: #e74c3c; }
        .form-control { border: 1px solid #dee2e6; border-radius: 10px; padding: 12px 15px; font-size: 1rem; transition: all 0.3s; }
        .form-control:focus { border-color: var(--primary-color); box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15); }
        .form-select { border: 1px solid #dee2e6; border-radius: 10px; padding: 12px 15px; font-size: 1rem; }
        
        .btn { padding: 15px 30px; font-size: 1.1rem; font-weight: 500; border-radius: 10px; border: none; transition: all 0.3s; cursor: pointer; width: 100%; }
        .btn-primary { background: var(--primary-gradient); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .settings-section { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-top: 20px; }
        .setting-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
        .setting-label { font-weight: 500; color: #495057; }
        .setting-description { font-size: 0.85rem; color: #6c757d; margin-top: 5px; }
        .form-switch { margin: 0; }
        .form-switch .form-check-input { width: 50px; height: 25px; cursor: pointer; }
        .form-switch .form-check-input:checked { background-color: var(--primary-color); border-color: var(--primary-color); }
        
        .alert { border-radius: 10px; padding: 15px 20px; margin-bottom: 20px; border: none; }
        .alert-info { background: #d1ecf1; color: #0c5460; }
        .alert-danger { background: #f8d7da; color: #721c24; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-warning { background: #fff3cd; color: #856404; }
        
        .loading-spinner { display: none; text-align: center; padding: 20px; }
        .loading-spinner.active { display: block; }
        .spinner-border { width: 3rem; height: 3rem; border-width: 0.3rem; color: var(--primary-color); }
        
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } .scanner-header h1 { font-size: 1.5rem; } }
    </style>
</head>

    <script>
        const API_BASE_URL = '/api';
        let hall = null;
        let terminal = null;
        let terminalKey = null;
        let autoCheckinEnabled = true;
        let isProcessing = false;
        
        document.addEventListener('DOMContentLoaded', () => {
            processUrlParameters();
            loadTerminalSettings();
            updateTerminalDisplay();
            checkRequiredData();
            setupEventListeners();
        });
        
        function processUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlHall = urlParams.get('hall');
            const urlTerminal = urlParams.get('terminal');
            const urlTerminalKey = urlParams.get('terminalKey') || urlParams.get('terminal_key');
            
            if (urlHall) { localStorage.setItem('hall', urlHall); hall = urlHall; }
            if (urlTerminal) { localStorage.setItem('terminal', urlTerminal); terminal = urlTerminal; }
            if (urlTerminalKey) { localStorage.setItem('terminalKey', urlTerminalKey); terminalKey = urlTerminalKey; console.log('Terminal key set from URL'); }
        }
        
        function loadTerminalSettings() {
            if (!hall) hall = localStorage.getItem('hall') || 'main';
            if (!terminal) terminal = localStorage.getItem('terminal') || '1';
            if (!terminalKey) terminalKey = localStorage.getItem('terminalKey') || null;
            if (terminalKey) console.log('Terminal mode active with key:', terminalKey.substring(0, 8) + '...');
        }
        
        function updateTerminalDisplay() {
            document.getElementById('hallDisplay').textContent = hall || 'Not Set';
            document.getElementById('terminalDisplay').textContent = terminal || 'Not Set';
        }
        
        function checkRequiredData() {
            const expoId = localStorage.getItem('selectedExpoId');
            const token = localStorage.getItem('token');
            
            if (terminalKey) {
                if (!hall || !terminal) showAlert('Terminal or Hall not configured.', 'warning');
                return;
            }
            if (!expoId) showAlert('No expo selected. Please select an expo from the dashboard.', 'warning');
            if (!token) { showAlert('Authentication required. Redirecting to login...', 'danger'); setTimeout(() => { window.location.href = 'login.html'; }, 2000); }
        }
        
        function getStorageData() {
            return {
                expoId: localStorage.getItem('selectedExpoId'),
                organizerId: localStorage.getItem('organizerId'),
                token: localStorage.getItem('token'),
                terminalKey: localStorage.getItem('terminalKey')
            };
        }
        
        function buildHeaders(includeContentType = false) {
            const headers = {};
            if (includeContentType) headers['Content-Type'] = 'application/json';
            if (terminalKey) { headers['x-terminal-key'] = terminalKey; }
            else { const token = localStorage.getItem('token'); if (token) headers['Authorization'] = `Bearer ${token}`; }
            return headers;
        }
        
        function buildBadgeUrl(qrCode) {
            let url = `badge.html?qr=${encodeURIComponent(qrCode)}`;
            if (terminalKey) url += `&terminal_key=${encodeURIComponent(terminalKey)}`;
            return url;
        }
        
        function setupEventListeners() {
            const scanInput = document.getElementById('scanInput');
            scanInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !isProcessing) handleQRScan(); });
            
            document.getElementById('manualToggle').addEventListener('change', (e) => {
                const manualForm = document.getElementById('manualForm');
                if (e.target.checked) { manualForm.classList.add('active'); document.getElementById('firstName').focus(); }
                else { manualForm.classList.remove('active'); scanInput.focus(); }
            });
            
            document.getElementById('registrationForm').addEventListener('submit', async (e) => { e.preventDefault(); if (!isProcessing) await handleManualRegistration(); });
            document.getElementById('autoCheckin').addEventListener('change', (e) => { autoCheckinEnabled = e.target.checked; });
        }
        
        // ==================== QR SCAN ====================
        // All visitor types (visitor, exhibitor, vip, press, staff) go through the same flow:
        // 1. Look up visitor by QR
        // 2. Auto check-in (if enabled)
        // 3. Redirect to badge print page
        async function handleQRScan() {
            const scanInput = document.getElementById('scanInput');
            let qrCode = scanInput.value.trim();
            
            if (!qrCode) { showAlert('Please scan or enter a QR code', 'danger'); return; }
            
            const { expoId, token } = getStorageData();
            if (!terminalKey && (!expoId || !token)) { showAlert('Missing required data. Please login again.', 'danger'); return; }
            
            isProcessing = true;
            showLoading(true);
            hideAlert();
            
            try {
                // If input looks like email, search by email first
                if (qrCode.includes('@')) {
                    showAlert('Searching by email...', 'warning');
                    const searchUrl = terminalKey
                        ? `${API_BASE_URL}/terminal/visitor-by-email?email=${encodeURIComponent(qrCode)}`
                        : `${API_BASE_URL}/visitors/paginated?expo_id=${expoId}&search=${encodeURIComponent(qrCode)}&limit=1`;
                    const searchHeaders = terminalKey
                        ? { 'x-terminal-key': terminalKey }
                        : { 'Authorization': `Bearer ${token}` };
                    const searchRes = await fetch(searchUrl, { headers: searchHeaders });
                    if (searchRes.ok) {
                        const searchData = await searchRes.json();
                        const found = searchData.visitors ? searchData.visitors[0] : (searchData.visitor || null);
                        if (found && (found.qr_code || found.qrCode)) {
                            qrCode = found.qr_code || found.qrCode;
                            hideAlert();
                        } else {
                            throw new Error('No visitor found with this email');
                        }
                    } else {
                        throw new Error('Email search failed');
                    }
                }
                if (terminalKey) {
                    // Terminal mode
                    const response = await fetch(`${API_BASE_URL}/terminal/visitor-by-qr?qr=${encodeURIComponent(qrCode)}`, { headers: buildHeaders() });
                    if (!response.ok) throw new Error('Badge not found');
                    
                    const result = await response.json();
                    const visitor = result.visitor;
                    console.log('Visitor found (terminal mode):', visitor);
                    
                    if (autoCheckinEnabled && visitor.id) {
                        await performCheckin(visitor.id);
                    }
                } else {
                    // Normal mode
                    const response = await fetch(`${API_BASE_URL}/visitors/badge/${qrCode}`, { headers: buildHeaders() });
                    if (!response.ok) throw new Error('Badge not found');
                    
                    const result = await response.json();
                    const visitorData = result.visitor || result;
                    console.log('Visitor found:', visitorData);
                    
                    if (autoCheckinEnabled) {
                        await performCheckin(visitorData.id || result.id);
                    }
                }
                
                // Badge print for ALL visitor types
                window.open(buildBadgeUrl(qrCode), '_blank', 'width=600,height=400'); document.getElementById('scanInput').value = ''; document.getElementById('scanInput').focus();
                
            } catch (error) {
                console.error('Scan error:', error);
                showAlert('Badge not found. Please try manual registration.', 'danger');
                scanInput.value = '';
                scanInput.focus();
            } finally {
                isProcessing = false;
                showLoading(false);
            }
        }
        
        // ==================== MANUAL REGISTRATION ====================
        async function handleManualRegistration() {
            const { expoId, organizerId, token } = getStorageData();
            if (!expoId || !token) { showAlert('Missing required data. Please login again.', 'danger'); return; }
            
            isProcessing = true;
            showLoading(true);
            hideAlert();
            
            try {
                const formData = {
                    name: document.getElementById('firstName').value.trim(),
                    last_name: document.getElementById('lastName').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    company: document.getElementById('company').value.trim(),
                    job_title: document.getElementById('jobTitle').value.trim() || 'N/A',
                    country: document.getElementById('country').value || 'Nigeria',
                    origin: 'onsite',
                    source: 'manual',
                    visitor_type: document.getElementById('visitorType').value,
                    expo_id: expoId,
                    organizer_id: organizerId || '1',
                    hall: hall,
                    terminal: terminal
                };
                
                console.log('Submitting manual registration:', formData);
                
                const response = await fetch(`${API_BASE_URL}/visitors/manual`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(formData)
                });
                
                if (!response.ok) { const error = await response.json(); throw new Error(error.message || 'Registration failed'); }
                
                const result = await response.json();
                console.log('Registration successful:', result);
                
                const qrCode = result.qr_code || result.qrCode || result.badge_id;
                if (!qrCode) throw new Error('Registration successful but no QR code received');
                
                if (autoCheckinEnabled && result.visitor_id) {
                    await performCheckin(result.visitor_id);
                }
                
                showAlert('Registration successful!', 'success');
                isProcessing = false;
                showLoading(false);
                setTimeout(() => { window.open(buildBadgeUrl(qrCode), '_blank', 'width=600,height=400'); document.getElementById('scanInput').value = ''; document.getElementById('scanInput').focus(); document.getElementById('manualToggle').checked = false; document.getElementById('manualForm').classList.remove('active'); document.getElementById('registrationForm').reset(); }, 500);
                
            } catch (error) {
                console.error('Registration error:', error);
                showAlert(error.message || 'Registration failed. Please try again.', 'danger');
                isProcessing = false;
                showLoading(false);
            }
        }
        
        // ==================== CHECK-IN ====================
        async function performCheckin(visitorId) {
            const { expoId } = getStorageData();
            
            if (terminalKey) {
                if (!visitorId) return;
                try {
                    const response = await fetch(`${API_BASE_URL}/terminal/checkin`, {
                        method: 'POST',
                        headers: buildHeaders(true),
                        body: JSON.stringify({ visitor_id: visitorId, notes: `Scanned at ${hall || 'main'} - Terminal ${terminal || '1'}` })
                    });
                    const result = await response.json();
                    if (response.ok) console.log('Terminal check-in successful');
                    else console.warn('Terminal check-in failed:', result);
                } catch (error) { console.error('Terminal check-in error:', error); }
                return;
            }
            
            if (!expoId || !visitorId) return;
            try {
                const response = await fetch(`${API_BASE_URL}/checkins`, {
                    method: 'POST',
                    headers: buildHeaders(true),
                    body: JSON.stringify({
                        visitor_id: visitorId, expo_id: expoId,
                        hall: hall || 'main', terminal: terminal || '1',
                        checkin_type: 'entry', checkin_time: new Date().toISOString()
                    })
                });
                const result = await response.json();
                if (response.ok) console.log('Check-in successful');
                else console.warn('Check-in failed:', result);
            } catch (error) { console.error('Check-in error:', error); }
        }
        
        // ==================== UI HELPERS ====================
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
        }
        function hideAlert() { document.getElementById('alertMessage').style.display = 'none'; }
        function showLoading(show) {
            const spinner = document.getElementById('loadingSpinner');
            const registerBtn = document.getElementById('registerBtn');
            if (show) { spinner.classList.add('active'); if (registerBtn) registerBtn.disabled = true; }
            else { spinner.classList.remove('active'); if (registerBtn) registerBtn.disabled = false; }
        }
    </script>
</body>
</html>
