<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leena EMS - Management Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Core brand colors */
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            
            /* Sidebar */
            --sidebar-bg: #111827;
            --sidebar-hover: #1f2937;
            --sidebar-active: #374151;
            --sidebar-text: #9ca3af;
            --sidebar-text-active: #ffffff;
            --sidebar-border: #1f2937;
            
            /* Content */
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;
            
            /* Text */
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            /* Status */
            --success: #10b981;
            --success-bg: #d1fae5;
            --warning: #f59e0b;
            --warning-bg: #fef3c7;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
            --info: #3b82f6;
            --info-bg: #dbeafe;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            
            /* Radius */
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            
            /* Layout */
            --sidebar-width: 256px;
            --sidebar-collapsed: 72px;
            --header-height: 64px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* =====================================================
           APP SHELL
        ===================================================== */
        .app-shell {
            display: flex;
            min-height: 100vh;
        }
        
        /* =====================================================
           SIDEBAR
        ===================================================== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
            transition: width 0.2s ease;
        }
        
        .sidebar.collapsed {
            width: var(--sidebar-collapsed);
        }
        
        .sidebar-header {
            height: 64px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .logo-icon i {
            color: white;
            font-size: 16px;
        }
        
        .logo-text {
            font-weight: 600;
            font-size: 16px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.2s ease;
        }
        
        .sidebar.collapsed .logo-text {
            opacity: 0;
            width: 0;
        }
        
        /* Sidebar Navigation */
        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .nav-section {
            margin-bottom: 24px;
        }
        
        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--sidebar-text);
            padding: 0 12px 8px;
            white-space: nowrap;
            overflow: hidden;
        }
        
        .sidebar.collapsed .nav-section-title {
            opacity: 0;
            height: 0;
            padding: 0;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            color: var(--sidebar-text);
            text-decoration: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.15s ease;
            margin-bottom: 2px;
            position: relative;
            white-space: nowrap;
        }
        
        .nav-item:hover {
            background: var(--sidebar-hover);
            color: var(--sidebar-text-active);
        }
        
        .nav-item.active {
            background: var(--sidebar-active);
            color: var(--sidebar-text-active);
        }
        
        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 24px;
            background: var(--primary);
            border-radius: 0 3px 3px 0;
        }
        
        .nav-item i {
            font-size: 18px;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
            opacity: 0.8;
        }
        
        .nav-item:hover i,
        .nav-item.active i {
            opacity: 1;
        }
        
        .nav-item span {
            font-size: 13px;
            font-weight: 500;
            overflow: hidden;
        }
        
        .sidebar.collapsed .nav-item span {
            opacity: 0;
            width: 0;
        }
        
        .nav-badge {
            margin-left: auto;
            background: var(--primary);
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }
        
        .sidebar.collapsed .nav-badge {
            display: none;
        }
        
        .nav-divider {
            height: 1px;
            background: var(--sidebar-border);
            margin: 16px 12px;
        }
        
        /* Sidebar Footer */
        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--sidebar-border);
        }
        
        .collapse-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--sidebar-border);
            border-radius: var(--radius-md);
            color: var(--sidebar-text);
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .collapse-btn:hover {
            background: var(--sidebar-hover);
            color: var(--sidebar-text-active);
        }
        
        .collapse-btn i {
            transition: transform 0.2s ease;
        }
        
        .sidebar.collapsed .collapse-btn i {
            transform: rotate(180deg);
        }
        
        /* =====================================================
           MAIN CONTENT AREA
        ===================================================== */
        .main-wrapper {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: margin-left 0.2s ease;
        }
        
        .sidebar.collapsed ~ .main-wrapper {
            margin-left: var(--sidebar-collapsed);
        }
        
        /* =====================================================
           TOP HEADER
        ===================================================== */
        .main-header {
            height: var(--header-height);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .expo-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .expo-icon {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }
        
        .expo-info h1 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            line-height: 1.3;
        }
        
        .expo-info .expo-meta {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .expo-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--success-bg);
            color: var(--success);
            font-size: 11px;
            font-weight: 600;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        
        .expo-status::before {
            content: '';
            width: 6px;
            height: 6px;
            background: currentColor;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }
        
        .header-btn:hover {
            background: var(--bg-main);
            border-color: var(--text-muted);
            color: var(--text-primary);
        }
        
        .header-btn.danger {
            color: var(--danger);
        }
        
        .header-btn.danger:hover {
            background: var(--danger-bg);
            border-color: var(--danger);
        }
        
        /* =====================================================
           CONTENT AREA
        ===================================================== */
        #content-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        /* Page Header */
        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        
        .page-title-group h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .page-title-group h2 i {
            color: var(--primary);
            font-size: 22px;
        }
        
        .page-title-group p {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }
        
        .page-actions {
            display: flex;
            gap: 10px;
        }
        
        /* =====================================================
           BUTTONS
        ===================================================== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            white-space: nowrap;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .btn-primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border-color: var(--border-color);
        }
        
        .btn-secondary:hover {
            background: var(--bg-main);
            border-color: var(--text-muted);
        }
        
        .btn-danger {
            background: var(--bg-card);
            color: var(--danger);
            border-color: var(--border-color);
        }
        
        .btn-danger:hover {
            background: var(--danger-bg);
            border-color: var(--danger);
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .btn-outline-primary {
            background: transparent;
            color: var(--primary);
            border-color: var(--border-color);
        }
        
        .btn-outline-primary:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }
        
        .btn-outline-info {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border-color);
        }
        
        .btn-outline-info:hover {
            background: var(--bg-main);
            border-color: var(--text-muted);
        }
        
        .btn-outline-danger {
            background: transparent;
            color: var(--danger);
            border-color: var(--border-color);
        }
        
        .btn-outline-danger:hover {
            background: var(--danger-bg);
            border-color: var(--danger);
        }
        
        /* =====================================================
           KPI CARDS
        ===================================================== */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            transition: all 0.2s ease;
        }
        
        .kpi-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--border-light);
        }
        
        .kpi-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .kpi-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .kpi-icon.visitors { background: var(--info-bg); color: var(--info); }
        .kpi-icon.checkins { background: var(--success-bg); color: var(--success); }
        .kpi-icon.today { background: var(--warning-bg); color: var(--warning); }
        .kpi-icon.countries { background: #f3e8ff; color: #9333ea; }
        
        .kpi-trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
        }
        
        .kpi-trend.up {
            background: var(--success-bg);
            color: var(--success);
        }
        
        .kpi-trend.neutral {
            background: var(--bg-main);
            color: var(--text-muted);
        }
        
        .kpi-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            margin-bottom: 2px;
            letter-spacing: -0.02em;
        }
        
        .kpi-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        /* =====================================================
           DASHBOARD GRID
        ===================================================== */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }
        
        .dashboard-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-title i {
            color: var(--text-muted);
        }
        
        .card-action {
            font-size: 12px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        
        .card-action:hover {
            text-decoration: underline;
        }
        
        .card-body {
            padding: 20px;
        }
        
        /* Quick Actions */
        .quick-actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .quick-action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px 16px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }
        
        .quick-action-item:hover {
            background: var(--bg-card);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        
        .quick-action-icon {
            width: 44px;
            height: 44px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .quick-action-item:hover .quick-action-icon {
            background: var(--primary);
            color: white;
        }
        
        .quick-action-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-primary);
            text-align: center;
        }
        
        /* Activity Feed */
        .activity-list {
            display: flex;
            flex-direction: column;
        }
        
        .activity-item {
            display: flex;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
        }
        
        .activity-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        
        .activity-item:first-child {
            padding-top: 0;
        }
        
        .activity-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
        }
        
        .activity-icon.register { background: var(--info-bg); color: var(--info); }
        .activity-icon.checkin { background: var(--success-bg); color: var(--success); }
        .activity-icon.email { background: #f3e8ff; color: #9333ea; }
        .activity-icon.form { background: var(--warning-bg); color: var(--warning); }
        
        .activity-content {
            flex: 1;
            min-width: 0;
        }
        
        .activity-text {
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.4;
        }
        
        .activity-text strong {
            font-weight: 600;
        }
        
        .activity-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        
        /* Chart Placeholder */
        .chart-container {
            height: 240px;
            background: linear-gradient(180deg, var(--bg-main) 0%, var(--bg-card) 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 20px 20px 36px;
            position: relative;
        }
        
        .chart-bar {
            flex: 1;
            max-width: 40px;
            background: linear-gradient(180deg, var(--primary) 0%, #7c3aed 100%);
            border-radius: 4px 4px 0 0;
            transition: all 0.3s ease;
            opacity: 0;
            animation: barGrow 0.5s ease forwards;
        }
        
        .chart-bar:nth-child(1) { height: 45%; animation-delay: 0.1s; }
        .chart-bar:nth-child(2) { height: 72%; animation-delay: 0.15s; }
        .chart-bar:nth-child(3) { height: 58%; animation-delay: 0.2s; }
        .chart-bar:nth-child(4) { height: 85%; animation-delay: 0.25s; }
        .chart-bar:nth-child(5) { height: 64%; animation-delay: 0.3s; }
        .chart-bar:nth-child(6) { height: 90%; animation-delay: 0.35s; }
        .chart-bar:nth-child(7) { height: 76%; animation-delay: 0.4s; }
        
        @keyframes barGrow {
            from { opacity: 0; transform: scaleY(0); }
            to { opacity: 1; transform: scaleY(1); }
        }
        
        .chart-bar:hover {
            filter: brightness(1.1);
            transform: scaleY(1.03);
        }
        
        .chart-labels {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 10px 20px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
        }
        
        .chart-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }
        
        /* =====================================================
           TABLES
        ===================================================== */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: var(--bg-main);
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
        }
        
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-light);
            font-size: 13px;
            color: var(--text-primary);
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        tr:hover {
            background: var(--bg-main);
        }
        
        /* =====================================================
           FORMS GRID
        ===================================================== */
        .forms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }
        
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .form-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        
        .form-card-header {
            background: var(--text-primary);
            color: white;
            padding: 16px;
            position: relative;
        }
        
        .form-card-header h3 {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
            padding-right: 60px;
        }
        
        .form-status {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(255,255,255,0.15);
        }
        
        .form-card-body {
            padding: 16px;
        }
        
        .form-card-body p {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0 0 12px;
        }
        
        .form-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .form-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .form-meta .submissions {
            color: var(--primary);
            font-weight: 500;
        }
        
        .form-card-footer {
            padding: 12px 16px;
            background: var(--bg-main);
            border-top: 1px solid var(--border-color);
        }
        
        .btn-group {
            display: flex;
            gap: 8px;
        }
        
        .btn-group .btn {
            flex: 1;
            justify-content: center;
        }
        
        /* =====================================================
           STATES
        ===================================================== */
        .loading-spinner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            gap: 16px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: var(--text-muted);
            font-size: 13px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
        }
        
        .empty-state-icon {
            width: 64px;
            height: 64px;
            background: var(--bg-main);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            color: var(--text-muted);
        }
        
        .empty-state h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 8px;
        }
        
        .empty-state p {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0 0 20px;
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-info {
            background: var(--info-bg);
            color: #1e40af;
            border: 1px solid #93c5fd;
        }
        
        /* =====================================================
           RESPONSIVE
        ===================================================== */
        @media (max-width: 1200px) {
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: var(--sidebar-collapsed);
            }
            
            .sidebar .logo-text,
            .sidebar .nav-section-title,
            .sidebar .nav-item span,
            .sidebar .nav-badge {
                display: none;
            }
            
            .main-wrapper {
                margin-left: var(--sidebar-collapsed);
            }
            
            .kpi-grid {
                grid-template-columns: 1fr;
            }
            
            .main-header {
                padding: 0 16px;
            }
            
            .expo-info h1 {
                font-size: 14px;
            }
            
            #content-area {
                padding: 16px;
            }
            
            .page-header {
                flex-direction: column;
                gap: 16px;
            }
            
            .page-actions {
                width: 100%;
            }
            
            .page-actions .btn {
                flex: 1;
            }
            
            .forms-grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* =====================================================
           SCROLLBAR
        ===================================================== */
        #content-area::-webkit-scrollbar {
            width: 6px;
        }
        
        #content-area::-webkit-scrollbar-track {
            background: transparent;
        }
        
        #content-area::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        
        #content-area::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
        
        /* =====================================================
           ANIMATIONS
        ===================================================== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .kpi-card,
        .dashboard-card,
        .form-card,
        .table-container {
            animation: fadeIn 0.3s ease forwards;
        }
        
        .kpi-card:nth-child(1) { animation-delay: 0.05s; }
        .kpi-card:nth-child(2) { animation-delay: 0.1s; }
        .kpi-card:nth-child(3) { animation-delay: 0.15s; }
        .kpi-card:nth-child(4) { animation-delay: 0.2s; }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">
                    <i class="bi bi-box-seam"></i>
                </div>
                <span class="logo-text">Leena EMS</span>
            </div>
            
            <div class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Overview</div>
                    <a class="nav-item active" onclick="loadDashboard()">
                        <i class="bi bi-grid-1x2"></i>
                        <span>Dashboard</span>
                    </a>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">Management</div>
                    <a class="nav-item" onclick="loadVisitors()">
                        <i class="bi bi-people"></i>
                        <span>Visitors</span>
                    </a>
                    <a class="nav-item" onclick="loadForms()">
                        <i class="bi bi-ui-checks-grid"></i>
                        <span>Forms</span>
                    </a>
                    <a class="nav-item" onclick="loadCheckins()">
                        <i class="bi bi-check2-square"></i>
                        <span>Check-ins</span>
                    </a>
                    <a class="nav-item" onclick="loadTerminals()">
                        <i class="bi bi-pc-display"></i>
                        <span>Terminals</span>
                    </a>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">Communication</div>
                    <a class="nav-item" onclick="loadEmailTemplates()">
                        <i class="bi bi-envelope"></i>
                        <span>Email Templates</span>
                    </a>
                    <a class="nav-item" href="email-segments.html">
                        <i class="bi bi-megaphone"></i>
                        <span>Email Segments</span>
                    </a>
                </div>
                
                <div class="nav-divider"></div>
                
                <div class="nav-section">
                    <div class="nav-section-title">Tools</div>
                    <a class="nav-item" onclick="loadReports()">
                        <i class="bi bi-graph-up"></i>
                        <span>Reports</span>
                    </a>
                    <a class="nav-item" onclick="loadImport()">
                        <i class="bi bi-download"></i>
                        <span>Import</span>
                    </a>
                    <a class="nav-item" href="visitorlog-paginated.html" target="_blank">
                        <i class="bi bi-journals"></i>
                        <span>Visitor Log</span>
                    </a>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <button class="collapse-btn" onclick="toggleSidebar()">
                    <i class="bi bi-chevron-double-left"></i>
                </button>
            </div>
        </nav>
        
        <!-- Main Content -->
        <div class="main-wrapper">
            <header class="main-header">
                <div class="header-left">
                    <div class="expo-selector">
                        <div class="expo-icon">
                            <i class="bi bi-calendar-event"></i>
                        </div>
                        <div class="expo-info">
                            <h1 id="expo-title">Loading...</h1>
                            <div class="expo-meta" id="expo-meta"></div>
                        </div>
                    </div>
                    <span class="expo-status" id="expo-status">Live</span>
                </div>
                <div class="header-right">
                    <button class="header-btn" onclick="goToDashboard()">
                        <i class="bi bi-arrow-left"></i>
                        <span>All Expos</span>
                    </button>
                    <button class="header-btn danger" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </header>
            
            <main id="content-area">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <span class="loading-text">Loading dashboard...</span>
                </div>
            </main>
        </div>
    </div>

    <script>
        // =====================================================
        // CONFIGURATION - Using exact same keys as original
        // =====================================================
        const API_BASE_URL = '/api';
        let currentExpoId = null;
        let currentExpoName = null;

        // =====================================================
        // INITIALIZATION
        // =====================================================
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            currentExpoId = localStorage.getItem('selectedExpoId');

            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            
            if (!currentExpoId) {
                alert('No expo selected. Redirecting to dashboard...');
                window.location.href = 'dashboard.html';
                return;
            }

            await fetchExpoDetails(currentExpoId);
            loadDashboard();
        });

        // =====================================================
        // HELPER FUNCTIONS
        // =====================================================
        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('token')}`
            };
        }

        function setActiveMenu(menuText) {
            document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
                item.classList.remove('active');
                if (item.textContent.trim().includes(menuText)) {
                    item.classList.add('active');
                }
            });
        }

        function showLoader(message = 'Loading...') {
            document.getElementById('content-area').innerHTML = `
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <span class="loading-text">${message}</span>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('content-area').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">
                        <i class="bi bi-exclamation-circle"></i>
                    </div>
                    <h3>Error</h3>
                    <p>${message}</p>
                    <button class="btn btn-primary" onclick="location.reload()">
                        <i class="bi bi-arrow-clockwise"></i> Try Again
                    </button>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        // =====================================================
        // NAVIGATION
        // =====================================================
        function goToDashboard() {
            window.location.href = 'dashboard.html';
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }

        // =====================================================
        // EXPO DETAILS
        // =====================================================
        async function fetchExpoDetails(expoId) {
            try {
                const response = await fetch(`${API_BASE_URL}/expos/${expoId}`, {
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) throw new Error('Could not fetch expo details');
                
                const expo = await response.json();
                currentExpoName = expo.name;
                
                document.getElementById('expo-title').textContent = expo.name;
                
                // Format dates
                const startDate = new Date(expo.start_date);
                const endDate = new Date(expo.end_date);
                const dateRange = `${startDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${endDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
                
                const location = expo.location ? ` • ${expo.location}` : '';
                document.getElementById('expo-meta').textContent = dateRange + location;
                
                // Update status badge
                const now = new Date();
                const statusEl = document.getElementById('expo-status');
                if (now < startDate) {
                    statusEl.textContent = 'Upcoming';
                    statusEl.style.background = 'var(--warning-bg)';
                    statusEl.style.color = 'var(--warning)';
                } else if (now > endDate) {
                    statusEl.textContent = 'Ended';
                    statusEl.style.background = 'var(--bg-main)';
                    statusEl.style.color = 'var(--text-muted)';
                }
                
            } catch (error) {
                console.error('Error fetching expo:', error);
                document.getElementById('expo-title').textContent = 'Expo Not Found';
            }
        }

        // =====================================================
        // PAGE LOADERS
        // =====================================================
        
        async function loadDashboard() {
            setActiveMenu('Dashboard');
            showLoader('Loading dashboard...');

            try {
                const response = await fetch(`${API_BASE_URL}/reports/summary?expo_id=${currentExpoId}`, {
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) throw new Error('Could not fetch dashboard data');
                
                const report = await response.json();
                const metrics = report.visitor_metrics || {};
                const checkins = report.checkin_metrics || {};

                document.getElementById('content-area').innerHTML = `
                    <div class="page-header">
                        <div class="page-title-group">
                            <h2><i class="bi bi-grid-1x2"></i> Dashboard</h2>
                            <p>Overview of your expo performance and key metrics</p>
                        </div>
                        <div class="page-actions">
                            <button class="btn btn-secondary" onclick="loadImport()">
                                <i class="bi bi-upload"></i> Import
                            </button>
                            <button class="btn btn-primary" onclick="window.location.href='form-builder.html'">
                                <i class="bi bi-plus-lg"></i> Create Form
                            </button>
                        </div>
                    </div>
                    
                    <div class="kpi-grid">
                        <div class="kpi-card">
                            <div class="kpi-header">
                                <div class="kpi-icon visitors">
                                    <i class="bi bi-people"></i>
                                </div>
                                <span class="kpi-trend up">
                                    <i class="bi bi-arrow-up"></i> Active
                                </span>
                            </div>
                            <div class="kpi-value">${(metrics.total_visitors || 0).toLocaleString()}</div>
                            <div class="kpi-label">Total Visitors</div>
                        </div>
                        
                        <div class="kpi-card">
                            <div class="kpi-header">
                                <div class="kpi-icon checkins">
                                    <i class="bi bi-check2-square"></i>
                                </div>
                                <span class="kpi-trend neutral">All time</span>
                            </div>
                            <div class="kpi-value">${(checkins.total_checkins || 0).toLocaleString()}</div>
                            <div class="kpi-label">Total Check-ins</div>
                        </div>
                        
                        <div class="kpi-card">
                            <div class="kpi-header">
                                <div class="kpi-icon today">
                                    <i class="bi bi-calendar-check"></i>
                                </div>
                                <span class="kpi-trend up">
                                    <i class="bi bi-arrow-up"></i> Today
                                </span>
                            </div>
                            <div class="kpi-value">${(checkins.checkins_today || 0).toLocaleString()}</div>
                            <div class="kpi-label">Today's Check-ins</div>
                        </div>
                        
                        <div class="kpi-card">
                            <div class="kpi-header">
                                <div class="kpi-icon countries">
                                    <i class="bi bi-globe"></i>
                                </div>
                                <span class="kpi-trend neutral">Unique</span>
                            </div>
                            <div class="kpi-value">${metrics.unique_countries || 0}</div>
                            <div class="kpi-label">Countries</div>
                        </div>
                    </div>
                    
                    <div class="dashboard-grid">
                        <div class="dashboard-card">
                            <div class="card-header">
                                <span class="card-title"><i class="bi bi-bar-chart"></i> Registration Trend</span>
                                <a class="card-action" onclick="loadReports()">View full report →</a>
                            </div>
                            <div class="card-body">
                                <div class="chart-container">
                                    <div class="chart-bar"></div>
                                    <div class="chart-bar"></div>
                                    <div class="chart-bar"></div>
                                    <div class="chart-bar"></div>
                                    <div class="chart-bar"></div>
                                    <div class="chart-bar"></div>
                                    <div class="chart-bar"></div>
                                    <div class="chart-labels">
                                        <span class="chart-label">Mon</span>
                                        <span class="chart-label">Tue</span>
                                        <span class="chart-label">Wed</span>
                                        <span class="chart-label">Thu</span>
                                        <span class="chart-label">Fri</span>
                                        <span class="chart-label">Sat</span>
                                        <span class="chart-label">Sun</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div style="display: flex; flex-direction: column; gap: 20px;">
                            <div class="dashboard-card">
                                <div class="card-header">
                                    <span class="card-title"><i class="bi bi-lightning"></i> Quick Actions</span>
                                </div>
                                <div class="card-body">
                                    <div class="quick-actions-grid">
                                        <a class="quick-action-item" onclick="window.location.href='form-builder.html'">
                                            <div class="quick-action-icon">
                                                <i class="bi bi-person-plus"></i>
                                            </div>
                                            <span class="quick-action-label">New Form</span>
                                        </a>
                                        <a class="quick-action-item" onclick="loadCheckins()">
                                            <div class="quick-action-icon">
                                                <i class="bi bi-qr-code-scan"></i>
                                            </div>
                                            <span class="quick-action-label">View Check-ins</span>
                                        </a>
                                        <a class="quick-action-item" onclick="loadEmailTemplates()">
                                            <div class="quick-action-icon">
                                                <i class="bi bi-envelope"></i>
                                            </div>
                                            <span class="quick-action-label">Send Email</span>
                                        </a>
                                        <a class="quick-action-item" onclick="loadReports()">
                                            <div class="quick-action-icon">
                                                <i class="bi bi-file-earmark-bar-graph"></i>
                                            </div>
                                            <span class="quick-action-label">Export Report</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="dashboard-card" style="flex: 1;">
                                <div class="card-header">
                                    <span class="card-title"><i class="bi bi-activity"></i> Recent Activity</span>
                                    <a class="card-action" onclick="loadVisitors()">View all →</a>
                                </div>
                                <div class="card-body">
                                    <div class="activity-list">
                                        <div class="activity-item">
                                            <div class="activity-icon register">
                                                <i class="bi bi-person-plus"></i>
                                            </div>
                                            <div class="activity-content">
                                                <div class="activity-text"><strong>${metrics.registrations_today || 0}</strong> new registrations today</div>
                                                <div class="activity-time">Updated just now</div>
                                            </div>
                                        </div>
                                        <div class="activity-item">
                                            <div class="activity-icon checkin">
                                                <i class="bi bi-check-lg"></i>
                                            </div>
                                            <div class="activity-content">
                                                <div class="activity-text"><strong>${checkins.checkins_today || 0}</strong> check-ins today</div>
                                                <div class="activity-time">Badge printing active</div>
                                            </div>
                                        </div>
                                        <div class="activity-item">
                                            <div class="activity-icon form">
                                                <i class="bi bi-globe"></i>
                                            </div>
                                            <div class="activity-content">
                                                <div class="activity-text"><strong>${metrics.unique_countries || 0}</strong> countries represented</div>
                                                <div class="activity-time">International reach</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading dashboard:', error);
                showError('Could not load dashboard. Please try again.');
            }
        }

        async function loadVisitors() {
            setActiveMenu('Visitors');
            showLoader('Loading visitors...');
            
            try {
                const response = await fetch(`${API_BASE_URL}/visitors?expo_id=${currentExpoId}`, {
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) throw new Error('Could not fetch visitors');

                const data = await response.json();
                const visitors = data.visitors || [];

                let content = `
                    <div class="page-header">
                        <div class="page-title-group">
                            <h2><i class="bi bi-people"></i> Visitors</h2>
                            <p>${visitors.length.toLocaleString()} registered visitors</p>
                        </div>
                        <div class="page-actions">
                            <button class="btn btn-secondary" onclick="loadImport()">
                                <i class="bi bi-upload"></i> Import
                            </button>
                            <button class="btn btn-primary" onclick="window.location.href='form-builder.html'">
                                <i class="bi bi-plus-lg"></i> Create Form
                            </button>
                        </div>
                    </div>
                `;

                if (visitors.length === 0) {
                    content += `
                        <div class="empty-state">
                            <div class="empty-state-icon">
                                <i class="bi bi-people"></i>
                            </div>
                            <h3>No Visitors Yet</h3>
                            <p>Create a registration form or import visitors to get started.</p>
                            <button class="btn btn-primary" onclick="window.location.href='form-builder.html'">
                                <i class="bi bi-plus-lg"></i> Create Registration Form
                            </button>
                        </div>
                    `;
                } else {
                    content += `
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Company</th>
                                        <th>Country</th>
                                        <th>Source</th>
                                        <th>Registered</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    visitors.slice(0, 100).forEach(v => {
                        let fields = {};
                        try {
                            fields = typeof v.custom_fields === 'string' ? 
                                JSON.parse(v.custom_fields) : v.custom_fields || {};
                        } catch (e) {
                            fields = {};
                        }

                        const name = v.name || fields.name || fields.full_name || '-';
                        const email = v.email || fields.email || '-';
                        const company = v.company || fields.company || '-';
                        const country = fields.country || v.country || '-';
                        const source = v.source || '-';
                        const date = new Date(v.created_at).toLocaleDateString();

                        content += `
                            <tr>
                                <td><strong>${escapeHtml(name)}</strong></td>
                                <td>${escapeHtml(email)}</td>
                                <td>${escapeHtml(company)}</td>
                                <td>${escapeHtml(country)}</td>
                                <td><span style="background: var(--info-bg); color: var(--info); padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500;">${escapeHtml(source)}</span></td>
                                <td>${date}</td>
                            </tr>
                        `;
                    });

                    content += `
                                </tbody>
                            </table>
                        </div>
                    `;
                    
                    if (visitors.length > 100) {
                        content += `
                            <div class="alert alert-info" style="margin-top: 16px;">
                                <i class="bi bi-info-circle"></i>
                                Showing first 100 visitors. <a href="visitorlog-paginated.html" target="_blank" style="color: inherit; font-weight: 600;">View all visitors →</a>
                            </div>
                        `;
                    }
                }

                document.getElementById('content-area').innerHTML = content;

            } catch (error) {
                console.error('Error loading visitors:', error);
                showError('Could not load visitors. Please try again.');
            }
        }

        async function loadForms() {
            setActiveMenu('Forms');
            showLoader('Loading forms...');
            
            try {
                const response = await fetch(`${API_BASE_URL}/forms/expo/${currentExpoId}`, {
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) throw new Error('Could not fetch forms');

                const data = await response.json();
                const forms = data.forms || [];

                let content = `
                    <div class="page-header">
                        <div class="page-title-group">
                            <h2><i class="bi bi-ui-checks-grid"></i> Registration Forms</h2>
                            <p>${forms.length} form${forms.length !== 1 ? 's' : ''} created</p>
                        </div>
                        <div class="page-actions">
                            <button class="btn btn-secondary" onclick="window.location.href='form-list.html?expo_id=${currentExpoId}'">
                                <i class="bi bi-list"></i> Manage All
                            </button>
                            <button class="btn btn-primary" onclick="window.location.href='form-builder.html'">
                                <i class="bi bi-plus-lg"></i> Create Form
                            </button>
                        </div>
                    </div>
                `;

                if (forms.length === 0) {
                    content += `
                        <div class="empty-state">
                            <div class="empty-state-icon">
                                <i class="bi bi-ui-checks"></i>
                            </div>
                            <h3>No Forms Yet</h3>
                            <p>Create your first registration form for this expo.</p>
                            <button class="btn btn-primary" onclick="window.location.href='form-builder.html'">
                                <i class="bi bi-plus-lg"></i> Create Your First Form
                            </button>
                        </div>
                    `;
                } else {
                    content += '<div class="forms-grid">';
                    
                    forms.forEach(form => {
                        const isActive = form.is_active;
                        const publicUrl = `${window.location.origin}/form-public.html?id=${form.id}`;
                        
                        content += `
                            <div class="form-card" onclick="editForm(${form.id})">
                                <div class="form-card-header">
                                    <h3>${escapeHtml(form.name)}</h3>
                                    <span class="form-status">${isActive ? 'Active' : 'Inactive'}</span>
                                </div>
                                <div class="form-card-body">
                                    <p>${escapeHtml(form.description) || 'No description'}</p>
                                    <div class="form-meta">
                                        <span><i class="bi bi-ui-checks"></i> ${form.fields?.length || 0} fields</span>
                                        <span class="submissions"><i class="bi bi-people"></i> ${form.submission_count || 0} submissions</span>
                                    </div>
                                </div>
                                <div class="form-card-footer" onclick="event.stopPropagation()">
                                    <div class="btn-group">
                                        <button class="btn btn-sm btn-outline-primary" onclick="editForm(${form.id})">
                                            <i class="bi bi-pencil"></i> Edit
                                        </button>
                                        <button class="btn btn-sm btn-outline-info" onclick="copyFormUrl('${publicUrl}')">
                                            <i class="bi bi-link-45deg"></i> Copy Link
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger" onclick="deleteForm(${form.id})">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    
                    content += '</div>';
                }

                document.getElementById('content-area').innerHTML = content;

            } catch (error) {
                console.error('Error loading forms:', error);
                showError('Could not load forms. Please try again.');
            }
        }

        // =====================================================
        // REDIRECT LOADERS (Same as original)
        // =====================================================
        function loadCheckins() {
            setActiveMenu('Check-ins');
            window.location.href = 'checkins.html';
        }

        function loadTerminals() {
            setActiveMenu('Terminals');
            window.location.href = 'terminals.html';
        }

        function loadEmailTemplates() {
            setActiveMenu('Email Templates');
            window.location.href = 'email-templates.html';
        }

        function loadReports() {
            setActiveMenu('Reports');
            window.location.href = 'reports.html';
        }

        function loadImport() {
            setActiveMenu('Import');
            window.location.href = 'import.html';
        }

        // =====================================================
        // FORM ACTIONS (Same as original)
        // =====================================================
        function editForm(formId) {
            window.location.href = `form-builder.html?id=${formId}`;
        }

        function copyFormUrl(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert('Form URL copied to clipboard!');
            }).catch(() => {
                alert('Failed to copy URL');
            });
        }

        async function deleteForm(formId) {
            if (!confirm('Are you sure you want to delete this form?')) return;
            
            try {
                const response = await fetch(`${API_BASE_URL}/forms/${formId}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                
                if (response.ok) {
                    alert('Form deleted successfully');
                    loadForms();
                } else {
                    const error = await response.json();
                    alert(error.message || 'Failed to delete form');
                }
            } catch (error) {
                console.error('Error deleting form:', error);
                alert('Failed to delete form');
            }
        }
    </script>
</body>
