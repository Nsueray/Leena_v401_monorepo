<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
    <title>Sales Agents - Leena EMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #4a6fa5;
            --primary-hover: #3d5d8a;
            --primary-light: #eef2f7;
            --sidebar-bg: #1a1a2e;
            --sidebar-hover: #252542;
            --sidebar-active: #2d2d4a;
            --sidebar-text: #9ca3af;
            --sidebar-text-active: #ffffff;
            --sidebar-border: #252542;
            --bg: #f4f6fa;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text: #1f2937;
            --text-muted: #6b7280;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); }
        .app-shell { display: flex; min-height: 100vh; }

        .sidebar { width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 24px 20px; border-bottom: 1px solid var(--sidebar-border); }
        .sidebar-logo { height: 32px; }
        .sidebar-nav { padding: 16px 12px; flex: 1; }
        .nav-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--sidebar-text); padding: 8px 12px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--sidebar-text); text-decoration: none; font-size: 14px; font-weight: 500; margin-bottom: 2px; }
        .nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
        .nav-item.active { background: var(--sidebar-active); color: var(--sidebar-text-active); }
        .nav-divider { height: 1px; background: var(--sidebar-border); margin: 12px 0; }

        .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .main-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 28px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .main-header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .main-content { padding: 24px 28px; }

        .toolbar { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 20px; }
        .toolbar-spacer { flex: 1; }
        .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-muted); }
        .btn { font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
        .btn-ghost:hover { background: var(--primary-light); }
        .btn-sm { padding: 6px 12px; font-size: 13px; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; padding: 14px 16px; border-bottom: 1px solid var(--border); background: #fafbfc; }
        tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
        tbody tr:last-child td { border-bottom: none; }
        .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .muted { color: var(--text-muted); }
        .agent-name { font-weight: 600; }
        tr.inactive td { opacity: 0.5; }

        /* Inline create/edit form (row expansion, no modal) */
        .agent-row td { background: #fafbfc; }
        .agent-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
        .agent-form label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; }
        .agent-form input, .agent-form select { font-family: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); min-width: 130px; }
        .agent-form .check { align-self: center; margin-top: 14px; }

        .empty-state { padding: 60px 20px; text-align: center; color: var(--text-muted); }
        .count-line { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="app-shell">
        <nav class="sidebar">
            <div class="sidebar-header">
                <img src="assets/Leena_logo_white_nobg.png" alt="Leena" class="sidebar-logo">
            </div>
            <div class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Finance</div>
                    <a class="nav-item" href="contract-list.html">
                        <i class="bi bi-file-earmark-text"></i><span>Contracts</span>
                    </a>
                    <a class="nav-item active" href="sales-agents.html">
                        <i class="bi bi-person-badge"></i><span>Sales Agents</span>
                    </a>
                </div>
                <div class="nav-divider"></div>
                <div class="nav-section">
                    <a class="nav-item" href="dashboard_new.html">
                        <i class="bi bi-collection"></i><span>My Expos</span>
                    </a>
                    <a class="nav-item" href="#" onclick="logout(); return false;">
                        <i class="bi bi-box-arrow-right"></i><span>Logout</span>
                    </a>
                </div>
            </div>
        </nav>

        <div class="main-wrapper">
            <header class="main-header">
                <h1><i class="bi bi-person-badge"></i> Sales Agents</h1>
                <button class="btn btn-primary" onclick="toggleNewForm()"><i class="bi bi-plus-lg"></i> New agent</button>
            </header>

            <main class="main-content">
                <div class="toolbar">
                    <label class="check"><input type="checkbox" id="showInactive" onchange="applyFilter()"> Show inactive</label>
                    <div class="toolbar-spacer"></div>
                </div>

                <div class="count-line" id="countLine"></div>

                <div class="card">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Group</th>
                                <th>Team</th>
                                <th>Country</th>
                                <th class="num">Comm %</th>
                                <th class="num">Dir %</th>
                                <th>Active</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="agentBody">
                            <tr><td colspan="9" class="empty-state">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- datalist önerileri (mevcut DISTINCT değerlerden) -->
    <datalist id="dlGroup"></datalist>
    <datalist id="dlTeam"></datalist>
    <datalist id="dlCountry"></datalist>

    <script src="/leena-toast.js"></script>
    <script src="/leena-fetch.js"></script>
    <script>
        const API_URL = '/api';
        const AGENT_TYPES = ['internal', 'external_freelance', 'external_agency'];
        // contract-list.html:167-170 ile aynı para birimi listesi.
        const CURRENCIES = ['EUR', 'USD', 'TRY', 'MAD', 'NGN', 'KES'];
        let allAgents = [];

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'login.html'; return; }
            loadAgents();
        });

        async function loadAgents() {
            try {
                // Liste sayfası hepsini çeker; filtre client-side.
                const res = await leenaFetch(`${API_URL}/sales-agents?include_inactive=1`);
                allAgents = await res.json();
                buildDatalists();
                applyFilter();
            } catch (err) {
                if (err.status === 401 || err.status === 403) return;
                document.getElementById('agentBody').innerHTML =
                    '<tr><td colspan="9" class="empty-state">Error loading agents. <button class="btn btn-ghost btn-sm" onclick="loadAgents()">Retry</button></td></tr>';
            }
        }

        function buildDatalists() {
            const uniq = (key) => [...new Set(allAgents.map(a => a[key]).filter(Boolean))].sort();
            const fill = (id, vals) => {
                document.getElementById(id).innerHTML = vals.map(v => `<option value="${escapeHtml(v)}">`).join('');
            };
            fill('dlGroup', uniq('sales_group'));
            fill('dlTeam', uniq('sales_team'));
            fill('dlCountry', uniq('country'));
        }

        function applyFilter() {
            const showInactive = document.getElementById('showInactive').checked;
            const rows = allAgents.filter(a => showInactive || a.is_active);
            render(rows);
        }

        function render(agents) {
            const body = document.getElementById('agentBody');
            document.getElementById('countLine').textContent =
                `Showing ${agents.length} of ${allAgents.length} agents`;
            if (!allAgents.length) {
                body.innerHTML = '<tr><td colspan="9" class="empty-state">No agents yet.</td></tr>';
                return;
            }
            if (!agents.length) {
                body.innerHTML = '<tr><td colspan="9" class="empty-state">No agents match the filter.</td></tr>';
                return;
            }
            body.innerHTML = agents.map(a => `<tr class="${a.is_active ? '' : 'inactive'}">
                <td class="agent-name">${escapeHtml(a.name)}</td>
                <td>${escapeHtml(a.agent_type)}</td>
                <td>${a.sales_group ? escapeHtml(a.sales_group) : dash()}</td>
                <td>${a.sales_team ? escapeHtml(a.sales_team) : dash()}</td>
                <td>${a.country ? escapeHtml(a.country) : dash()}</td>
                <td class="num">${a.default_commission_pct == null ? dash() : escapeHtml(String(a.default_commission_pct))}</td>
                <td class="num">${a.default_director_pct == null ? dash() : escapeHtml(String(a.default_director_pct))}</td>
                <td>${a.is_active ? '✓' : dash()}</td>
                <td class="num"><button class="btn btn-ghost btn-sm" onclick="editAgent(${a.id})">Edit</button></td>
            </tr>`).join('');
        }

        // Inline form — create (new) ve edit için tek şablon. agent=null → create.
        function formHtml(agent) {
            const a = agent || {};
            const types = AGENT_TYPES.map(t => `<option value="${t}"${a.agent_type === t ? ' selected' : ''}>${t}</option>`).join('');
            const curs = ['<option value="">—</option>'].concat(
                CURRENCIES.map(c => `<option value="${c}"${a.commission_currency === c ? ' selected' : ''}>${c}</option>`)).join('');
            const val = (k) => a[k] == null ? '' : escapeHtml(String(a[k]));
            const activeChecked = (agent && !a.is_active) ? '' : 'checked';
            return `<tr class="agent-row"><td colspan="9">
                <form class="agent-form" onsubmit="submitAgent(event, ${agent ? a.id : 'null'})">
                    <label>Name<input name="name" type="text" value="${val('name')}" autocomplete="off"></label>
                    <label>Type<select name="agent_type">${types}</select></label>
                    <label>Group<input name="sales_group" list="dlGroup" value="${val('sales_group')}" autocomplete="off"></label>
                    <label>Team<input name="sales_team" list="dlTeam" value="${val('sales_team')}" autocomplete="off"></label>
                    <label>Country<input name="country" list="dlCountry" value="${val('country')}" autocomplete="off"></label>
                    <label>Email<input name="email" type="text" value="${val('email')}" autocomplete="off"></label>
                    <label>Company<input name="agent_company" type="text" value="${val('agent_company')}" autocomplete="off"></label>
                    <label>Currency<select name="commission_currency">${curs}</select></label>
                    <label>Comm %<input name="default_commission_pct" type="text" value="${val('default_commission_pct')}" autocomplete="off"></label>
                    <label>Dir %<input name="default_director_pct" type="text" value="${val('default_director_pct')}" autocomplete="off"></label>
                    ${agent ? `<label class="check"><input type="checkbox" name="is_active" ${activeChecked}> Active</label>` : ''}
                    <button class="btn btn-primary btn-sm" type="submit">Save</button>
                    <button class="btn btn-ghost btn-sm" type="button" onclick="loadAgents()">Cancel</button>
                </form>
            </td></tr>`;
        }

        function toggleNewForm() {
            const body = document.getElementById('agentBody');
            if (body.querySelector('.new-form')) { applyFilter(); return; }
            applyFilter();
            body.insertAdjacentHTML('afterbegin', formHtml(null).replace('agent-row', 'agent-row new-form'));
        }

        function editAgent(id) {
            const agent = allAgents.find(a => a.id === id);
            if (!agent) return;
            applyFilter();
            // İlgili satırın ALTINA edit formu aç.
            const rows = [...document.querySelectorAll('#agentBody tr')];
            const idx = rows.findIndex(r => r.querySelector(`button[onclick="editAgent(${id})"]`));
            if (idx >= 0) rows[idx].insertAdjacentHTML('afterend', formHtml(agent));
        }

        async function submitAgent(ev, id) {
            ev.preventDefault();
            const f = ev.target;
            const num = (v) => (v === '' || v == null) ? null : Number(v);
            const str = (v) => (v === '' || v == null) ? null : v;
            const body = {
                name: f.name.value,
                agent_type: f.agent_type.value,
                sales_group: str(f.sales_group.value),
                sales_team: str(f.sales_team.value),
                country: str(f.country.value),
                email: str(f.email.value),
                agent_company: str(f.agent_company.value),
                commission_currency: str(f.commission_currency.value),
                default_commission_pct: num(f.default_commission_pct.value),
                default_director_pct: num(f.default_director_pct.value)
            };
            if (id !== null && f.is_active) body.is_active = f.is_active.checked;

            const isEdit = id !== null;
            const url = isEdit ? `${API_URL}/sales-agents/${id}` : `${API_URL}/sales-agents`;
            const method = isEdit ? 'PUT' : 'POST';
            const btn = f.querySelector('button[type="submit"]');
            btn.disabled = true;
            try {
                const res = await leenaFetch(url, {
                    method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                if (res.ok) {
                    showToast(isEdit ? 'Agent updated' : 'Agent created', 'success');
                    loadAgents();
                } else {
                    let msg = 'Save failed';
                    try { const e = await res.json(); if (e && e.error) msg = e.error; } catch (_) {}
                    showToast(msg, 'error');
                    btn.disabled = false;
                }
            } catch (err) {
                if (!(err.status === 401 || err.status === 403)) { showToast('Save failed', 'error'); btn.disabled = false; }
            }
        }

        function dash() { return '<span class="muted">—</span>'; }
        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
    </script>
</body>
</html>
