<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leena EMS - Management Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0066ff;
            --primary-hover: #0052cc;
            --sidebar-bg: #0f0f0f;
            --sidebar-text: #a1a1a1;
            --sidebar-text-hover: #ffffff;
            --sidebar-hover-bg: rgba(255,255,255,0.06);
            --bg-primary: #fafafa;
            --bg-card: #ffffff;
            --text-primary: #171717;
            --text-secondary: #525252;
            --text-muted: #a3a3a3;
            --border-color: #e5e5e5;
            --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.03);
            --shadow-md: 0 1px 3px 0 rgba(0,0,0,0.06), 0 1px 2px -1px rgba(0,0,0,0.06);
            --shadow-lg: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.07);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Sidebar */
        .sidebar {
            width: 240px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            padding: 0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            border-right: 1px solid rgba(255,255,255,0.06);
        }
        
        .sidebar-header {
            padding: 20px 16px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.01em;
        }
        
        .sidebar-header i {
            font-size: 20px;
            opacity: 0.9;
        }
        
        .sidebar-menu {
            list-style-type: none;
            margin-top: 8px;
            padding: 0 8px;
        }
        
        .sidebar-menu li {
            margin-bottom: 2px;
        }
        
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--sidebar-text);
            text-decoration: none;
            padding: 10px 12px;
            transition: all 0.15s ease;
            cursor: pointer;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
        }
        
        .sidebar-menu a:hover {
            background-color: var(--sidebar-hover-bg);
            color: var(--sidebar-text-hover);
        }
        
        .sidebar-menu a.active {
            background-color: rgba(255,255,255,0.1);
            color: var(--sidebar-text-hover);
        }
        
        .sidebar-menu a i {
            font-size: 16px;
            width: 20px;
            text-align: center;
            opacity: 0.7;
        }
        
        .sidebar-menu a:hover i,
        .sidebar-menu a.active i {
            opacity: 1;
        }
        
        /* Main Content */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg-primary);
        }
        
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        
        .main-header h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.02em;
        }
        
        .main-header h1 i {
            font-size: 18px;
            color: var(--text-secondary);
        }
        
        .header-buttons {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            background-color: var(--bg-card);
            color: var(--text-primary);
        }
        
        .btn:hover {
            background-color: #f5f5f5;
            border-color: #d4d4d4;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        
        .btn-secondary {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border-color: var(--border-color);
        }
        
        .btn-secondary:hover {
            background-color: #f5f5f5;
            border-color: #d4d4d4;
        }
        
        .btn-danger {
            background-color: var(--bg-card);
            color: #dc2626;
            border-color: var(--border-color);
        }
        
        .btn-danger:hover {
            background-color: #fef2f2;
            border-color: #fecaca;
        }
        
        #content-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px;
            background-color: var(--bg-primary);
        }
        
        #content-area h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 20px;
        }
        
        #content-area h2 i {
            color: var(--text-secondary);
            margin-right: 2px;
        }
        
        /* Loading State */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }
        
        .spinner-border {
            width: 32px;
            height: 32px;
            border-width: 2px;
            color: var(--text-muted);
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            margin: 20px 0;
        }
        
        .empty-state-icon {
            font-size: 48px;
            color: var(--text-muted);
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .empty-state h3 {
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: 600;
        }
        
        .empty-state p {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        /* Cards and Grids */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        
        .stat-card {
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            transition: all 0.15s ease;
        }
        
        .stat-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: #d4d4d4;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            line-height: 1.2;
        }
        
        .stat-card .label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 500;
        }
        
        /* Forms Grid */
        .forms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        
        .form-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.15s ease;
            cursor: pointer;
        }
        
        .form-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: #d4d4d4;
        }
        
        .form-card-header {
            background: var(--text-primary);
            color: white;
            padding: 16px;
            font-weight: 600;
            font-size: 14px;
            position: relative;
        }
        
        .form-card-body {
            padding: 16px;
        }
        
        .form-card-body p {
            font-size: 13px;
        }
        
        .form-card-footer {
            background: var(--bg-primary);
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
        }
        
        .status-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 4px 8px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(255,255,255,0.15);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        /* Alerts */
        .alert-info {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 13px;
        }
        
        /* Table */
        .table-container {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background-color: var(--bg-primary);
            padding: 12px 16px;
            text-align: left;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid var(--border-color);
        }
        
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-primary);
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        tr:hover {
            background-color: var(--bg-primary);
        }
        
        /* Button group in form cards */
        .btn-group {
            display: flex;
            gap: 6px;
        }
        
        .btn-group .btn {
            flex: 1;
            justify-content: center;
            padding: 6px 10px;
            font-size: 12px;
        }
        
        .btn-sm {
            padding: 6px 10px;
            font-size: 12px;
        }
        
        .btn-outline-primary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--primary-color);
        }
        
        .btn-outline-primary:hover {
            background: #eff6ff;
            border-color: #bfdbfe;
        }
        
        .btn-outline-info {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        
        .btn-outline-info:hover {
            background: var(--bg-primary);
            border-color: #d4d4d4;
        }
        
        .btn-outline-danger {
            background: transparent;
            border: 1px solid var(--border-color);
            color: #dc2626;
        }
        
        .btn-outline-danger:hover {
            background: #fef2f2;
            border-color: #fecaca;
        }
        
        /* Text utilities */
        .text-muted {
            color: var(--text-muted) !important;
        }
        
        .text-primary {
            color: var(--primary-color) !important;
        }
        
        .small {
            font-size: 12px;
        }
        
        /* Scrollbar styling */
        #content-area::-webkit-scrollbar {
            width: 6px;
        }
        
        #content-area::-webkit-scrollbar-track {
            background: transparent;
        }
        
        #content-area::-webkit-scrollbar-thumb {
            background: #d4d4d4;
            border-radius: 3px;
        }
        
        #content-area::-webkit-scrollbar-thumb:hover {
            background: #a3a3a3;
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <i class="bi bi-box-seam"></i>
            Leena EMS
        </div>
        <ul class="sidebar-menu">
            <li><a onclick="loadDashboard()" class="active">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a></li>
            <li><a onclick="loadVisitors()">
                <i class="bi bi-people"></i> Visitors
            </a></li>
            <li><a onclick="loadForms()">
                <i class="bi bi-card-list"></i> Forms
            </a></li>
            <li><a onclick="loadCheckins()">
                <i class="bi bi-check2-square"></i> Check-ins
            </a></li>
            <li><a onclick="loadTerminals()">
                <i class="bi bi-pc-display"></i> Terminals
            </a></li>
            <li><a onclick="loadEmailTemplates()">
                <i class="bi bi-envelope"></i> Email Templates
            </a></li>
            <li><a onclick="loadReports()">
                <i class="bi bi-graph-up"></i> Reports
            </a></li>
            <li><a onclick="loadImport()">
                <i class="bi bi-download"></i> Import
            </a></li>
            <li><a href="visitorlog-paginated.html" target="_blank">
                <i class="bi bi-journals"></i> Visitor Log (Paged)
            </a></li>
        </ul>
    </nav>

    <div class="main-wrapper">
        <header class="main-header">
            <h1 id="expo-title">
                <i class="bi bi-calendar-event text-primary"></i>
                <span>Loading...</span>
            </h1>
            <div class="header-buttons">
                <button class="btn btn-secondary" onclick="goToDashboard()">
                    <i class="bi bi-arrow-left"></i> Back to All Expos
                </button>
                <button class="btn btn-danger" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </div>
        </header>
        
        <main id="content-area">
            <div class="loading-spinner">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Use relative path that works both locally and in production
        const API_BASE_URL = '/api';
        let currentExpoId = null;
        let currentExpoName = null;

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            currentExpoId = localStorage.getItem('selectedExpoId');

            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            if (!currentExpoId) {
                alert('No expo selected. Redirecting to dashboard...');
                window.location.href = 'dashboard.html';
                return;
            }

            await fetchExpoDetails(currentExpoId);
            loadDashboard();
        });

        // --- HELPER FUNCTIONS ---
        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('token')}`
            };
        }

        function setActiveMenu(menuItem) {
            document.querySelectorAll('.sidebar-menu a').forEach(a => {
                a.classList.remove('active');
            });
            if (menuItem) {
                menuItem.classList.add('active');
            }
        }

        function showLoader() {
            document.getElementById('content-area').innerHTML = `
                <div class="loading-spinner">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('content-area').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">
                        <i class="bi bi-exclamation-circle"></i>
                    </div>
                    <h3>Error</h3>
                    <p>${message}</p>
                    <button class="btn btn-primary" onclick="location.reload()">
                        <i class="bi bi-arrow-clockwise"></i> Try Again
                    </button>
                </div>
            `;
        }

        // --- NAVIGATION FUNCTIONS ---
        function goToDashboard() {
            window.location.href = 'dashboard.html';
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }

        // --- DATA FETCHING ---
        async function fetchExpoDetails(expoId) {
            try {
                const response = await fetch(`${API_BASE_URL}/expos/${expoId}`, {
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) throw new Error('Could not fetch expo details');
                
                const expo = await response.json();
                currentExpoName = expo.name;
                document.querySelector('#expo-title span').textContent = expo.name;
            } catch (error) {
                console.error('Error fetching expo:', error);
                document.querySelector('#expo-title span').textContent = 'Expo Not Found';
            }
        }

        // --- PAGE LOADERS ---

        async function loadDashboard() {
            setActiveMenu(event?.currentTarget);
            showLoader();

            try {
                const response = await fetch(`${API_BASE_URL}/reports/summary?expo_id=${currentExpoId}`, {
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) throw new Error('Could not fetch dashboard data');
                
                const report = await response.json();
                const metrics = report.visitor_metrics || {};
                const checkins = report.checkin_metrics || {};

                document.getElementById('content-area').innerHTML = `
                    <h2 class="mb-4">
                        <i class="bi bi-speedometer2 text-primary"></i> Dashboard Overview
                    </h2>
                    
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="window.location.href='form-builder.html'">
                            <i class="bi bi-plus-circle"></i> Create Form
                        </button>
                        <button class="btn btn-primary" onclick="loadImport()">
                            <i class="bi bi-upload"></i> Import Visitors
                        </button>
                    </div>
                    
                    <div class="dashboard-grid">
                        <div class="stat-card">
                            <div class="value">${metrics.total_visitors || 0}</div>
                            <div class="label">Total Visitors</div>
                        </div>
                        <div class="stat-card">
                            <div class="value">${checkins.total_checkins || 0}</div>
                            <div class="label">Total Check-ins</div>
                        </div>
                        <div class="stat-card">
                            <div class="value">${checkins.checkins_today || 0}</div>
                            <div class="label">Today's Check-ins</div>
                        </div>
                        <div class="stat-card">
                            <div class="value">${metrics.unique_countries || 0}</div>
                            <div class="label">Countries</div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading dashboard:', error);
                showError('Could not load dashboard. Please try again.');
            }
        }

        async function loadVisitors() {
            setActiveMenu(event?.currentTarget);
            showLoader();
            
            try {
                const response = await fetch(`${API_BASE_URL}/visitors?expo_id=${currentExpoId}`, {
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) throw new Error('Could not fetch visitors');

                const data = await response.json();
                const visitors = data.visitors || [];

                let content = `
                    <h2 class="mb-4">
                        <i class="bi bi-people text-primary"></i> Visitors (${visitors.length})
                    </h2>
                    
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="window.location.href='form-builder.html'">
                            <i class="bi bi-plus-circle"></i> Create Registration Form
                        </button>
                        <button class="btn btn-primary" onclick="loadImport()">
                            <i class="bi bi-upload"></i> Import Visitors
                        </button>
                    </div>
                `;

                if (visitors.length === 0) {
                    content += `
                        <div class="empty-state">
                            <div class="empty-state-icon">
                                <i class="bi bi-people"></i>
                            </div>
                            <h3>No Visitors Yet</h3>
                            <p>No registered visitors found for this expo.</p>
                            <button class="btn btn-primary" onclick="window.location.href='form-builder.html'">
                                <i class="bi bi-plus-circle"></i> Create Your First Form
                            </button>
                        </div>
                    `;
                } else {
                    content += `
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Company</th>
                                        <th>Country</th>
                                        <th>Source</th>
                                        <th>Registration Date</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    visitors.forEach(v => {
                        let fields = {};
                        try {
                            fields = typeof v.custom_fields === 'string' ? 
                                JSON.parse(v.custom_fields) : v.custom_fields || {};
                        } catch (e) {
                            fields = {};
                        }

                        content += `
                            <tr>
                                <td>${v.id}</td>
                                <td>${v.name || fields.name || fields.full_name || '-'}</td>
                                <td>${v.email || fields.email || '-'}</td>
                                <td>${v.company || fields.company || '-'}</td>
                                <td>${fields.country || '-'}</td>
                                <td>${v.source || '-'}</td>
                                <td>${new Date(v.created_at).toLocaleDateString()}</td>
                            </tr>
                        `;
                    });

                    content += `
                                </tbody>
                            </table>
                        </div>
                    `;
                }

                document.getElementById('content-area').innerHTML = content;

            } catch (error) {
                console.error('Error loading visitors:', error);
                showError('Could not load visitors. Please try again.');
            }
        }

        async function loadForms() {
            setActiveMenu(event?.currentTarget);
            showLoader();
            
            try {
                const response = await fetch(`${API_BASE_URL}/forms/expo/${currentExpoId}`, {
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) throw new Error('Could not fetch forms');

                const data = await response.json();
                const forms = data.forms || [];

                let content = `
                    <h2 class="mb-4">
                        <i class="bi bi-card-list text-primary"></i> Registration Forms (${forms.length})
                    </h2>
                    
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="window.location.href='form-builder.html'">
                            <i class="bi bi-plus-circle"></i> Create New Form
                        </button>
                        <button class="btn btn-primary" onclick="window.location.href='form-list.html?expo_id=${currentExpoId}'">
                            <i class="bi bi-list"></i> Manage All Forms
                        </button>
                    </div>
                `;

                if (forms.length === 0) {
                    content += `
                        <div class="empty-state">
                            <div class="empty-state-icon">
                                <i class="bi bi-ui-checks"></i>
                            </div>
                            <h3>No Forms Yet</h3>
                            <p>Create your first registration form for this expo.</p>
                            <button class="btn btn-primary" onclick="window.location.href='form-builder.html'">
                                <i class="bi bi-plus-circle"></i> Create Your First Form
                            </button>
                        </div>
                    `;
                } else {
                    content += '<div class="forms-grid">';
                    
                    forms.forEach(form => {
                        const isActive = form.is_active;
                        const publicUrl = `${window.location.origin}/form-public.html?id=${form.id}`;
                        
                        content += `
                            <div class="form-card" onclick="editForm(${form.id})">
                                <div class="form-card-header">
                                    ${form.name}
                                    <span class="status-badge">
                                        ${isActive ? 'Active' : 'Inactive'}
                                    </span>
                                </div>
                                <div class="form-card-body">
                                    <p class="text-muted small mb-2">
                                        ${form.description || 'No description'}
                                    </p>
                                    <div class="d-flex justify-content-between mb-2">
                                        <span class="text-muted">
                                            <i class="bi bi-ui-checks"></i> ${form.fields?.length || 0} fields
                                        </span>
                                        <span class="text-primary">
                                            <i class="bi bi-people"></i> ${form.submission_count || 0} submissions
                                        </span>
                                    </div>
                                    <small class="text-muted">
                                        <i class="bi bi-calendar-event"></i> 
                                        ${form.expo_name || 'All Expos'}
                                    </small>
                                </div>
                                <div class="form-card-footer">
                                    <div class="btn-group w-100" onclick="event.stopPropagation()">
                                        <button class="btn btn-sm btn-outline-primary" onclick="editForm(${form.id})">
                                            <i class="bi bi-pencil"></i> Edit
                                        </button>
                                        <button class="btn btn-sm btn-outline-info" onclick="copyFormUrl('${publicUrl}')">
                                            <i class="bi bi-link-45deg"></i> Copy Link
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger" onclick="deleteForm(${form.id})">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    
                    content += '</div>';
                }

                document.getElementById('content-area').innerHTML = content;

            } catch (error) {
                console.error('Error loading forms:', error);
                showError('Could not load forms. Please try again.');
            }
        }

        function loadCheckins() {
            setActiveMenu(event?.currentTarget);
            window.location.href = 'checkins.html';
        }

        function loadTerminals() {
            setActiveMenu(event?.currentTarget);
            window.location.href = 'terminals.html';
        }

        function loadEmailTemplates() {
            setActiveMenu(event?.currentTarget);
            window.location.href = 'email-templates.html';
        }

        function loadReports() {
            setActiveMenu(event?.currentTarget);
            window.location.href = 'reports.html';
        }

        function loadImport() {
            setActiveMenu(event?.currentTarget);
            window.location.href = 'import.html';
        }

        // --- FORM ACTIONS ---
        function editForm(formId) {
            window.location.href = `form-builder.html?id=${formId}`;
        }

        function copyFormUrl(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert('Form URL copied to clipboard!');
            }).catch(() => {
                alert('Failed to copy URL');
            });
        }

        async function deleteForm(formId) {
            if (!confirm('Are you sure you want to delete this form?')) return;
            
            try {
                const response = await fetch(`${API_BASE_URL}/forms/${formId}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                
                if (response.ok) {
                    alert('Form deleted successfully');
                    loadForms();
                } else {
                    const error = await response.json();
                    alert(error.message || 'Failed to delete form');
                }
            } catch (error) {
                console.error('Error deleting form:', error);
                alert('Failed to delete form');
            }
        }
    </script>
</body>
</html>
