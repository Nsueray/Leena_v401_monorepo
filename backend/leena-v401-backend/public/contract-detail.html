<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
    <title>Contract - Leena EMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #4a6fa5;
            --primary-hover: #3d5d8a;
            --primary-light: #eef2f7;
            --sidebar-bg: #1a1a2e;
            --sidebar-hover: #252542;
            --sidebar-active: #2d2d4a;
            --sidebar-text: #9ca3af;
            --sidebar-text-active: #ffffff;
            --sidebar-border: #252542;
            --bg: #f4f6fa;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text: #1f2937;
            --text-muted: #6b7280;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); }
        .app-shell { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 24px 20px; border-bottom: 1px solid var(--sidebar-border); }
        .sidebar-logo { height: 32px; }
        .sidebar-nav { padding: 16px 12px; flex: 1; }
        .nav-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--sidebar-text); padding: 8px 12px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--sidebar-text); text-decoration: none; font-size: 14px; font-weight: 500; margin-bottom: 2px; }
        .nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
        .nav-item.active { background: var(--sidebar-active); color: var(--sidebar-text-active); }
        .nav-divider { height: 1px; background: var(--sidebar-border); margin: 12px 0; }

        /* Main */
        .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .main-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 28px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .main-header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .main-content { padding: 24px 28px; }

        .btn { font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
        .btn-ghost:hover { background: var(--primary-light); }
        .btn-sm { padding: 6px 12px; font-size: 13px; }

        /* Table */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .card-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; padding: 14px 16px; border-bottom: 1px solid var(--border); background: #fafbfc; }
        table { width: 100%; border-collapse: collapse; }
        thead th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; padding: 14px 16px; border-bottom: 1px solid var(--border); background: #fafbfc; }
        tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
        tbody tr:last-child td { border-bottom: none; }
        .muted { color: var(--text-muted); }
        .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

        /* Label:value rows (detail sections) */
        .kv { display: grid; grid-template-columns: 220px 1fr; gap: 0; }
        .kv > div { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .kv > div:nth-child(odd) { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; background: #fcfcfd; }
        .kv > div:nth-last-child(-n+2) { border-bottom: none; }

        /* Inline status select — contract-list.html:74-75 deseni */
        .status-select { font-family: inherit; font-size: 13px; font-weight: 600; padding: 5px 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text); cursor: pointer; }
        .status-select:disabled { opacity: 0.6; cursor: progress; }

        /* Add-payment form — contract-list.html:79-82 deseni */
        .pay-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 16px; }
        .pay-form label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; }
        .pay-form input, .pay-form select { font-family: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); min-width: 130px; }
        .pay-form input:disabled { background: var(--primary-light); }

        /* Reversal rozetleri — düz metin, renk/stil oyunu yok */
        .tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; }

        /* Commission assignment rows */
        .assign-row { display: grid; grid-template-columns: 90px 1fr 120px; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .assign-row label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; }
        .assign-row select, .assign-row input { font-family: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
        .assign-row select:disabled, .assign-row input:disabled { background: var(--primary-light); opacity: 0.7; }

        .empty-state { padding: 40px 20px; text-align: center; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="app-shell">
        <nav class="sidebar">
            <div class="sidebar-header">
                <img src="assets/Leena_logo_white_nobg.png" alt="Leena" class="sidebar-logo">
            </div>
            <div class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Finance</div>
                    <a class="nav-item active" href="contract-list.html">
                        <i class="bi bi-file-earmark-text"></i><span>Contracts</span>
                    </a>
                    <a class="nav-item" href="sales-agents.html">
                        <i class="bi bi-person-badge"></i><span>Sales Agents</span>
                    </a>
                </div>
                <div class="nav-divider"></div>
                <div class="nav-section">
                    <a class="nav-item" href="dashboard_new.html">
                        <i class="bi bi-collection"></i><span>My Expos</span>
                    </a>
                    <a class="nav-item" href="#" onclick="logout(); return false;">
                        <i class="bi bi-box-arrow-right"></i><span>Logout</span>
                    </a>
                </div>
            </div>
        </nav>

        <div class="main-wrapper">
            <header class="main-header">
                <h1><i class="bi bi-file-earmark-text"></i> <span id="pageTitle">Contract</span></h1>
                <a class="btn btn-ghost" href="contract-list.html"><i class="bi bi-arrow-left"></i> Back to list</a>
            </header>

            <main class="main-content">
                <div class="card">
                    <div class="card-title">Contract</div>
                    <div class="kv" id="identity">
                        <div>Loading…</div><div></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">Money</div>
                    <div class="kv" id="money"></div>
                </div>

                <div class="card">
                    <div class="card-title">Operational</div>
                    <div class="kv" id="operational"></div>
                </div>

                <div class="card">
                    <div class="card-title">Commission</div>
                    <div id="commissionCalc"></div>
                    <form class="assign-form" id="assignForm" onsubmit="submitAssignment(event)">
                        <div id="assignRows"><span class="muted" style="padding:16px;display:block">Loading agents…</span></div>
                        <div style="padding:0 16px 16px"><button class="btn btn-primary btn-sm" type="submit">Save</button></div>
                    </form>
                </div>

                <div class="card">
                    <div class="card-title">Line Items</div>
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Product Code</th>
                                <th>Description</th>
                                <th class="num">Qty</th>
                                <th class="num">Unit Price</th>
                                <th class="num">Disc %</th>
                                <th>RF</th>
                                <th class="num">Line Total</th>
                            </tr>
                        </thead>
                        <tbody id="lineItemBody">
                            <tr><td colspan="8" class="empty-state">Loading…</td></tr>
                        </tbody>
                    </table>
                    <div id="commBase" style="padding: 14px 16px; border-top: 1px solid var(--border); font-size: 14px;"></div>
                </div>

                <div class="card">
                    <div class="card-title">Payments</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th class="num">Amount</th>
                                <th class="num">Rate</th>
                                <th class="num">EUR</th>
                                <th>Method</th>
                                <th>Office</th>
                                <th>Notes</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="paymentBody">
                            <tr><td colspan="8" class="empty-state">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="card">
                    <div class="card-title">Add payment</div>
                    <form class="pay-form" id="payForm" onsubmit="submitPayment(event)">
                        <label>Amount<input name="amount" type="text" autocomplete="off"></label>
                        <label>Currency<select name="currency" onchange="lockRateIfEur()"></select></label>
                        <label>Exchange rate<input name="exchange_rate" type="text" value="1" disabled autocomplete="off"></label>
                        <label>Method<select name="payment_method"></select></label>
                        <label>Office<select name="received_office_id"></select></label>
                        <label>Date<input name="payment_date" type="date"></label>
                        <label>Notes<input name="notes" type="text" autocomplete="off"></label>
                        <button class="btn btn-primary btn-sm" type="submit">Save</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="/leena-toast.js"></script>
    <script src="/leena-fetch.js"></script>
    <script>
        const API_URL = '/api';
        const CONTRACT_STATUSES = ['Active', 'On Hold', 'Transferred', 'Cancelled'];
        const PAYMENT_METHODS = ['bank_transfer', 'cash', 'cheque', 'credit_card', 'other'];
        // contract-list.html:167-170 ile aynı liste (UI konfigürasyonu; server whitelist yok).
        const CURRENCIES = ['EUR', 'USD', 'TRY', 'MAD', 'NGN', 'KES'];

        // expo-form.html:222 deseni — id querystring'den
        const contractId = new URLSearchParams(location.search).get('id');

        let salesAgents = [];   // GET /api/sales-agents
        let offices = [];       // GET /api/offices (PS2-A: ödeme "para nereye geldi"; koda gömülmez)
        let lastContract = null; // son yüklenen contract (assignment render'ı için)

        // contract-list.html:174-175 guard deseni
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'login.html'; return; }
            if (!contractId) { window.location.href = 'contract-list.html'; return; }
            fillFormOptions();
            await loadSalesAgents();   // dropdown verisi contract render'ından önce
            await loadOffices();       // ofis dropdown'ı (fail-soft)
            loadContract();
            loadPayments();
        });

        async function loadSalesAgents() {
            try {
                const res = await leenaFetch(`${API_URL}/sales-agents`);
                if (res.ok) salesAgents = await res.json();
            } catch (err) {
                if (err.status === 401 || err.status === 403) return;
                // Liste boş kalırsa dropdown yalnız "—" gösterir; atama yapılamaz ama sayfa çalışır.
            }
        }

        // GET /api/offices — loadSalesAgents deseni. FAIL-SOFT: hata olsa da form/liste çalışır
        // (dropdown boş, kolonda "—"). Ofis listesi frontend'de sabit DEĞİL — tablodan gelir.
        async function loadOffices() {
            try {
                const res = await leenaFetch(`${API_URL}/offices`);
                if (res.ok) offices = await res.json();
            } catch (err) {
                if (err.status === 401 || err.status === 403) return;
            }
            const f = document.getElementById('payForm');
            if (f && f.received_office_id) {
                f.received_office_id.innerHTML = ['<option value="">—</option>']
                    .concat(offices.map(o => `<option value="${o.id}">${escapeHtml(o.name)}</option>`)).join('');
            }
        }
        // Ödeme satırındaki received_office_id → ada eşle (JOIN yok; liste bellekten). Yoksa "—".
        function officeName(id) {
            if (id == null) return dash();
            const o = offices.find(x => String(x.id) === String(id));
            return o ? escapeHtml(o.name) : dash();
        }

        function fillFormOptions() {
            const f = document.getElementById('payForm');
            f.currency.innerHTML = CURRENCIES.map(c => `<option value="${c}">${c}</option>`).join('');
            f.payment_method.innerHTML = PAYMENT_METHODS.map(m => `<option value="${m}">${m}</option>`).join('');
        }

        async function loadContract() {
            try {
                const res = await leenaFetch(`${API_URL}/contracts/${contractId}`);
                if (!res.ok) {
                    // 404 → expo-form.html:276 deseni (toast + geri dön)
                    showToast('Contract not found', 'error');
                    setTimeout(() => { window.location.href = 'contract-list.html'; }, 1500);
                    return;
                }
                render(await res.json());
            } catch (err) {
                if (err.status === 401 || err.status === 403) return;
                document.getElementById('identity').innerHTML =
                    '<div>Error</div><div>Could not load contract. <button class="btn btn-ghost btn-sm" onclick="loadContract()">Retry</button></div>';
            }
        }

        async function loadPayments() {
            try {
                const res = await leenaFetch(`${API_URL}/contracts/${contractId}/payments`);
                if (!res.ok) return;
                renderPayments(await res.json());
            } catch (err) {
                if (err.status === 401 || err.status === 403) return;
                document.getElementById('paymentBody').innerHTML =
                    '<tr><td colspan="7" class="empty-state">Error loading payments. <button class="btn btn-ghost btn-sm" onclick="loadPayments()">Retry</button></td></tr>';
            }
        }

        function render(c) {
            lastContract = c;
            document.getElementById('pageTitle').textContent = c.af_number || `Contract #${c.id}`;
            renderAssignment(c);
            renderCommission(c);
            renderLineItems(c);

            document.getElementById('identity').innerHTML =
                  kv('AF No', c.af_number ? escapeHtml(c.af_number) : dash())
                + kv('Company', c.company_name ? escapeHtml(c.company_name) : dash())
                + kv('Expo', c.expo_name ? escapeHtml(c.expo_name) : dash())
                + kv('Contract date', formatDate(c.contract_date))
                + kv('Status', statusSelect(c))
                + transferRows(c);

            document.getElementById('money').innerHTML =
                  kv('Revenue', money(c.revenue, c.currency))
                + kv('Exchange rate', c.exchange_rate == null ? dash() : escapeHtml(String(c.exchange_rate)))
                + kv('Revenue (EUR)', money(c.revenue_eur, 'EUR'))
                + kv('Paid (EUR)', money(c.paid_eur, 'EUR'))
                + kv('Balance (EUR)', money(c.balance_eur, 'EUR'));

            // 016'nın 9 operasyonel alanı — salt-okunur.
            // transferred_from_contract_id ham id olarak gösterilir; devreden
            // contract'a join/link YOK — Transfer aksiyonu 3a-4 adayı.
            document.getElementById('operational').innerHTML =
                  kv('Scan link', link(c.scan_link))
                + kv('Stand design link', link(c.stand_design_link))
                + kv('Catalogue page', c.catalogue_page ? escapeHtml(c.catalogue_page) : dash())
                + kv('Stand type', c.stand_type ? escapeHtml(c.stand_type) : dash())
                + kv('SQM', c.sqm == null ? dash() : escapeHtml(String(c.sqm)))
                + kv('Free SQM', c.free_sqm == null ? dash() : escapeHtml(String(c.free_sqm)))
                + kv('Sales group', c.sales_group ? escapeHtml(c.sales_group) : dash())
                + kv('Transportation', c.transportation ? escapeHtml(c.transportation) : dash());
            // NOT: "Transferred from" artık künye bölümünde af linki olarak gösteriliyor
            // (ham id gösterimi 3a-5'te kaldırıldı) — bkz. transferRows().
        }

        // Transfer zinciri + Transfer aksiyonu — künye bölümünün sonuna eklenir.
        // Komisyon atama bölümü — üç satır (Agent / SR / SD).
        // SUER İLKESİ: oran default'tan otomatik gelir; pct input'u BOŞ bırakılırsa
        // motor default_commission_pct'i kullanır (input'a otomatik YAZILMAZ,
        // placeholder'da gösterilir). Override ancak bilinçle yazılır.
        const AGENT_ROLES = [
            { key: 'agent', label: 'Agent', fk: 'agent_sales_agent_id', pct: 'agent_pct', name: 'agent_name' },
            { key: 'sr',    label: 'SR',    fk: 'sr_sales_agent_id',    pct: 'sr_pct',    name: 'sr_name' },
            { key: 'sd',    label: 'SD',    fk: 'sd_sales_agent_id',    pct: 'sd_pct',    name: 'sd_name' }
        ];

        function renderAssignment(c) {
            const box = document.getElementById('assignRows');
            if (!box) return;
            box.innerHTML = AGENT_ROLES.map(r => {
                const selId = c[r.fk];
                const options = ['<option value="">—</option>'].concat(
                    salesAgents.map(a =>
                        `<option value="${a.id}"${String(a.id) === String(selId) ? ' selected' : ''}>${escapeHtml(a.name)}</option>`)
                ).join('');
                const pctVal = c[r.pct] == null ? '' : escapeHtml(String(c[r.pct]));
                const assignedName = c[r.name] ? ` <span class="muted">(${escapeHtml(c[r.name])})</span>` : '';
                return `<div class="assign-row">
                    <label>${r.label}${assignedName}</label>
                    <select data-role="${r.key}" onchange="onAgentChange()">${options}</select>
                    <input data-pct="${r.key}" type="text" autocomplete="off" value="${pctVal}" placeholder="default %">
                </div>`;
            }).join('');
            onAgentChange();   // dışlayıcılık + placeholder ilk durum
        }

        function assignEl(role, kind) {
            return document.querySelector(`#assignRows [data-${kind}="${role}"]`);
        }

        // Dışlayıcılık UI'da: Agent seçilince SR disable+temizlenir (ve tersi);
        // SR boşsa SD disable. Placeholder: seçilen agent'ın default_commission_pct'i.
        function onAgentChange() {
            const agentSel = assignEl('agent', 'role');
            const srSel    = assignEl('sr', 'role');
            const sdSel    = assignEl('sd', 'role');
            if (!agentSel || !srSel || !sdSel) return;

            const agentSet = !!agentSel.value;
            const srSet    = !!srSel.value;

            // Agent ↔ SR dışlayıcılık
            srSel.disabled = agentSet;
            if (agentSet) { srSel.value = ''; }
            agentSel.disabled = srSet;
            if (srSet) { agentSel.value = ''; }

            // SD yalnız SR varken
            const srNowSet = !!srSel.value;
            sdSel.disabled = !srNowSet;
            if (!srNowSet) { sdSel.value = ''; }

            // pct input'ları: FK boşsa disable+temizle; doluysa placeholder = default
            AGENT_ROLES.forEach(r => {
                const sel = assignEl(r.key, 'role');
                const pctIn = assignEl(r.key, 'pct');
                if (!sel || !pctIn) return;
                if (!sel.value) {
                    pctIn.value = '';
                    pctIn.disabled = true;
                    pctIn.placeholder = 'default %';
                } else {
                    pctIn.disabled = false;
                    const a = salesAgents.find(x => String(x.id) === String(sel.value));
                    // Placeholder default'u gösterir; input'a YAZMAZ (override bilinçli).
                    pctIn.placeholder = (a && a.default_commission_pct != null)
                        ? `default ${a.default_commission_pct}` : 'default %';
                }
            });
        }

        async function submitAssignment(ev) {
            ev.preventDefault();
            const num = (v) => (v === '' || v == null) ? null : Number(v);
            // TAM SET — disabled alanlar da NULL olarak gider.
            const body = {
                agent_sales_agent_id: assignEl('agent', 'role').value ? Number(assignEl('agent', 'role').value) : null,
                sr_sales_agent_id:    assignEl('sr', 'role').value ? Number(assignEl('sr', 'role').value) : null,
                sd_sales_agent_id:    assignEl('sd', 'role').value ? Number(assignEl('sd', 'role').value) : null,
                agent_pct: num(assignEl('agent', 'pct').value),
                sr_pct:    num(assignEl('sr', 'pct').value),
                sd_pct:    num(assignEl('sd', 'pct').value)
            };
            const btn = ev.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            try {
                const res = await leenaFetch(`${API_URL}/contracts/${contractId}/assignment`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (res.ok) {
                    showToast('Assignment saved', 'success');
                    // TAM yenileme (add-payment deseni): PUT cevabı paylaşımlı
                    // CONTRACT_DETAIL_SQL'den döner ve line_items/commission TAŞIMAZ
                    // (onlar GET /:id'de ayrı sorgularla eklenir). data.contract ile
                    // render edersek o kartlar "yok" sanılır → loadContract() ile tam GET.
                    loadContract();
                } else {
                    let msg = 'Assignment failed';
                    try { const e = await res.json(); if (e && e.error) msg = e.error; } catch (_) {}
                    showToast(msg, 'error');
                }
            } catch (err) {
                if (!(err.status === 401 || err.status === 403)) showToast('Assignment failed', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        function transferRows(c) {
            let out = '';
            if (c.transferred_from_af || c.transferred_from_contract_id != null) {
                const label = c.transferred_from_af ? escapeHtml(c.transferred_from_af) : `#${escapeHtml(String(c.transferred_from_contract_id))}`;
                out += kv('Transferred from',
                    `<a href="contract-detail.html?id=${escapeHtml(String(c.transferred_from_contract_id))}">${label}</a>`);
            }
            if (c.transferred_to_id != null) {
                const label = c.transferred_to_af ? escapeHtml(c.transferred_to_af) : `#${escapeHtml(String(c.transferred_to_id))}`;
                out += kv('Transferred to',
                    `<a href="contract-detail.html?id=${escapeHtml(String(c.transferred_to_id))}">${label}</a>`);
            }
            // Transfer aksiyonu yalnız Active/On Hold VE henüz devri yokken.
            const canTransfer = (c.status === 'Active' || c.status === 'On Hold') && c.transferred_to_id == null;
            if (canTransfer) {
                out += kv('Transfer',
                    `<button class="btn btn-ghost btn-sm" onclick="openTransferForm()">Transfer to another expo</button>
                     <div id="transferBox" style="display:none;margin-top:10px"></div>`);
            }
            return out;
        }

        // Inline mini form (pay-form deseni) — modal yok.
        async function openTransferForm() {
            const box = document.getElementById('transferBox');
            if (!box) return;
            if (box.style.display !== 'none') { box.style.display = 'none'; return; }
            box.style.display = '';
            box.innerHTML = '<span class="muted">Loading expos…</span>';
            try {
                const res = await leenaFetch(`${API_URL}/expos`);
                if (!res.ok) { box.innerHTML = '<span class="muted">Could not load expos.</span>'; return; }
                const expos = await res.json();
                if (!expos.length) { box.innerHTML = '<span class="muted">No expos.</span>'; return; }
                const opts = expos.map(e =>
                    `<option value="${escapeHtml(String(e.id))}">${escapeHtml(e.name || ('#' + e.id))}</option>`).join('');
                box.innerHTML = `<form class="pay-form" style="padding:0" onsubmit="submitTransfer(event)">
                    <label>Target expo<select name="expo_id">${opts}</select></label>
                    <button class="btn btn-primary btn-sm" type="submit">Confirm</button>
                    <button class="btn btn-ghost btn-sm" type="button" onclick="openTransferForm()">Cancel</button>
                </form>`;
            } catch (err) {
                if (!(err.status === 401 || err.status === 403)) box.innerHTML = '<span class="muted">Could not load expos.</span>';
            }
        }

        // 201 → yeni contract'ın detayına yönlendir (klon yeni bir kayıttır).
        async function submitTransfer(ev) {
            ev.preventDefault();
            const f = ev.target;
            const btn = f.querySelector('button[type="submit"]');
            btn.disabled = true;
            try {
                const res = await leenaFetch(`${API_URL}/contracts/${contractId}/transfer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ expo_id: Number(f.expo_id.value) })
                });
                if (res.ok) {
                    const data = await res.json();
                    showToast('Contract transferred', 'success');
                    window.location.href = `contract-detail.html?id=${data.contract.id}`;
                } else {
                    // show the server's message verbatim (400 / 404 / 409)
                    let msg = 'Transfer failed';
                    try { const e = await res.json(); if (e && e.error) msg = e.error; } catch (_) {}
                    showToast(msg, 'error');
                    btn.disabled = false;
                }
            } catch (err) {
                if (!(err.status === 401 || err.status === 403)) showToast('Transfer failed', 'error');
                btn.disabled = false;
            }
        }

        // Commission hesap görünümü (M1) — salt-okunur; atama formu ayrı (aşağıda).
        // Tutarlar backend'den (D2, saklanmaz); "427.50 MAD (38.48 EUR)" deseni.
        function renderCommission(c) {
            const box = document.getElementById('commissionCalc');
            if (!box) return;
            const cm = c.commission;
            if (cm == null) {
                // Satırsız → matrah yok, komisyon hesaplanamaz.
                box.innerHTML = `<div class="kv"><div>Commission</div><div class="muted">— (line items missing)</div></div>`;
                return;
            }
            // Üst satır: Base + Collection % (+ overpaid notu).
            const ratioPct = cm.ratio == null ? dash() : `${(Number(cm.ratio) * 100).toFixed(0)}%`;
            const over = cm.overpayment ? ' <span class="tag">overpaid</span>' : '';
            let head = `<div class="kv">
                <div>Base</div><div>${money(cm.base, c.currency)}</div>
                <div>Collection</div><div>${ratioPct}${over}</div>
            </div>`;
            const roles = cm.roles || [];
            if (!roles.length) {
                box.innerHTML = head + `<div class="empty-state" style="padding:20px">No commission roles assigned</div>`;
                return;
            }
            // Rol tablosu: Role · Agent · Rate (oran+kaynak) · Full · Earned to Date.
            const rows = roles.map(r => {
                const rate = r.reason === 'rate missing'
                    ? '<span class="muted">rate missing</span>'
                    : (r.pct_used == null ? dash()
                        : `${escapeHtml(String(r.pct_used))}% (${escapeHtml(r.pct_source || '')})`);
                // pair(): contract parası + EUR ("427.50 MAD (38.48 EUR)"); *_eur null → yalnız contract parası.
                const pair = (amt, amtEur) => {
                    if (amt == null) return dash();
                    const main = money(amt, c.currency);
                    return amtEur == null ? main : `${main} (${money(amtEur, 'EUR')})`;
                };
                return `<tr>
                    <td>${escapeHtml(r.role)}</td>
                    <td>${r.agent_name ? escapeHtml(r.agent_name) : dash()}</td>
                    <td>${rate}</td>
                    <td class="num">${pair(r.full, r.full_eur)}</td>
                    <td class="num">${pair(r.earned, r.earned_eur)}</td>
                </tr>`;
            }).join('');
            box.innerHTML = head + `<table>
                <thead><tr><th>Role</th><th>Agent</th><th>Rate</th><th class="num">Full</th><th class="num">Earned to Date</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>`;
        }

        // Line items are immutable (born at convert; no edit/delete UI).
        // Order comes from the API (ORDER BY line_no) — not re-sorted here.
        function renderLineItems(c) {
            const body = document.getElementById('lineItemBody');
            const summary = document.getElementById('commBase');
            const rows = c.line_items || [];
            if (!rows.length) {
                // Satırsız contract: commissionable_base null + reason (backend).
                body.innerHTML = '<tr><td colspan="8" class="empty-state">No line items</td></tr>';
                summary.innerHTML = '<strong>Commissionable Base:</strong> <span class="muted">— (line items missing)</span>';
                return;
            }
            body.innerHTML = rows.map(li => {
                // Line Total UI'da hesaplanır (D2 — server saklamaz/göndermez).
                // money() → formatMoney zaten 2 haneye yuvarlar (round2 eşdeğeri).
                const total = Number(li.quantity) * Number(li.unit_price) * (1 - Number(li.discount_percent) / 100);
                return `<tr>
                    <td>${escapeHtml(String(li.line_no))}</td>
                    <td>${li.product_code ? escapeHtml(li.product_code) : dash()}</td>
                    <td>${escapeHtml(li.description)}</td>
                    <td class="num">${escapeHtml(String(li.quantity))}</td>
                    <td class="num">${money(li.unit_price, li.currency)}</td>
                    <td class="num">${escapeHtml(String(li.discount_percent))}</td>
                    <td>${li.is_registration_fee ? '<span class="tag">RF</span>' : ''}</td>
                    <td class="num">${money(total, li.currency)}</td>
                </tr>`;
            }).join('');
            // Commissionable base backend'den gelir (RF hariç, D2 hesap); currency = contract.
            summary.innerHTML = `<strong>Commissionable Base:</strong> ${money(c.commissionable_base, c.currency)}`;
        }

        // Payments are immutable events — no edit/delete here by design
        // (correction flow belongs to the ledger phase). Order comes from the API.
        function renderPayments(data) {
            const rows = (data && data.payments) || [];
            const body = document.getElementById('paymentBody');
            if (!rows.length) {
                body.innerHTML = '<tr><td colspan="8" class="empty-state">No payments yet.</td></tr>';
                return;
            }
            // Reverse edilmişlik client'ta hesaplanır: bu listede herhangi bir
            // satırın reverses_payment_id'si bu satırın id'sine eşit mi?
            // (backend'e ek alan eklenmedi)
            const reversedIds = new Set(
                rows.filter(p => p.reverses_payment_id != null).map(p => p.reverses_payment_id)
            );

            body.innerHTML = rows.map(p => {
                const isReversal = p.reverses_payment_id != null;
                const isReversed = reversedIds.has(p.id);
                // Reverse yalnız "reversal olmayan VE reverse edilmemiş" satırlarda
                const action = (!isReversal && !isReversed)
                    ? `<button class="btn btn-ghost btn-sm"
                               onclick="reversePayment(${p.id}, '${escapeHtml(String(p.amount))}', '${escapeHtml(p.currency || '')}')">Reverse</button>`
                    : isReversal
                        ? `<span class="tag">Reversal of #${escapeHtml(String(p.reverses_payment_id))}</span>`
                        : '<span class="tag">Reversed</span>';
                return `<tr>
                <td>${formatDate(p.payment_date)}</td>
                <td class="num">${money(p.amount, p.currency)}</td>
                <td class="num">${p.exchange_rate == null ? dash() : escapeHtml(String(p.exchange_rate))}</td>
                <td class="num">${money(p.amount_eur, 'EUR')}</td>
                <td>${escapeHtml(p.payment_method || '')}</td>
                <td>${officeName(p.received_office_id)}</td>
                <td>${p.notes ? escapeHtml(p.notes) : dash()}</td>
                <td>${action}</td>
            </tr>`;
            }).join('');
        }

        // Storno: orijinal satır değişmez, negatif bir ters kayıt eklenir.
        // Server notes'u kendi yazar; buradan body gönderilmez.
        async function reversePayment(paymentId, amount, currency) {
            if (!confirm(`Reverse payment #${paymentId} (${amount} ${currency})? This will add a negative entry.`)) return;
            try {
                const res = await leenaFetch(`${API_URL}/contracts/${contractId}/payments/${paymentId}/reverse`, {
                    method: 'POST'
                });
                if (res.ok) {
                    showToast('Payment reversed', 'success');
                    loadPayments();   // ödeme listesi
                    loadContract();   // paid/balance özeti
                } else {
                    // show the server's message verbatim (400 / 404 / 409)
                    let msg = 'Reverse failed';
                    try { const e = await res.json(); if (e && e.error) msg = e.error; } catch (_) {}
                    showToast(msg, 'error');
                }
            } catch (err) {
                if (!(err.status === 401 || err.status === 403)) showToast('Reverse failed', 'error');
            }
        }

        function kv(label, value) { return `<div>${escapeHtml(label)}</div><div>${value}</div>`; }
        function dash() { return '<span class="muted">—</span>'; }
        // NULL → — (0 uydurma yok), contract-list.html formatMoney deseni
        function money(amount, currency) {
            const s = formatMoney(amount, currency);
            return s === '' ? dash() : s;
        }
        // Only http(s) becomes a link; anything else is shown as plain text
        // (a javascript: value must never become clickable).
        function link(url) {
            if (!url) return dash();
            const safe = escapeHtml(url);
            return /^https?:\/\//i.test(url)
                ? `<a href="${safe}" target="_blank" rel="noopener">${safe}</a>`
                : safe;
        }

        // contract-list.html:321-328 deseni
        function statusSelect(c) {
            const current = c.status || '';
            const options = CONTRACT_STATUSES.map(s =>
                `<option value="${escapeHtml(s)}"${s === current ? ' selected' : ''}>${escapeHtml(s)}</option>`
            ).join('');
            return `<select class="status-select" data-prev="${escapeHtml(current)}"
                            onchange="changeStatus(this)">${options}</select>`;
        }

        // contract-list.html:333-365 deseni. Farkı: başarıda sayfa refetch edilir.
        async function changeStatus(sel) {
            const next = sel.value;
            const prev = sel.dataset.prev;
            if (next === prev) return;

            sel.disabled = true;
            try {
                const res = await leenaFetch(`${API_URL}/contracts/${contractId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: next })
                });
                if (res.ok) {
                    showToast(`Status updated to ${next}`, 'success');
                    loadContract();
                } else {
                    let msg = 'Status update failed';
                    try { const e = await res.json(); if (e && e.error) msg = e.error; } catch (_) {}
                    sel.value = prev;
                    showToast(msg, 'error');
                }
            } catch (err) {
                if (!(err.status === 401 || err.status === 403)) {
                    sel.value = prev;
                    showToast('Status update failed', 'error');
                }
            } finally {
                sel.disabled = false;
            }
        }

        // contract-list.html:270-280 deseni (tek form olduğu için id parametresi yok)
        function lockRateIfEur() {
            const f = document.getElementById('payForm');
            if (!f) return;
            const isEur = f.currency.value.trim().toUpperCase() === 'EUR';
            f.exchange_rate.disabled = isEur;
            f.exchange_rate.value = isEur ? '1' : '';
        }

        // contract-list.html:282-319 deseni. Farkı: başarıda ödeme listesi +
        // para özeti refetch edilir (form kapanmaz — sayfada kalıcı bölüm).
        async function submitPayment(ev) {
            ev.preventDefault();
            const f = ev.target;
            const body = {
                amount: f.amount.value,
                currency: f.currency.value,
                // disabled inputs are omitted from the form, so read the value directly
                exchange_rate: f.exchange_rate.value,
                payment_method: f.payment_method.value,
                payment_date: f.payment_date.value,
                notes: f.notes.value || null,
                received_office_id: f.received_office_id.value || null   // boş → null (boş string gönderme)
            };
            const submitBtn = f.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            try {
                const res = await leenaFetch(`${API_URL}/contracts/${contractId}/payments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (res.ok) {
                    f.reset();              // currency → default EUR
                    lockRateIfEur();        // ...dolayısıyla rate yeniden 1 ve kilitli
                    showToast('Payment added', 'success');
                    loadPayments();         // ödeme listesi
                    loadContract();         // paid/balance özeti
                } else {
                    // show the server's message verbatim (400 / 404)
                    let msg = 'Payment failed';
                    try { const e = await res.json(); if (e && e.error) msg = e.error; } catch (_) {}
                    showToast(msg, 'error');
                }
            } catch (err) {
                if (!(err.status === 401 || err.status === 403)) showToast('Payment failed', 'error');
            } finally {
                submitBtn.disabled = false;
            }
        }

        function formatDate(d) {
            if (!d) return '<span class="muted">—</span>';
            return new Date(d).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        function formatMoney(amount, currency) {
            if (amount === null || amount === undefined || amount === '') return '';
            const n = Number(amount);
            if (!isFinite(n)) return '';
            const formatted = n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            return currency ? `${formatted} ${escapeHtml(currency)}` : formatted;
        }
        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
    </script>
</body>
</html>
