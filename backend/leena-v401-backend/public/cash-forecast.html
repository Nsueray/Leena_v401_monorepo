<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
    <title>Cash Forecast - Leena EMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #4a6fa5;
            --primary-hover: #3d5d8a;
            --primary-light: #eef2f7;
            --sidebar-bg: #1a1a2e;
            --sidebar-hover: #252542;
            --sidebar-active: #2d2d4a;
            --sidebar-text: #9ca3af;
            --sidebar-text-active: #ffffff;
            --sidebar-border: #252542;
            --bg: #f4f6fa;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text: #1f2937;
            --text-muted: #6b7280;
            --danger: #b91c1c;
            --warn: #92400e;
            --ok: #166534;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); }
        .app-shell { display: flex; min-height: 100vh; }

        .sidebar { width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 24px 20px; border-bottom: 1px solid var(--sidebar-border); }
        .sidebar-logo { height: 32px; }
        .sidebar-nav { padding: 16px 12px; flex: 1; }
        .nav-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--sidebar-text); padding: 8px 12px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--sidebar-text); text-decoration: none; font-size: 14px; font-weight: 500; margin-bottom: 2px; }
        .nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
        .nav-item.active { background: var(--sidebar-active); color: var(--sidebar-text-active); }
        .nav-divider { height: 1px; background: var(--sidebar-border); margin: 12px 0; }

        .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .main-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 28px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .main-header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .main-content { padding: 24px 28px; }

        .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 20px; }
        .filter { display: flex; flex-direction: column; gap: 4px; }
        .filter label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; }
        .filter input { font-family: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); min-width: 150px; }
        .btn { font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }

        .grand { display: flex; align-items: baseline; gap: 12px; padding: 16px 20px; background: var(--primary-light); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 24px; }
        .grand .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; }
        .grand .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fafbfc; }
        tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
        tbody tr:last-child td { border-bottom: none; }
        .muted { color: var(--text-muted); }
        .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .af a { color: var(--primary); font-weight: 600; text-decoration: none; }

        /* Office group */
        .office { margin-bottom: 28px; }
        .office-head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 16px; background: #fafbfc; border: 1px solid var(--border); border-bottom: none; border-radius: 12px 12px 0 0; }
        .office-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .office-name i { color: var(--primary); }
        .office-total { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .office-total .lbl { font-weight: 500; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; margin-right: 8px; }
        .office .card { border-radius: 0 0 12px 12px; border-top: none; }

        .status-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 2px 7px; border-radius: 999px; background: var(--primary-light); color: var(--primary); }
        .paid-full { color: var(--ok); font-weight: 600; }
        .matched { color: var(--primary); font-weight: 700; }   /* C1: eşleşmiş, teleskoptan ayrı */
        .cap-note { color: var(--warn); font-size: 12px; font-weight: 600; }

        /* Overdue vs upcoming split (PLN-11) */
        .office-subtotals { display: flex; gap: 16px; align-items: baseline; }
        .subtotal { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .subtotal .lbl { color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; margin-right: 6px; }
        .subtotal.overdue { color: var(--danger); }
        .group-subhead { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; background: #fafbfc; border-top: 1px solid var(--border); }
        .group-subhead.overdue { color: var(--danger); background: #fdf6f6; }
        .group-subhead .amt { font-variant-numeric: tabular-nums; }
        .overdue-group tbody td { background: #fdf6f6; }

        /* Contracts summary */
        .section-title { font-size: 16px; font-weight: 700; margin: 32px 0 12px; display: flex; align-items: center; gap: 8px; }
        .section-title i { color: var(--primary); }
        .mismatch td { background: #fdf6f6; }
        .mismatch .flag { color: var(--danger); font-weight: 600; }

        .empty-state { padding: 60px 20px; text-align: center; color: var(--text-muted); }
        .footnote { font-size: 12px; color: var(--text-muted); margin-top: 20px; font-style: italic; }
        .counters { margin-top: 12px; font-size: 13px; color: var(--text-muted); }
        .counters span { font-weight: 600; color: var(--text); }
    </style>
</head>
<body>
    <div class="app-shell">
        <nav class="sidebar">
            <div class="sidebar-header">
                <img src="assets/Leena_logo_white_nobg.png" alt="Leena" class="sidebar-logo">
            </div>
            <div class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Finance</div>
                    <a class="nav-item" href="contract-list.html">
                        <i class="bi bi-file-earmark-text"></i><span>Contracts</span>
                    </a>
                    <a class="nav-item" href="sales-agents.html">
                        <i class="bi bi-person-badge"></i><span>Sales Agents</span>
                    </a>
                    <a class="nav-item" href="commissions.html">
                        <i class="bi bi-cash-coin"></i><span>Commissions</span>
                    </a>
                    <a class="nav-item active" href="cash-forecast.html">
                        <i class="bi bi-graph-up-arrow"></i><span>Cash Forecast</span>
                    </a>
                </div>
                <div class="nav-divider"></div>
                <div class="nav-section">
                    <a class="nav-item" href="dashboard_new.html">
                        <i class="bi bi-collection"></i><span>My Expos</span>
                    </a>
                    <a class="nav-item" href="#" onclick="logout(); return false;">
                        <i class="bi bi-box-arrow-right"></i><span>Logout</span>
                    </a>
                </div>
            </div>
        </nav>

        <div class="main-wrapper">
            <header class="main-header">
                <h1><i class="bi bi-graph-up-arrow"></i> Cash Forecast</h1>
            </header>

            <main class="main-content">
                <div class="toolbar">
                    <div class="filter">
                        <label for="fFrom">From (due date)</label>
                        <input id="fFrom" type="date">
                    </div>
                    <div class="filter">
                        <label for="fTo">To (due date)</label>
                        <input id="fTo" type="date">
                    </div>
                    <button class="btn btn-primary" onclick="load()"><i class="bi bi-search"></i> Load</button>
                </div>

                <div id="report">
                    <div class="empty-state">Loading…</div>
                </div>

                <div class="footnote">Collections are applied to the earliest due date first. Month-by-month allocation is therefore an estimate; the total outstanding is exact.</div>
            </main>
        </div>
    </div>

    <script src="/leena-toast.js"></script>
    <script src="/leena-fetch.js"></script>
    <script>
        const API_URL = '/api';

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'login.html'; return; }
            load();   // default aralık backend'de (bugünden ileri, üst sınır açık)
        });

        async function load() {
            const from = document.getElementById('fFrom').value;
            const to = document.getElementById('fTo').value;
            const qs = [];
            if (from) qs.push(`from=${encodeURIComponent(from)}`);
            if (to) qs.push(`to=${encodeURIComponent(to)}`);
            const url = `${API_URL}/cash-forecast${qs.length ? '?' + qs.join('&') : ''}`;
            document.getElementById('report').innerHTML = '<div class="empty-state">Loading…</div>';
            try {
                const res = await leenaFetch(url);
                if (!res.ok) {
                    let msg = 'Failed to load cash forecast';
                    try { const e = await res.json(); if (e && e.error) msg = e.error; } catch (_) {}
                    document.getElementById('report').innerHTML =
                        `<div class="empty-state">${escapeHtml(msg)}</div>`;
                    return;
                }
                const data = await res.json();
                render(data);
            } catch (err) {
                if (err.status === 401 || err.status === 403) return;
                document.getElementById('report').innerHTML =
                    '<div class="empty-state">Error loading cash forecast. <button class="btn btn-primary" onclick="load()">Retry</button></div>';
            }
        }

        function render(data) {
            const root = document.getElementById('report');
            const offices = data.offices || [];
            const contracts = data.contracts || [];
            if (!offices.length && !contracts.length) {
                root.innerHTML = '<div class="empty-state">No active payment schedules to forecast.</div>';
                return;
            }
            const grand = `<div class="grand">
                <span class="lbl">Total Outstanding</span>
                <span class="val">${formatMoney(data.grand_total_remaining_eur)} EUR</span>
                <span class="office-subtotals">
                    <span class="subtotal overdue"><span class="lbl">Overdue</span>${formatMoney(data.grand_overdue_remaining_eur)} EUR</span>
                    <span class="subtotal"><span class="lbl">Upcoming</span>${formatMoney(data.grand_upcoming_remaining_eur)} EUR</span>
                </span>
            </div>`;
            const officeHtml = offices.length
                ? offices.map(renderOffice).join('')
                : '<div class="empty-state">No scheduled amounts in this date range.</div>';
            root.innerHTML = grand + officeHtml + renderContracts(contracts) + renderCounters(data);
        }

        const LINE_HEAD = `<thead>
            <tr>
                <th>Contract</th>
                <th>Status</th>
                <th>Due Date</th>
                <th class="num">Amount</th>
                <th class="num">Amount (EUR)</th>
                <th class="num">Matched (EUR)</th>
                <th class="num">Collected (EUR)</th>
                <th class="num">Outstanding (EUR)</th>
            </tr>
        </thead>`;

        function renderOffice(o) {
            // PLN-11: gecikmiş satırlar ÜSTTE ayrı blokta, kendi alt toplamıyla; gelecek altta.
            const overdue = o.lines.filter(l => l.is_overdue);
            const upcoming = o.lines.filter(l => !l.is_overdue);
            let body = '';
            if (overdue.length) {
                body += `<div class="group-subhead overdue"><span><i class="bi bi-exclamation-triangle-fill"></i> Overdue</span><span class="amt">${formatMoney(o.overdue_remaining_eur)} EUR</span></div>
                    <div class="overdue-group"><table>${LINE_HEAD}<tbody>${overdue.map(renderLine).join('')}</tbody></table></div>`;
            }
            if (upcoming.length) {
                body += `<div class="group-subhead"><span>Upcoming</span><span class="amt">${formatMoney(o.upcoming_remaining_eur)} EUR</span></div>
                    <table>${LINE_HEAD}<tbody>${upcoming.map(renderLine).join('')}</tbody></table>`;
            }
            return `<div class="office">
                <div class="office-head">
                    <span class="office-name"><i class="bi bi-building"></i> ${escapeHtml(o.office_name)}</span>
                    <span class="office-subtotals">
                        <span class="subtotal overdue"><span class="lbl">Overdue</span>${formatMoney(o.overdue_remaining_eur)}</span>
                        <span class="subtotal"><span class="lbl">Upcoming</span>${formatMoney(o.upcoming_remaining_eur)}</span>
                        <span class="office-total"><span class="lbl">Total</span>${formatMoney(o.total_remaining_eur)} EUR</span>
                    </span>
                </div>
                <div class="card">${body}</div>
            </div>`;
        }

        function renderLine(l) {
            const af = l.af_number
                ? `<span class="af"><a href="contract-detail.html?id=${l.contract_id}">${escapeHtml(l.af_number)}</a></span>`
                : `<a class="af" href="contract-detail.html?id=${l.contract_id}">#${l.contract_id}</a>`;
            const remaining = Number(l.remaining_eur);
            const remCell = remaining === 0
                ? `<span class="paid-full">${formatMoney(l.remaining_eur)}</span>`
                : formatMoney(l.remaining_eur);
            const orig = `${formatMoney(l.amount)}${l.currency ? ' ' + escapeHtml(l.currency) : ''}`;
            // C1: eşleşmiş (matched) tahsilat, teleskop fallback (collected) ile GÖRSEL AYRI.
            const matched = Number(l.matched_eur || 0);
            const matchedCell = matched !== 0
                ? `<span class="matched">${formatMoney(l.matched_eur)}</span>`
                : `<span class="muted">—</span>`;
            const excess = Number(l.excess_eur || 0);
            const excessNote = excess > 0 ? ` <span class="cap-note">+${formatMoney(l.excess_eur)} over</span>` : '';
            const covered = Number(l.covered_eur || 0);
            const coveredCell = covered !== 0 ? formatMoney(l.covered_eur) : `<span class="muted">—</span>`;
            return `<tr>
                <td class="af">${af}</td>
                <td><span class="status-badge">${escapeHtml(l.status)}</span></td>
                <td>${formatDate(l.due_date)}</td>
                <td class="num">${orig}</td>
                <td class="num">${formatMoney(l.amount_eur)}</td>
                <td class="num">${matchedCell}${excessNote}</td>
                <td class="num">${coveredCell}</td>
                <td class="num">${remCell}</td>
            </tr>`;
        }

        function renderContracts(contracts) {
            if (!contracts.length) return '';
            const rows = contracts.map(c => {
                const cls = c.matches_revenue ? '' : ' class="mismatch"';
                const flag = c.matches_revenue
                    ? ''
                    : ' <span class="flag" title="Scheduled total does not match contract revenue">&#9888;</span>';
                const excess = Number(c.excess_eur) > 0
                    ? `<span class="paid-full">${formatMoney(c.excess_eur)}</span>` : formatMoney(c.excess_eur);
                const af = c.af_number
                    ? `<a href="contract-detail.html?id=${c.contract_id}">${escapeHtml(c.af_number)}</a>`
                    : `<a href="contract-detail.html?id=${c.contract_id}">#${c.contract_id}</a>`;
                return `<tr${cls}>
                    <td class="af">${af}</td>
                    <td><span class="status-badge">${escapeHtml(c.status)}</span></td>
                    <td class="num">${formatMoney(c.plan_total_eur)}${flag}</td>
                    <td class="num">${formatMoney(c.revenue_eur)}</td>
                    <td class="num">${formatMoney(c.paid_net_eur)}</td>
                    <td class="num">${excess}</td>
                </tr>`;
            }).join('');
            return `<div class="section-title"><i class="bi bi-list-check"></i> Contracts</div>
                <div class="card">
                    <table>
                        <thead>
                            <tr>
                                <th>Contract</th>
                                <th>Status</th>
                                <th class="num">Scheduled (EUR)</th>
                                <th class="num">Revenue (EUR)</th>
                                <th class="num">Collected (EUR)</th>
                                <th class="num">Overpaid (EUR)</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        }

        function renderCounters(data) {
            // RAP-02 + RAP-02: sıfır olsa bile GÖRÜNÜR (sessiz kaybolma yok).
            const parts = [];
            parts.push(`<span>${Number(data.contracts_without_schedule || 0)}</span> contracts without a payment schedule &mdash; ${formatMoney(data.without_schedule_revenue_eur)} EUR of revenue not scheduled`);
            parts.push(`<span>${Number(data.contracts_incomplete_schedule || 0)}</span> contracts have incomplete schedules &mdash; ${formatMoney(data.incomplete_schedule_revenue_eur)} EUR of revenue not scheduled`);
            parts.push(`<span>${Number(data.contracts_on_hold || 0)}</span> contracts on hold &mdash; ${formatMoney(data.on_hold_excluded_eur)} EUR excluded from forecast`);
            parts.push(`<span>${Number(data.contracts_missing_revenue_eur || 0)}</span> contracts have no EUR revenue value`);
            if (Number(data.contracts_unconvertible || 0) > 0) {
                parts.push(`<span>${Number(data.contracts_unconvertible)}</span> contracts excluded (no exchange rate)`);
            }
            // TAH-04 C1/C8: ödeme eşleşme durumu (non-reversal), ayrı satır, sıfırken bile görünür.
            const pay = [];
            pay.push(`<span>${Number(data.payments_matched || 0)}</span> payments matched &mdash; ${formatMoney(data.matched_payments_eur)} EUR`);
            pay.push(`<span>${Number(data.payments_unmatched || 0)}</span> payments unmatched &mdash; ${formatMoney(data.unmatched_payments_eur)} EUR (distributed by earliest-due)`);
            pay.push(`<span>${Number(data.payments_unmatched_after_revision || 0)}</span> payments unmatched after revision &mdash; ${formatMoney(data.unmatched_after_revision_eur)} EUR`);
            return `<div class="counters">${parts.join(' &middot; ')}</div>` +
                   `<div class="counters">${pay.join(' &middot; ')}</div>`;
        }

        function formatDate(d) {
            if (!d) return '<span class="muted">—</span>';
            // 'YYYY-MM-DD' → parça parça (TZ kaymasını önle).
            const [y, m, day] = String(d).split('-').map(Number);
            const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            if (!y || !m || !day) return escapeHtml(String(d));
            return `${MON[m-1]} ${day}, ${y}`;
        }
        function formatMoney(amount) {
            if (amount === null || amount === undefined || amount === '') return '';
            const n = Number(amount);
            if (!isFinite(n)) return '';
            return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
    </script>
</body>
</html>
