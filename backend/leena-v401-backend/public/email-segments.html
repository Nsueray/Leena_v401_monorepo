<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Segments – Leena EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/leena.css">
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <img src="/logo.png" alt="Leena logo" class="sidebar-logo">
            <span>Leena EMS</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="main-panel.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a href="checkins.html"><i class="bi bi-check2-square"></i> Check-ins</a></li>
            <li><a href="terminals.html"><i class="bi bi-pc-display"></i> Terminals</a></li>
            <li><a href="email-templates.html"><i class="bi bi-envelope"></i> Email Templates</a></li>
            <li><a class="active" href="email-segments.html"><i class="bi bi-megaphone"></i> Email Segments</a></li>
            <li><a href="reports.html"><i class="bi bi-graph-up"></i> Reports</a></li>
            <li><a href="import.html"><i class="bi bi-download"></i> Import</a></li>
        </ul>
    </nav>

    <div class="main-wrapper">
        <header class="page-header">
            <div>
                <h1>
                    <i class="bi bi-megaphone"></i>
                    Email Segments
                </h1>
                <div class="subtitle">Send email campaigns to filtered visitors</div>
            </div>
            <div class="header-buttons">
                <a class="btn btn-light" href="main-panel.html">
                    <i class="bi bi-arrow-left"></i> Back to Panel
                </a>
            </div>
        </header>

        <main class="main-container">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="mb-3">📧 Send Segment Email</h4>

                    <div class="mb-3">
                        <label class="form-label">Email Template</label>
                        <select id="templateSelect" class="form-select"></select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Target Segment</label>
                        <select id="segmentSelect" class="form-select">
                            <option value="checked_in">Checked-in visitors</option>
                            <option value="not_checked_in">Not checked-in visitors</option>
                        </select>
                    </div>

                    <button class="btn btn-primary w-100 mb-2" onclick="sendEmails()">
                        Send Emails
                    </button>

                    <div id="result" class="mt-3 small text-muted"></div>
                </div>
            </div>
        </main>
    </div>

<script>
const API = '/api';
const token = localStorage.getItem('token');
const expoId = localStorage.getItem('selectedExpoId');

if (!token || !expoId) {
    alert('Missing auth or expo');
    location.href = 'login.html';
}

async function loadTemplates() {
    const res = await fetch(`${API}/email-templates`, {
        headers: { Authorization: `Bearer ${token}` }
    });
    const templates = await res.json();
    const select = document.getElementById('templateSelect');
    templates.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.name;
        select.appendChild(opt);
    });
}

async function sendEmails() {
    const templateId = document.getElementById('templateSelect').value;
    const segment = document.getElementById('segmentSelect').value;

    document.getElementById('result').textContent = 'Sending…';

    const res = await fetch(`${API}/email-segments/send`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({
            expo_id: expoId,
            segment,
            template_id: templateId
        })
    });

    const data = await res.json();
    document.getElementById('result').textContent =
        `Targeted: ${data.total_targeted}, Sent: ${data.total_sent}, Failed: ${data.total_failed}`;
}

loadTemplates();
</script>

</body>
</html>
