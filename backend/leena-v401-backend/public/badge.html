<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
  <title>Print Badge</title>
  <meta name="viewport" content="width=100mm, height=50mm, initial-scale=1.0">
  <style>
    :root {
      --badge-width: 100mm;
      --badge-height: 50mm;
      --margin-left: 0mm;
      --margin-top: 0mm;
      --qr-size: 30mm;
      --font-size-name: 18pt;
      --font-size-company: 14pt;
      --font-size-job-title: 11pt;
      --font-size-country: 12pt;
      --font-size-role: 10pt;
      --font-size-badge-id: 8pt;
      --font-family: Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: calc(var(--badge-width) + var(--margin-left));
      height: calc(var(--badge-height) + var(--margin-top));
      font-family: var(--font-family);
      overflow: hidden;
    }

    .badge-wrapper {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      width: var(--badge-width);
      height: var(--badge-height);
      padding: 4mm;
      box-sizing: border-box;
      margin-left: var(--margin-left);
      margin-top: var(--margin-top);
    }

    .badge-wrapper.no-qr {
      justify-content: center;
    }

    .qr-section {
      width: calc(var(--qr-size) + 2mm);
      height: calc(var(--qr-size) + 2mm);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 4mm;
      flex-shrink: 0;
    }

    .qr-code {
      width: var(--qr-size);
      height: var(--qr-size);
    }

    .qr-code img {
      width: 100%;
      height: 100%;
    }

    .info-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      min-width: 0;
      max-height: 100%;
    }

    .badge-wrapper.no-qr .info-section {
      text-align: center;
      align-items: center;
    }

    .visitor-name {
      font-size: var(--font-size-name);
      font-weight: bold;
      margin-bottom: 2mm;
      line-height: 1.1;
      word-break: break-word;
      overflow: hidden;
      max-width: 100%;
    }

    .visitor-company {
      font-size: var(--font-size-company);
      line-height: 1.1;
      word-break: break-word;
      overflow: hidden;
      max-width: 100%;
      margin-bottom: 1mm;
    }

    .visitor-job-title {
      font-size: var(--font-size-job-title);
      line-height: 1.2;
      color: #444;
      margin-bottom: 1mm;
    }

    .visitor-country {
      font-size: var(--font-size-country);
      line-height: 1.2;
      color: #555;
      margin-bottom: 1mm;
    }

    .visitor-role {
      font-size: var(--font-size-role);
      font-weight: bold;
      text-transform: uppercase;
      background: #333;
      color: #fff;
      padding: 1mm 3mm;
      border-radius: 2mm;
      display: inline-block;
      margin-top: 2mm;
    }

    .visitor-badge-id {
      font-size: var(--font-size-badge-id);
      color: #999;
      margin-top: 1mm;
    }

    .text-small { font-size: 85%; }
    .text-very-small { font-size: 70%; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--badge-width);
      height: var(--badge-height);
      font-size: 12pt;
      color: #666;
    }

    .error { color: #c00; }

    @media print {
      @page {
        size: var(--badge-width) var(--badge-height) landscape;
        margin: 0;
      }

      html, body {
        width: calc(var(--badge-width) + var(--margin-left));
        height: calc(var(--badge-height) + var(--margin-top));
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <div id="badgeContent">
    <div class="loading">Loading badge...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script>
    const API_URL = '/api';

    function getParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        qr: params.get('qr'),
        terminalKey: params.get('terminal_key') || params.get('tk'),
        templateId: params.get('template_id'),
        preview: params.get('preview')
      };
    }

    function getTextSizeClass(text, t1 = 15, t2 = 25) {
      if (!text) return '';
      if (text.length > t2) return 'text-very-small';
      if (text.length > t1) return 'text-small';
      return '';
    }

    function applyTemplateStyles(template) {
      const root = document.documentElement;
      const size = template.size_config || {};
      const style = template.style_config || {};

      if (size.width_mm) root.style.setProperty('--badge-width', size.width_mm + 'mm');
      if (size.height_mm) root.style.setProperty('--badge-height', size.height_mm + 'mm');
      if (size.margin_left_mm !== undefined) root.style.setProperty('--margin-left', size.margin_left_mm + 'mm');
      if (size.margin_top_mm !== undefined) root.style.setProperty('--margin-top', size.margin_top_mm + 'mm');
      if (size.qr_size_mm) root.style.setProperty('--qr-size', size.qr_size_mm + 'mm');

      if (style.font_size_name) root.style.setProperty('--font-size-name', style.font_size_name);
      if (style.font_size_company) root.style.setProperty('--font-size-company', style.font_size_company);
      if (style.font_size_job_title) root.style.setProperty('--font-size-job-title', style.font_size_job_title);
      if (style.font_size_country) root.style.setProperty('--font-size-country', style.font_size_country);
      if (style.font_size_role) root.style.setProperty('--font-size-role', style.font_size_role);
      if (style.font_size_badge_id) root.style.setProperty('--font-size-badge-id', style.font_size_badge_id);

      const marginLeft = size.margin_left_mm || 0;
      const marginTop = size.margin_top_mm || 0;
      const pageStyle = document.createElement('style');
      pageStyle.textContent = `
        @media print {
          @page {
            size: ${(size.width_mm || 100) + marginLeft}mm ${(size.height_mm || 50) + marginTop}mm ${size.orientation || 'landscape'};
            margin: 0;
          }
        }
      `;
      document.head.appendChild(pageStyle);
    }

    async function getTemplate(terminalKey, templateId) {
      let template = {
        size_config: { width_mm: 100, height_mm: 50, orientation: 'landscape', margin_left_mm: 0, margin_top_mm: 0, qr_size_mm: 30 },
        content_config: { show_qr: true, show_name: true, show_company: true, show_country: false, show_job_title: false, show_role: false, show_badge_id: false },
        style_config: { font_size_name: '18pt', font_size_company: '14pt', font_size_job_title: '11pt', font_size_country: '12pt', font_size_role: '10pt', font_size_badge_id: '8pt' }
      };

      try {
        if (terminalKey) {
          const res = await fetch(`${API_URL}/badge-templates/for-terminal/${terminalKey}`);
          if (res.ok) {
            const data = await res.json();
            if (data.template) template = data.template;
          }
        } else if (templateId) {
          const token = localStorage.getItem('token');
          const res = await fetch(`${API_URL}/badge-templates/${templateId}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            if (data.template) template = data.template;
          }
        }
      } catch (err) {
        console.warn('Could not load template:', err);
      }

      console.log('Template loaded:', template);
      return template;
    }

    async function markBadgePrinted(visitorId, terminalKey) {
      if (!terminalKey) return;
      try {
        await fetch(`${API_URL}/terminal/badge-print`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-terminal-key': terminalKey },
          body: JSON.stringify({ visitor_id: visitorId })
        });
      } catch (err) { console.warn('Badge print record failed:', err); }
    }

    async function loadBadge() {
      const { qr, terminalKey, templateId, preview } = getParams();

      if (!qr) {
        document.getElementById('badgeContent').innerHTML = '<div class="loading error">Invalid QR code</div>';
        return;
      }

      const template = await getTemplate(terminalKey, templateId);
      applyTemplateStyles(template);

      const content = template.content_config || {};
      const size = template.size_config || {};
      console.log('Content config:', content);

      // For preview mode, use sample data
      let visitor = null;
      if (preview === '1' || qr === 'SAMPLE') {
        visitor = {
          id: 0,
          name: 'John',
          last_name: 'Doe',
          company: 'Acme Corporation',
          country: 'Nigeria',
          job_title: 'Marketing Manager',
          visitor_type: 'VIP',
          badge_id: 'ABC12345',
          qr_code: 'SAMPLE'
        };
      } else {
        // Load real visitor data
        try {
          if (terminalKey) {
            const res = await fetch(`${API_URL}/terminal/visitor-by-qr?qr=${encodeURIComponent(qr)}`, {
              headers: { 'x-terminal-key': terminalKey }
            });
            if (res.ok) {
              const data = await res.json();
              visitor = data.visitor;
            }
          }
          
          if (!visitor) {
            const res = await fetch(`${API_URL}/visitors/badge/${qr}`);
            if (res.ok) {
              const data = await res.json();
              visitor = data.visitor;
            }
          }
        } catch (err) {
          console.error('Visitor fetch error:', err);
        }
      }

      if (!visitor) {
        document.getElementById('badgeContent').innerHTML = '<div class="loading error">Visitor not found</div>';
        return;
      }

      console.log('Visitor data:', visitor);

      // Prepare display values
      let displayName = visitor.name || '';
      if (visitor.last_name || visitor.lastName) {
        displayName += ' ' + (visitor.last_name || visitor.lastName);
      }
      displayName = displayName.trim() || 'Guest';

      const displayCompany = visitor.company || '';
      const displayCountry = visitor.country || '';
      const displayJobTitle = visitor.job_title || visitor.jobTitle || visitor.job || '';
      const displayRole = visitor.role || visitor.visitor_type || '';
      const displayBadgeId = visitor.badge_id || visitor.badgeId || '';

      console.log('Display values:', { displayName, displayCompany, displayCountry, displayJobTitle, displayRole, displayBadgeId });

      // Build badge HTML
      const showQR = content.show_qr !== false;
      const wrapperClass = showQR ? 'badge-wrapper' : 'badge-wrapper no-qr';

      let badgeHTML = `<div class="${wrapperClass}">`;

      if (showQR) {
        badgeHTML += `<div class="qr-section"><div class="qr-code" id="qrcode"></div></div>`;
      }

      badgeHTML += `<div class="info-section">`;

      if (content.show_name !== false) {
        const cls = getTextSizeClass(displayName);
        badgeHTML += `<div class="visitor-name ${cls}">${esc(displayName)}</div>`;
      }

      if (content.show_company !== false && displayCompany) {
        const cls = getTextSizeClass(displayCompany);
        badgeHTML += `<div class="visitor-company ${cls}">${esc(displayCompany)}</div>`;
      }

      if (content.show_job_title === true && displayJobTitle) {
        badgeHTML += `<div class="visitor-job-title">${esc(displayJobTitle)}</div>`;
      }

      if (content.show_country === true && displayCountry) {
        badgeHTML += `<div class="visitor-country">${esc(displayCountry)}</div>`;
      }

      if (content.show_role === true && displayRole && displayRole.toLowerCase() !== 'visitor') {
        badgeHTML += `<div class="visitor-role">${esc(displayRole)}</div>`;
      }

      if (content.show_badge_id === true && displayBadgeId) {
        badgeHTML += `<div class="visitor-badge-id">${esc(displayBadgeId)}</div>`;
      }

      badgeHTML += `</div></div>`;

      document.getElementById('badgeContent').innerHTML = badgeHTML;

      // Generate QR code
      if (showQR) {
        const qrSizePx = (size.qr_size_mm || 30) * 3.78; // mm to px approx
        QRCode.toDataURL(qr, { width: Math.round(qrSizePx), margin: 0 }, async function(err, url) {
          if (!err) {
            const img = document.createElement('img');
            img.src = url;
            img.alt = 'QR Code';
            document.getElementById('qrcode').appendChild(img);
          }
          await finalizePrint(visitor, terminalKey, preview);
        });
      } else {
        await finalizePrint(visitor, terminalKey, preview);
      }
    }

    async function finalizePrint(visitor, terminalKey, preview) {
      if (visitor.id && terminalKey && preview !== '1') {
        await markBadgePrinted(visitor.id, terminalKey);
      }

      // Auto-print (skip for preview)
      if (preview !== '1') {
        setTimeout(() => { window.print(); }, 300);
      }
    }

    function esc(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', loadBadge);
  </script>
</body>
</html>
