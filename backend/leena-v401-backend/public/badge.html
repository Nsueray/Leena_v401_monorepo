<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print Badge</title>
  <meta name="viewport" content="width=100mm, height=50mm, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      width: 100mm;
      height: 50mm;
      font-family: Arial, sans-serif;
    }

    .badge-wrapper {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      width: 100mm;
      height: 50mm;
      padding: 5mm;
      box-sizing: border-box;
    }

    .qr-section {
      width: 30mm;
      height: 30mm;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 5mm;
    }

    .qr-code {
      width: 25mm;
      height: 25mm;
    }

    .qr-code img {
      width: 100%;
      height: 100%;
    }

    .info-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .visitor-name {
      font-size: 18pt;
      font-weight: bold;
      margin-bottom: 5px;
      line-height: 1.1;
      word-break: break-word;
    }

    .visitor-company {
      font-size: 14pt;
      line-height: 1.1;
      word-break: break-word;
    }

    .loading {
      text-align: center;
      padding: 20mm;
      font-size: 14pt;
    }

    @media print {
      @page {
        size: 100mm 50mm landscape;
        margin: 0;
      }

      body {
        width: 100mm;
        height: 50mm;
      }
    }
  </style>
</head>
<body>
  <div id="badgeContent">
    <div class="loading">Loading badge...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script>
    const API_URL = '/api';

    function getQRFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('qr');
    }

    function getTextSizeClass(text) {
      if (!text) return '';
      if (text.length > 40) return 'very-small';
      if (text.length > 30) return 'small';
      return '';
    }

    async function performCheckin(visitorId, qrCode, expoId) {
      try {
        const hall = localStorage.getItem('hall') || 'Main';
        const terminal = localStorage.getItem('terminal') || '1';

        await fetch(`${API_URL}/checkins`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token') || ''}`
          },
          body: JSON.stringify({
            visitor_id: visitorId,
            expo_id: expoId,
            hall,
            terminal,
            qr_code: qrCode,
            checkin_type: 'print',
            checkin_time: new Date().toISOString()
          })
        });

        console.log('✅ Check-in recorded.');
      } catch (err) {
        console.warn('⚠️ Check-in failed:', err);
      }
    }

    async function loadBadge() {
      const qrCode = getQRFromURL();
      if (!qrCode) {
        document.getElementById('badgeContent').innerHTML = '<div class="loading">Invalid QR code</div>';
        return;
      }

      let visitor = null;

      try {
        const res = await fetch(`${API_URL}/visitors/badge/${qrCode}`);
        if (res.ok) {
          const data = await res.json();
          visitor = data.visitor;
        }
      } catch (err) {
        console.error('❌ Visitor fetch error:', err);
      }

      if (!visitor) {
        document.getElementById('badgeContent').innerHTML = '<div class="loading">Visitor not found</div>';
        return;
      }

      // Prepare display values
      let displayName = visitor.full_name || `${visitor.name || ''} ${visitor.last_name || ''}`.trim();
      let displayCompany = visitor.company || '';

      // fallback from custom_fields
      if ((!displayName || displayName === '') && visitor.custom_fields) {
        try {
          const fields = typeof visitor.custom_fields === 'string'
            ? JSON.parse(visitor.custom_fields)
            : visitor.custom_fields;

          if (fields.full_name) displayName = fields.full_name;
          else if (fields.name || fields.last_name) displayName = `${fields.name || ''} ${fields.last_name || ''}`.trim();
        } catch (e) {}
      }

      const nameClass = getTextSizeClass(displayName);
      const companyClass = getTextSizeClass(displayCompany);

      document.getElementById('badgeContent').innerHTML = `
        <div class="badge-wrapper">
          <div class="qr-section">
            <div class="qr-code" id="qrcode"></div>
          </div>
          <div class="info-section">
            <div class="visitor-name ${nameClass}">${displayName}</div>
            <div class="visitor-company ${companyClass}">${displayCompany}</div>
          </div>
        </div>
      `;

      // Generate QR
      QRCode.toDataURL(qrCode, {
        width: 120,
        margin: 0
      }, async function (err, url) {
        if (!err) {
          const img = document.createElement('img');
          img.src = url;
          img.alt = 'QR Code';
          document.getElementById('qrcode').appendChild(img);

          // Perform check-in before printing
          if (visitor.id && visitor.expo_id) {
            await performCheckin(visitor.id, qrCode, visitor.expo_id);
          }

          setTimeout(() => {
            window.print();
          }, 500);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', loadBadge);
  </script>
</body>
</html>
