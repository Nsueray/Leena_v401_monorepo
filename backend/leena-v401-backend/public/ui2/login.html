<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Sign in</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<!-- shell.js BİLEREK yüklenmez: requireAuth token yokken /login.html'e yönlendirir. -->
<main class="ui-main auth" id="ui-root"></main>

<script src="components.js"></script>
<script>
(function () {
  'use strict';
  // Giriş sonrası ui2 girişi (index.html) → nav.json'daki giriş alanı = Finance özeti (UI-06 asgarisi).
  var PANEL = 'index.html';
  var C = window.ui2C;
  var token = null;

  // Form şablonu (UI-03) — iki adım: giriş · zorunlu şifre değişimi.
  document.getElementById('ui-root').innerHTML = C.section({ pad: true, body:
    '<div id="step-login">' +
      C.page({ title: 'Sign in', sub: 'User account (ui2). The classic sign-in at /login.html keeps working.' }) +
      C.form({ id: 'loginForm', layout: 'stacked', msg: 'loginMsg', attrs: 'autocomplete="on"', fields: [
        C.field('Email', C.input('id="email" type="email" autocomplete="username" required')),
        C.field('Password', C.input('id="password" type="password" autocomplete="current-password" required'))
      ], actions: [C.button('Sign in', { kind: 'primary', submit: true, block: true })] }) +
    '</div>' +
    '<div id="step-change" hidden>' +
      C.page({ title: 'Set a new password', sub: 'Your account requires a password change before continuing.' }) +
      C.form({ id: 'changeForm', layout: 'stacked', msg: 'changeMsg', attrs: 'autocomplete="off"', fields: [
        C.field('Current password', C.input('id="cur" type="password" autocomplete="current-password" required')),
        C.field('New password', C.input('id="new1" type="password" autocomplete="new-password" minlength="6" required')),
        C.field('Repeat new password', C.input('id="new2" type="password" autocomplete="new-password" minlength="6" required'))
      ], actions: [C.button('Change password', { kind: 'primary', submit: true, block: true }), C.note('At least 6 characters.')] }) +
    '</div>' });

  function post(url, body, auth) {
    var headers = { 'Content-Type': 'application/json' };
    if (auth) headers.Authorization = 'Bearer ' + auth;
    return fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body) })
      .then(function (res) {
        return res.json().catch(function () { return {}; })
          .then(function (j) { return { status: res.status, body: j }; });
      });
  }

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = document.getElementById('loginMsg'); C.say(msg, '', 'error');
    post('/api/user-auth/login', {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    }).then(function (r) {
      if (r.status !== 200 || !r.body.token) { C.say(msg, r.body.error || 'Sign in failed.', 'error'); return; }
      token = r.body.token;
      // Anahtar = mevcut desen (login.html:612, shell.js:58, leena-fetch.js:36).
      localStorage.setItem('token', token);
      // ui2CurrentUser() SENKRON kalır (SEM-05): kimlik yanıttan YENİ bir anahtara yazılır.
      // Eski login'in 'organizer' / 'organizerId' anahtarlarına DOKUNULMAZ. Kayıt yazıldığı
      // token'a bağlıdır (son 16 karakter); klasik login token'ı değiştirirse shell yok sayar.
      try {
        var claims = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        localStorage.setItem('ui2User', JSON.stringify({
          user_id: claims.user_id, email: claims.email, name: claims.name,
          display_role: r.body.display_role, is_owner: r.body.is_owner,
          token_tail: token.slice(-16)
        }));
      } catch (e) { /* fail-soft: shell eski davranışa düşer */ }
      if (r.body.password_must_change) {
        document.getElementById('step-login').hidden = true;
        document.getElementById('step-change').hidden = false;
        document.getElementById('cur').value = document.getElementById('password').value;
        document.getElementById('new1').focus();
      } else {
        storeAccessThen(function () { window.location.href = PANEL; });
      }
    }).catch(function () { C.say(msg, 'Could not reach the server. Please retry.', 'error'); });
  });

  // Paket 2: etkin yetki özeti (/me) ui2User kaydına yazılır → ilk ekranın menüsü doğru açılır
  // (shell.js her sayfada ayrıca tazeler). Hata olursa yine de devam edilir (fail-soft).
  function storeAccessThen(done) {
    fetch('/api/user-auth/me', { headers: { Authorization: 'Bearer ' + token } })
      .then(function (res) { return res.status === 200 ? res.json() : null; })
      .then(function (me) {
        if (!me) return;
        var rec = JSON.parse(localStorage.getItem('ui2User') || 'null');
        if (!rec) return;
        rec.perms = me.permissions || null; rec.role = me.role || null; rec.office = me.office || null;
        localStorage.setItem('ui2User', JSON.stringify(rec));
      })
      .catch(function () { /* fail-soft */ })
      .then(done, done);
  }

  // Davet kabulünden dönüş: /ui2/login.html?email=…&invited=1 → e-posta dolu, bilgi notu.
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.get('email')) document.getElementById('email').value = q.get('email');
    if (q.get('invited') === '1') {
      C.say(document.getElementById('loginMsg'), 'Your password is set — sign in to continue.', 'ok');
      document.getElementById('password').focus();
    }
  })();

  document.getElementById('changeForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = document.getElementById('changeMsg'); C.say(msg, '', 'error');
    var n1 = document.getElementById('new1').value, n2 = document.getElementById('new2').value;
    if (n1 !== n2) { C.say(msg, 'New passwords do not match.', 'error'); return; }
    post('/api/user-auth/change-password', {
      current_password: document.getElementById('cur').value,
      new_password: n1
    }, token).then(function (r) {
      if (r.status !== 200) { C.say(msg, r.body.error || ('Change failed (HTTP ' + r.status + ').'), 'error'); return; }
      storeAccessThen(function () { window.location.href = PANEL; });
    }).catch(function () { C.say(msg, 'Could not reach the server. Please retry.', 'error'); });
  });
})();
</script>
</body>
</html>
