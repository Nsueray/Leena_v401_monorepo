<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>ELIZA — Accept invitation</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<!-- Kimlik doğrulamasız sayfa: shell.js / leena-fetch BİLEREK yüklenmez. Token URL FRAGMENT'ında
     (#token=…) gelir → sunucuya / erişim loguna / Referer'a gitmez (B20); POST gövdesiyle gönderilir. -->
<main class="ui-main auth" id="ui-root"></main>

<script src="components.js"></script>
<script>
(function () {
  'use strict';
  var C = window.ui2C;
  var token = (new URLSearchParams(location.hash.replace(/^#/, ''))).get('token') || '';
  // Token adres çubuğundan silinir (geçmişe / ekran paylaşımına kalmasın); bellekte tutulur.
  try { history.replaceState(null, '', location.pathname); } catch (e) { /* fail-soft */ }

  // Form şablonu (UI-03) — üç adım: kontrol · şifre belirleme · geçersiz davet.
  document.getElementById('ui-root').innerHTML = C.section({ pad: true, body:
    '<div id="step-check">' + C.page({ title: 'Accept invitation', sub: 'Checking your invitation…' }) + '</div>' +
    '<div id="step-set" hidden>' +
      C.page({ title: 'Set your password', subHtml: 'Invitation for <strong id="inv-email"></strong>. The link works once.' }) +
      C.form({ id: 'setForm', layout: 'stacked', msg: 'setMsg', attrs: 'autocomplete="off"', fields: [
        C.field('Your name (optional)', C.input('id="dname" type="text" autocomplete="name"')),
        C.field('New password', C.input('id="new1" type="password" autocomplete="new-password" minlength="6" required')),
        C.field('Repeat new password', C.input('id="new2" type="password" autocomplete="new-password" minlength="6" required'))
      ], actions: [C.button('Set password', { kind: 'primary', submit: true, block: true }), C.note('At least 6 characters.', 'id="minNote"')] }) +
    '</div>' +
    '<div id="step-bad" hidden>' +
      C.page({ title: 'Invitation not valid', subHtml: '<span id="badMsg"></span>' }) +
      C.linkButton('Go to sign in', 'login.html', { kind: 'secondary', block: true }) +
    '</div>' });

  function post(url, body) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (j) { return { status: res.status, body: j }; });
      });
  }
  function show(id) {
    ['step-check', 'step-set', 'step-bad'].forEach(function (s) { document.getElementById(s).hidden = s !== id; });
  }
  function bad(msg) {
    document.getElementById('badMsg').textContent = msg || 'This invitation link is invalid or has expired. Ask for a new invitation.';
    show('step-bad');
  }

  if (!token) { bad(); return; }
  post('/api/user-auth/invite/check', { token: token }).then(function (r) {
    if (r.status !== 200) { bad(r.body && r.body.error); return; }
    document.getElementById('inv-email').textContent = r.body.email;
    if (r.body.display_name) document.getElementById('dname').value = r.body.display_name;
    if (r.body.min_password_length) document.getElementById('minNote').textContent = 'At least ' + r.body.min_password_length + ' characters.';
    show('step-set');
    document.getElementById('new1').focus();
  }).catch(function () { bad('Could not reach the server. Please retry.'); });

  document.getElementById('setForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = document.getElementById('setMsg'); C.say(msg, '', 'error');
    var n1 = document.getElementById('new1').value, n2 = document.getElementById('new2').value;
    if (n1 !== n2) { C.say(msg, 'Passwords do not match.', 'error'); return; }
    post('/api/user-auth/invite/accept', {
      token: token, password: n1, display_name: document.getElementById('dname').value
    }).then(function (r) {
      if (r.status !== 200) { C.say(msg, (r.body && r.body.error) || ('Could not set the password (HTTP ' + r.status + ').'), 'error'); return; }
      window.location.href = 'login.html?invited=1&email=' + encodeURIComponent(r.body.email);
    }).catch(function () { C.say(msg, 'Could not reach the server. Please retry.', 'error'); });
  });
})();
</script>
</body>
</html>
