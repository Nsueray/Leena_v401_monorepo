<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Finance · Account statement</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<div id="ui2-nav"></div>
<div id="ui2-subnav"></div>
<main class="ui-main" id="ui-root"></main>

<script>window.UI2_ACTIVE='finance'; window.UI2_SUBACTIVE='accounts';</script>
<script src="/leena-fetch.js"></script>
<script src="shell.js"></script>
<script src="components.js"></script>
<script src="ledger-ui.js"></script>
<script>
(function () {
  'use strict';
  // L-1 ekstre: tek sıralı akış + yürüyen bakiye (R12). Açılış/kapanış/yürüyen SUNUCUDA türetilir.
  // Hareket tutarı para çifti (hesap birimi + imzalı EUR). Yürüyen bakiye ve dönem giriş/çıkış toplamı hesap
  // biriminde: EUR karşılıkları API'de YOK (LED-11: hesap birimi = hareket birimi) → tek birimli `money`.
  var C = window.ui2C, L = window.ui2L, root = document.getElementById('ui-root');
  var id = L.qs('account'), from = L.qs('from') || '', to = L.qs('to') || '';

  function describe(l) {
    if (l.entry_type === 'income' || l.entry_type === 'refund') {
      return 'Payment · ' + C.dash(l.af_number) + ' · ' + C.dash(l.company_name) + (l.payer ? ' · payer ' + C.esc(l.payer) : '');
    }
    if (l.entry_type === 'payout') return 'Commission payout · ' + C.dash(l.agent_name);
    if (l.entry_type === 'expense') return C.dash(l.expense_category) + ' / ' + C.dash(l.expense_type) +
      (l.supplier_id ? ' · <a href="finance-supplier.html?supplier=' + l.supplier_id + '">' + C.esc(l.supplier_name) + '</a>'
        : l.counterparty ? ' · ' + C.esc(l.counterparty) : '');
    return 'Transfer ' + (l.direction === 'out' ? 'to ' : 'from ') + C.dash(l.counter_account_name);
  }

  function render(s) {
    var a = s.account, cur = a.currency;
    var n = s.not_in_ledger;
    var counter = 'Not in the ledger (recorded before the ledger or without an account — not attributable to any account): ' +
      n.payments_count + ' payments (' + C.eur(n.payments_eur) + ') · ' + n.payouts_count + ' payouts (' + C.eur(n.payouts_eur) + ')' +
      (a.office_id ? ' · of which received by ' + C.esc(a.office_name) + ': ' + n.office_payments_count + ' payments (' + C.eur(n.office_payments_eur) + ')' : '');
    var filter = C.form({ id: 'flt', layout: 'flush', fields: [
      C.field('From', C.input('type="date" name="from" value="' + C.esc(from) + '"')),
      C.field('To', C.input('type="date" name="to" value="' + C.esc(to) + '"'))
    ], actions: [C.button('Apply', { submit: true }), C.linkButton('All accounts', 'finance-accounts.html')] });

    root.innerHTML =
      C.page({ title: a.name, sub: a.account_type + ' · ' + cur + (a.office_name ? ' · ' + a.office_name : '') +
        (a.person_name ? ' · ' + a.person_name : '') + (a.is_active ? '' : ' · inactive'), aside: filter }) +
      C.stats([
        { label: 'Opening', value: C.pair(s.opening, cur, s.opening_eur), href: '#statement' },
        { label: 'In', value: C.money(s.total_in, cur), href: '#statement' },
        { label: 'Out', value: C.money(s.total_out, cur), href: '#statement' },
        { label: 'Closing', value: C.pair(s.closing, cur, s.closing_eur), note: 'EUR at frozen rates', href: '#statement' }
      ]) +
      C.section({ id: 'statement', title: 'Statement', eyebrow: (from || 'start') + ' → ' + (to || 'today'),
        body: C.list({ rows: s.lines, empty: 'No entries in this period.', columns: [
          { label: 'Date', cell: function (l) { return C.esc(l.entry_date); } },
          { label: 'Type', cell: function (l) { return L.chip(l.entry_type); } },
          { label: 'Description', cell: function (l) {
            return describe(l) + (l.reverses_entry_id ? C.tag('reversal') : '') + (l.reversed_by_entry_id ? C.tag('reversed') : '') +
              (l.expo_name ? C.note(C.esc(l.expo_name)) : '') + (l.notes ? C.note(C.esc(l.notes)) : ''); } },
          { label: 'In · EUR', num: true, cell: function (l) { return l.direction === 'in' ? C.pair(l.amount, cur, l.signed_amount_eur) : ''; } },
          { label: 'Out · EUR', num: true, cell: function (l) { return l.direction === 'out' ? C.pair(l.amount, cur, l.signed_amount_eur) : ''; } },
          { label: 'Balance', num: true, neg: function (l) { return Number(l.running_balance) < 0; }, cell: function (l) { return C.esc(l.running_balance); } },
          { label: 'FX', num: true, cell: function (l) { return C.esc(l.exchange_rate); } }
        ] }) + C.text(C.note(counter)) });
  }

  function load() {
    if (!L.guard(root)) return;
    if (!id) {
      root.innerHTML = C.state('empty', 'No account selected — open one from ', { html: '<a href="finance-accounts.html">Accounts</a>.' });
      return;
    }
    L.loading(root);
    var q = '?' + (from ? 'from=' + encodeURIComponent(from) + '&' : '') + (to ? 'to=' + encodeURIComponent(to) : '');
    L.api('GET', '/api/ledger/accounts/' + encodeURIComponent(id) + '/statement' + q).then(function (r) {
      if (r.status !== 200) { L.httpError(root, r, 'statement'); return; }
      render(r.body);
    }).catch(function () { L.offline(root); });
  }

  root.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var p = new URLSearchParams({ account: id });
    if (f.from.value) p.set('from', f.from.value);
    if (f.to.value) p.set('to', f.to.value);
    window.location.search = p.toString();
  });

  L.ready(load);
})();
</script>
</body>
</html>
