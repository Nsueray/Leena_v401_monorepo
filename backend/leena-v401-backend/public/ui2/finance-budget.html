<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Finance · Expo budget</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<div id="ui2-nav"></div>
<div id="ui2-subnav"></div>
<main class="ui-main" id="ui-root"></main>

<script>window.UI2_ACTIVE='finance'; window.UI2_SUBACTIVE='budget';</script>
<script src="/leena-fetch.js"></script>
<script src="shell.js"></script>
<script src="components.js"></script>
<script src="ledger-ui.js"></script>
<script>
(function () {
  'use strict';
  // L-5 (LED-09): bütçe vs gerçekleşen. Gerçekleşen ledger'daki gider hareketlerinden SUNUCUDA türetilir.
  // Her değişiklik yeni revizyon; kilidi Owner atar, kilitliyken yeni revizyonu yalnız Owner yazar.
  // Bütçe tamamen EUR'dur (girişte EUR) — para çifti gerekmez.
  var C = window.ui2C, L = window.ui2L, root = document.getElementById('ui-root');
  var expoId = L.qs('expo');
  var state = { expos: [], ref: null, b: null, draft: [] };

  function catName(id) { var c = (state.ref.expense_categories || []).find(function (x) { return x.id === Number(id); }); return c ? c.name : '?'; }
  function typesOf(catId) { var c = (state.ref.expense_categories || []).find(function (x) { return x.id === Number(catId); }); return c ? c.types : []; }
  function typeName(l) { return (typesOf(l.category_id).find(function (t) { return t.id === Number(l.expense_type_id); }) || {}).name; }

  function picker() {
    return C.form({ id: 'pick', layout: 'flush', fields: [
      C.field('Expo', C.select('name="expo"',
        C.options(state.expos, function (e) { return e.id; }, function (e) { return e.name; }, expoId || '', '— choose —')))
    ], actions: [C.button('Open', { submit: true })] });
  }

  function vsTable(v) {
    var rows = v.by_category.map(function (r) { return { cat: r }; })
      .concat(v.by_type.map(function (r) { return { type: r }; }));
    var over = function (x) { var r = x.cat || x.type; return r.variance_eur != null && Number(r.variance_eur) < 0; };
    if (!v.by_category.length) return C.state('empty', 'No budget lines and no expenses for this expo yet.');
    return C.list({ rows: rows, columns: [
      { label: 'Category', cell: function (x) {
        return x.cat ? C.esc(x.cat.category) + (x.cat.budget_eur == null ? C.tag('unbudgeted') : '')
          : C.muted('↳ ' + C.esc(x.type.category) + ' / ' + C.esc(x.type.expense_type)); } },
      { label: 'Budget', num: true, cell: function (x) { return C.eur((x.cat || x.type).budget_eur); } },
      { label: 'Actual', num: true, cell: function (x) { return C.eur((x.cat || x.type).actual_eur); } },
      { label: 'Variance', num: true, neg: over, cell: function (x) { return C.eur((x.cat || x.type).variance_eur); } }
    ] }) +
    C.text(C.note('Actual = expense entries in the ledger for this expo (reversals net out). Unbudgeted actual: ' +
      C.eur(v.unbudgeted_actual_eur) + '.'));
  }

  function draftEditor() {
    var cats = (state.ref.expense_categories || []).filter(function (c) { return c.is_active; });
    return C.list({ rows: state.draft, empty: 'No lines — add below.', columns: [
        { label: 'Category', cell: function (l) { return C.esc(catName(l.category_id)); } },
        { label: 'Type', cell: function (l) { return l.expense_type_id ? C.esc(typeName(l)) : C.muted('whole category'); } },
        { label: 'EUR', num: true, cell: function (l) { return C.eur(l.amount_eur); } },
        { label: '', cell: function (l, i) { return C.button('Remove', { kind: 'ghost', attrs: { 'data-del': i } }); } }
      ] }) +
      C.form({ id: 'line-form', fields: [
        C.field('Category', C.select('name="category_id" required',
          C.options(cats, function (c) { return c.id; }, function (c) { return c.name; }, '', '—'))),
        C.field('Type (optional)', C.select('name="expense_type_id"', C.options([], null, null, '', 'whole category'))),
        C.field('Amount EUR', C.input('name="amount_eur" required'))
      ], actions: [C.button('Add line', { submit: true })] }) +
      C.form({ id: 'rev-form', msg: 'rev-msg', fields: [
        C.field('Income target EUR', C.input('name="income_target_eur" value="' +
          C.esc(state.b.active && state.b.active.income_target_eur || '') + '"')),
        C.field('Notes', C.input('name="notes"'))
      ], actions: [C.button('Save as new revision', { kind: 'primary', submit: true })] });
  }

  function history(v) {
    return C.list({ rows: v.history, empty: 'No revisions yet.', columns: [
      { label: 'Revision', cell: function (h) { return 'rev ' + h.revision + (h.superseded_at ? '' : ' ' + C.tag('active')); } },
      { label: 'Income target', cell: function (h) { return C.eur(h.income_target_eur); } },
      { label: 'Created', cell: function (h) { return C.dash(h.created_by_name) + ' · ' + C.esc(String(h.created_at).slice(0, 10)); } },
      { label: 'Lock', cell: function (h) {
        return h.locked_at ? 'locked ' + C.esc(String(h.locked_at).slice(0, 10)) + ' by ' + C.dash(h.locked_by_name) : '—'; } }
    ] });
  }

  function render() {
    var v = state.b, a = v.active, inc = v.income;
    var lockTxt = a ? (a.locked_at ? 'locked by ' + (a.locked_by_name || '?') + ' · ' + String(a.locked_at).slice(0, 10) : 'unlocked') : 'no budget yet';
    var lockBtn = a && !a.locked_at && v.viewer_is_owner ? C.button('Lock budget (Owner)', { attrs: 'id="lock-btn"' }) : '';
    root.innerHTML =
      C.page({ title: 'Budget · ' + v.expo.name, sub: (a ? 'revision ' + a.revision + ' · ' : '') + lockTxt, aside: picker() }) +
      C.stats([
        { label: 'Income target', value: C.eur(a && a.income_target_eur), href: '#revision' },
        { label: 'Income collected', value: C.eur(inc.income_eur),
          note: C.eur(inc.income_in_ledger_eur) + ' in ledger · ' + inc.payments_not_in_ledger + ' payments outside', href: '#vs-actual' }
      ]) +
      C.stack([
        C.section({ id: 'vs-actual', title: 'Budget vs actual (EUR)', action: lockBtn, body: vsTable(v) }),
        C.section({ id: 'revision', title: 'New revision',
          eyebrow: a && a.locked_at ? (v.viewer_is_owner ? 'locked — as Owner your new revision unlocks it' : 'locked — only the Owner can change it') : 'every change is a new revision',
          body: draftEditor() }),
        C.section({ title: 'History', body: history(v) })
      ]);
  }

  function load() {
    if (!L.guard(root)) return;
    L.loading(root);
    Promise.all([L.api('GET', '/api/expos'), L.api('GET', '/api/ledger/reference')]).then(function (r) {
      state.expos = Array.isArray(r[0].body) ? r[0].body : [];
      if (r[1].status !== 200) { L.httpError(root, r[1], 'reference data'); return; }
      state.ref = r[1].body;
      if (!expoId) {
        root.innerHTML = C.page({ title: 'Expo budget', sub: 'choose an expo', aside: picker() }) +
          C.section({ body: C.state('empty', 'Choose an expo above to see its budget.') });
        return;
      }
      return L.api('GET', '/api/ledger/budgets/' + encodeURIComponent(expoId)).then(function (b) {
        if (b.status !== 200) { L.httpError(root, b, 'budget'); return; }
        state.b = b.body;
        state.draft = (b.body.lines || []).map(function (l) { return { category_id: l.category_id, expense_type_id: l.expense_type_id, amount_eur: l.amount_eur }; });
        render();
      });
    }).catch(function () { L.offline(root); });
  }

  root.addEventListener('change', function (e) {
    var f = e.target.closest('#line-form');
    if (f && e.target.name === 'category_id') {
      f.expense_type_id.innerHTML = C.options(typesOf(e.target.value).filter(function (t) { return t.is_active; }),
        function (t) { return t.id; }, function (t) { return t.name; }, '', 'whole category');
    }
  });
  root.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, b = L.formJson(f);
    if (f.id === 'pick') { if (b.expo) window.location.search = '?expo=' + encodeURIComponent(b.expo); return; }
    if (f.id === 'line-form') { state.draft.push({ category_id: b.category_id, expense_type_id: b.expense_type_id || null, amount_eur: b.amount_eur }); render(); return; }
    if (f.id === 'rev-form') {
      L.api('POST', '/api/ledger/budgets/' + encodeURIComponent(expoId), { income_target_eur: b.income_target_eur, notes: b.notes, lines: state.draft })
        .then(function (r) { if (r.status === 201) load(); else C.say(document.getElementById('rev-msg'), r.body && r.body.error, 'error'); });
    }
  });
  root.addEventListener('click', function (e) {
    var d = e.target.closest('button[data-del]');
    if (d) { state.draft.splice(Number(d.getAttribute('data-del')), 1); render(); return; }
    if (e.target.id === 'lock-btn') {
      if (!confirm('Lock this budget revision? After locking, only the Owner can create a new revision.')) return;
      L.api('POST', '/api/ledger/budgets/' + encodeURIComponent(expoId) + '/lock').then(function (r) {
        if (r.status === 200) load(); else alert(r.body && r.body.error);
      });
    }
  });

  L.ready(load);
})();
</script>
</body>
</html>
