<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Finance · Accounts</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<div id="ui2-nav"></div>
<div id="ui2-subnav"></div>
<main class="ui-main" id="ui-root"></main>

<script>window.UI2_ACTIVE='finance'; window.UI2_SUBACTIVE='accounts';</script>
<script src="/leena-fetch.js"></script>
<script src="shell.js"></script>
<script src="components.js"></script>
<script src="ledger-ui.js"></script>
<script>
(function () {
  'use strict';
  // L-1: hesap listesi (bakiye SUNUCUDA türetilir — D2) + hesap aç + referans veri.
  var C = window.ui2C, L = window.ui2L, root = document.getElementById('ui-root');
  var state = { accounts: [], currencies: [], offices: [], ref: null };
  function code(c) { return c.code; }
  function self(x) { return x; }

  function accountsTable() {
    return C.list({
      rows: state.accounts, empty: 'No accounts yet — open the first one below.',
      href: function (a) { return 'finance-account.html?account=' + a.id; },
      columns: [
        { label: 'Account', cell: function (a) {
          return '<a href="finance-account.html?account=' + a.id + '">' + C.esc(a.name) + '</a>' +
            (a.is_office_default ? C.tag('office default') : '') + (a.is_active ? '' : C.tag('inactive')); } },
        { label: 'Type', cell: function (a) { return L.chip(a.account_type); } },
        { label: 'Cur.', cell: function (a) { return C.esc(a.currency); } },
        { label: 'Office / person', cell: function (a) {
          return a.person_id ? C.esc((a.person_name || 'person') + (a.person_is_owner ? ' (owner)' : '')) : C.dash(a.office_name); } },
        { label: 'Balance · EUR (frozen rates)', num: true, neg: function (a) { return Number(a.balance) < 0; },
          cell: function (a) { return C.pair(a.balance, a.currency, a.balance_eur); } },
        { label: 'Entries', num: true, cell: function (a) { return C.esc(a.entry_count); } },
        { label: '', cell: function (a) {
          return C.button(a.is_active ? 'Deactivate' : 'Activate', { kind: 'ghost',
            attrs: { 'data-act': 'toggle', 'data-id': a.id, 'data-active': String(a.is_active) } }); } }
      ] });
  }

  function newAccountForm() {
    var me = window.ui2CurrentUser();
    var ownerOpt = me && me.session === 'user'
      ? C.field('Owner current account', C.check('name="owner_account"', 'belongs to me (virtual)')) : '';
    return C.form({ id: 'acc-form', msg: 'acc-msg', fields: [
      C.field('Name', C.input('name="name" required')),
      C.field('Type', C.select('name="account_type"', C.options(['bank', 'cash', 'virtual'], self, self))),
      C.field('Currency', C.select('name="currency"', C.options(state.currencies, code, code))),
      C.field('Office', C.select('name="office_id"',
        C.options(state.offices, function (o) { return o.id; }, function (o) { return o.name; }, '', '— none —'))),
      C.field('Office default', C.check('name="is_office_default"', 'for this currency')),
      ownerOpt,
      C.field('Notes', C.input('name="notes"'))
    ], actions: [C.button('Open account', { kind: 'primary', submit: true })] });
  }

  function referenceCard() {
    var ref = state.ref || { expense_categories: [], income_categories: [] };
    var inc = ref.income_categories.map(function (c) { return C.esc(c.name); }).join(' · ');
    return C.list({ rows: ref.expense_categories, empty: 'No expense categories.', columns: [
        { label: 'Expense category', cell: function (c) { return C.esc(c.name); } },
        { label: 'Types', cell: function (c) {
          var types = c.types.map(function (t) { return C.esc(t.name) + (t.is_active ? '' : ' (inactive)'); }).join(' · ');
          return types || C.muted('no types yet'); } }
      ] }) +
      C.form({ id: 'type-form', msg: 'type-msg', fields: [
        C.field('Category', C.select('name="category_id"',
          C.options(ref.expense_categories, function (c) { return c.id; }, function (c) { return c.name; }))),
        C.field('New expense type', C.input('name="name" required'))
      ], actions: [C.button('Add type', { submit: true })] }) +
      C.text(C.note('Income categories: ' + (inc || '—'))) +
      C.form({ id: 'cur-form', msg: 'cur-msg', fields: [
        C.field('Currencies', C.mono(state.currencies.map(code).join(' · '))),
        C.field('Add currency (ISO)', C.input('name="code" maxlength="3" required'))
      ], actions: [C.button('Add', { submit: true })] });
  }

  function render() {
    root.innerHTML =
      C.page({ title: 'Accounts', sub: state.accounts.length + ' accounts · balances derived from ledger entries' }) +
      C.stack([
        C.section({ title: 'Accounts', eyebrow: 'Click a name for its statement', body: accountsTable() }),
        C.section({ title: 'Open account', eyebrow: 'Accounts are never deleted — deactivate instead', body: newAccountForm() }),
        C.section({ title: 'Reference data', eyebrow: 'Seeded from documented Zoho values; add the rest here', body: referenceCard() })
      ]);
  }

  function load() {
    if (!L.guard(root)) return;
    L.loading(root);
    Promise.all([
      L.api('GET', '/api/ledger/accounts?include_inactive=1'),
      L.api('GET', '/api/ledger/currencies'),
      L.api('GET', '/api/offices'),
      L.api('GET', '/api/ledger/reference'),
    ]).then(function (r) {
      if (r[0].status !== 200) { L.httpError(root, r[0], 'accounts'); return; }
      state.accounts = r[0].body; state.currencies = r[1].body || []; state.offices = r[2].body || []; state.ref = r[3].body;
      render();
    }).catch(function () { L.offline(root); });
  }

  root.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, b = L.formJson(f);
    if (f.id === 'acc-form') {
      if (b.owner_account) { b.person_id = window.ui2CurrentUser().id; b.account_type = 'virtual'; }
      delete b.owner_account;
      L.api('POST', '/api/ledger/accounts', b).then(function (r) {
        if (r.status === 201) load(); else C.say(document.getElementById('acc-msg'), r.body && r.body.error, 'error');
      });
    } else if (f.id === 'type-form') {
      L.api('POST', '/api/ledger/expense-types', b).then(function (r) {
        if (r.status === 201) load(); else C.say(document.getElementById('type-msg'), r.body && r.body.error, 'error');
      });
    } else if (f.id === 'cur-form') {
      L.api('POST', '/api/ledger/currencies', b).then(function (r) {
        if (r.status === 201) load(); else C.say(document.getElementById('cur-msg'), r.body && r.body.error, 'error');
      });
    }
  });
  // Satır tıklaması → ekstre: components.js (data-href). Burada yalnız aktif/pasif düğmesi.
  root.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act="toggle"]');
    if (!btn) return;
    L.api('PUT', '/api/ledger/accounts/' + btn.getAttribute('data-id'), { is_active: btn.getAttribute('data-active') !== 'true' })
      .then(function (r) { if (r.status === 200) load(); else alert(r.body && r.body.error); });
  });

  L.ready(load);
})();
</script>
</body>
</html>
