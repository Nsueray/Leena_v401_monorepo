<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Finance · Transfers</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<div id="ui2-nav"></div>
<div id="ui2-subnav"></div>
<main class="ui-main" id="ui-root"></main>

<script>window.UI2_ACTIVE='finance'; window.UI2_SUBACTIVE='transfers';</script>
<script src="/leena-fetch.js"></script>
<script src="shell.js"></script>
<script src="components.js"></script>
<script src="ledger-ui.js"></script>
<script>
(function () {
  'use strict';
  // L-2 (LED-06): transfer = tek olay + iki bağlı hareket. Düzeltme = ters transfer (silme yok).
  var C = window.ui2C, L = window.ui2L, root = document.getElementById('ui-root');
  var state = { accounts: [], transfers: [], expos: [] };

  function accById(id) { return state.accounts.find(function (a) { return String(a.id) === String(id); }); }
  function accLabel(a) { return a.name + ' (' + a.currency + ')'; }
  function accId(a) { return a.id; }

  function form() {
    return C.form({ id: 'tr-form', msg: 'tr-msg', fields: [
      C.field('From', C.select('name="from_account_id" required', C.options(state.accounts, accId, accLabel, '', '—'))),
      C.field('To', C.select('name="to_account_id" required', C.options(state.accounts, accId, accLabel, '', '—'))),
      C.field('Date', C.input('type="date" name="transfer_date" value="' + L.today() + '" required')),
      C.field('Amount out', C.input('name="amount" required')),
      C.field('FX → EUR (out)', C.input('name="exchange_rate" value="1" required')),
      // Para birimleri farklıysa açılır (sync) — data-xc
      C.field('Amount in', C.input('name="amount_in"'), { hidden: true, attrs: 'data-xc' }),
      C.field('FX → EUR (in)', C.input('name="exchange_rate_in"'), { hidden: true, attrs: 'data-xc' }),
      C.field('Expo (optional)', C.select('name="expo_id"',
        C.options(state.expos, function (e) { return e.id; }, function (e) { return e.name; }, '', '—'))),
      C.field('Notes', C.input('name="notes"'))
    ], actions: [C.button('Record transfer', { kind: 'primary', submit: true })] }) +
    C.text(C.note('Same currency: one amount, both legs equal — record bank fees as an expense. Different currencies: both amounts and both rates are frozen as entered.'));
  }

  function list() {
    return C.list({ rows: state.transfers, empty: 'No transfers yet.', columns: [
      { label: '#', cell: function (t) { return '#' + t.id; } },
      { label: 'Date', cell: function (t) { return C.esc(t.transfer_date); } },
      { label: 'From', cell: function (t) { return C.esc(t.from_account); } },
      { label: 'Out · EUR', num: true, cell: function (t) { return C.pair(t.amount_out, t.currency_out, t.eur_out); } },
      { label: 'To', cell: function (t) { return C.esc(t.to_account); } },
      { label: 'In · EUR', num: true, cell: function (t) { return C.pair(t.amount_in, t.currency_in, t.eur_in); } },
      { label: 'Notes', cell: function (t) { return C.dash(t.notes) + (t.expo_name ? C.note(C.esc(t.expo_name)) : ''); } },
      { label: '', cell: function (t) {
        return t.reverses_transfer_id ? C.tag('reversal of #' + t.reverses_transfer_id)
          : t.reversed_by_transfer_id ? C.tag('reversed')
          : C.button('Reverse', { kind: 'ghost', attrs: { 'data-rev': t.id } }); } }
    ] });
  }

  function render() {
    root.innerHTML = C.page({ title: 'Transfers', sub: 'between accounts · one event, two linked entries' }) +
      C.stack([
        C.section({ title: 'New transfer', body: form() }),
        C.section({ title: 'Recent transfers', eyebrow: 'corrections are reversals', body: list() })
      ]);
  }

  // Para birimleri farklıysa ikinci tutar/kur alanları açılır; EUR hesabın kuru 1'e kilitlenir.
  function sync() {
    var f = document.getElementById('tr-form');
    if (!f) return;
    var a = accById(f.from_account_id.value), b = accById(f.to_account_id.value);
    var cross = a && b && a.currency !== b.currency;
    Array.prototype.forEach.call(f.querySelectorAll('[data-xc]'), function (el) { el.hidden = !cross; });
    if (a && a.currency === 'EUR') f.exchange_rate.value = '1';
    f.exchange_rate.readOnly = !!(a && a.currency === 'EUR');
    if (cross && b.currency === 'EUR') f.exchange_rate_in.value = '1';
    if (!cross) { f.amount_in.value = ''; f.exchange_rate_in.value = ''; }
  }

  function load() {
    if (!L.guard(root)) return;
    L.loading(root);
    Promise.all([L.api('GET', '/api/ledger/accounts'), L.api('GET', '/api/ledger/transfers'), L.api('GET', '/api/expos')])
      .then(function (r) {
        if (r[0].status !== 200) { L.httpError(root, r[0], 'accounts'); return; }
        state.accounts = r[0].body; state.transfers = r[1].body || []; state.expos = Array.isArray(r[2].body) ? r[2].body : [];
        render(); sync();
      }).catch(function () { L.offline(root); });
  }

  root.addEventListener('change', function (e) { if (e.target.closest('#tr-form')) sync(); });
  root.addEventListener('submit', function (e) {
    e.preventDefault();
    L.api('POST', '/api/ledger/transfers', L.formJson(e.target)).then(function (r) {
      if (r.status === 201) load(); else C.say(document.getElementById('tr-msg'), r.body && r.body.error, 'error');
    });
  });
  root.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-rev]');
    if (!b) return;
    if (!confirm('Reverse transfer #' + b.getAttribute('data-rev') + '? Both legs are mirrored with today\'s date.')) return;
    L.api('POST', '/api/ledger/transfers/' + b.getAttribute('data-rev') + '/reverse').then(function (r) {
      if (r.status === 201) load(); else alert(r.body && r.body.error);
    });
  });

  L.ready(load);
})();
</script>
</body>
</html>
