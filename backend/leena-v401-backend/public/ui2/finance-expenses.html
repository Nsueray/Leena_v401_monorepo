<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Finance · Expenses</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/signal.css">
<link rel="stylesheet" href="styles/themes.css">
<link rel="stylesheet" href="styles/ledger.css">
</head>
<body>
<div id="ui2-nav"></div>
<div id="ui2-subnav"></div>
<main class="lg-main" id="lg-root"><div class="lg-empty">Loading…</div></main>

<script>window.UI2_ACTIVE='finance'; window.UI2_SUBACTIVE='expenses';</script>
<script src="/leena-fetch.js"></script>
<script src="shell.js"></script>
<script src="ledger-ui.js"></script>
<script>
(function () {
  'use strict';
  // L-3 (LED-08): onay YOK; gider değiştirilemez olaydır, düzeltme ters giderdir.
  var L = window.ui2L, root = document.getElementById('lg-root');
  var METHODS = ['bank_transfer', 'cash', 'cheque', 'credit_card', 'other'];   // SEM-01 (tek sözlük)
  var state = { accounts: [], ref: null, expos: [], list: [], filter: { expo_id: L.qs('expo_id') || '', from: L.qs('from') || '', to: L.qs('to') || '' } };

  function accById(id) { return state.accounts.find(function (a) { return String(a.id) === String(id); }); }
  function types() {
    var out = [];
    (state.ref ? state.ref.expense_categories : []).forEach(function (c) {
      if (!c.is_active) return;
      c.types.forEach(function (t) { if (t.is_active) out.push({ id: t.id, label: c.name + ' / ' + t.name }); });
    });
    return out;
  }

  function form() {
    return '<form class="lg-form" id="ex-form">' +
      '<label class="field"><span class="label">Category / type</span><select class="input" name="expense_type_id" required>' +
        L.options(types(), function (t) { return t.id; }, function (t) { return t.label; }, '', '—') + '</select></label>' +
      '<label class="field"><span class="label">Paid from account</span><select class="input" name="account_id" required>' +
        L.options(state.accounts, function (a) { return a.id; }, function (a) { return a.name + ' (' + a.currency + ')'; }, '', '—') + '</select></label>' +
      '<label class="field"><span class="label">Amount</span><input class="input" name="amount" required></label>' +
      '<label class="field"><span class="label">FX → EUR</span><input class="input" name="exchange_rate" value="1" required></label>' +
      '<label class="field"><span class="label">Date</span><input class="input" type="date" name="expense_date" value="' + L.today() + '" required></label>' +
      '<label class="field"><span class="label">Method</span><select class="input" name="payment_method">' +
        L.options(METHODS, function (m) { return m; }, function (m) { return m; }, 'bank_transfer') + '</select></label>' +
      '<label class="field"><span class="label">Expo (empty = overhead)</span><select class="input" name="expo_id">' +
        L.options(state.expos, function (e) { return e.id; }, function (e) { return e.name; }, '', '—') + '</select></label>' +
      '<label class="field"><span class="label">Counterparty</span><input class="input" name="counterparty"></label>' +
      '<label class="field"><span class="label">Document link (Drive)</span><input class="input" name="document_url" placeholder="https://"></label>' +
      '<label class="field"><span class="label">Notes</span><input class="input" name="notes"></label>' +
      '<button class="btn btn-primary" type="submit">Record expense</button>' +
    '</form><div class="lg-msg" id="ex-msg"></div>';
  }

  function list() {
    var f = state.filter;
    var flt = '<form class="lg-form" id="flt">' +
      '<label class="field"><span class="label">Expo</span><select class="input" name="expo_id">' +
        L.options(state.expos, function (e) { return e.id; }, function (e) { return e.name; }, f.expo_id, 'all') + '</select></label>' +
      '<label class="field"><span class="label">From</span><input class="input" type="date" name="from" value="' + L.esc(f.from) + '"></label>' +
      '<label class="field"><span class="label">To</span><input class="input" type="date" name="to" value="' + L.esc(f.to) + '"></label>' +
      '<button class="btn btn-secondary" type="submit">Filter</button></form>';
    if (!state.list.length) return flt + '<div class="lg-empty">No expenses for this filter.</div>';
    var rows = state.list.map(function (x) {
      var act = x.reverses_expense_id ? '<span class="lg-tag">reversal of #' + x.reverses_expense_id + '</span>'
        : x.reversed_by_expense_id ? '<span class="lg-tag">reversed</span>'
        : '<button class="btn btn-ghost" data-rev="' + x.id + '">Reverse</button>';
      return '<tr><td>#' + x.id + '</td><td>' + L.esc(x.expense_date) + '</td>' +
        '<td>' + L.esc(x.category) + ' / ' + L.esc(x.expense_type) + '</td>' +
        '<td class="num' + (Number(x.amount) < 0 ? ' lg-neg' : '') + '">' + L.money(x.amount, x.currency) + '</td>' +
        '<td class="num">' + L.eur(x.amount_eur) + '</td>' +
        '<td>' + L.esc(x.account_name) + '</td><td>' + L.dash(x.expo_name) + '</td>' +
        '<td>' + L.dash(x.counterparty) + (x.document_url ? ' · <a href="' + L.esc(x.document_url) + '" target="_blank" rel="noopener">doc</a>' : '') + '</td>' +
        '<td>' + act + '</td></tr>';
    }).join('');
    return flt + '<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Date</th><th>Category / type</th>' +
      '<th class="num">Amount</th><th class="num">EUR</th><th>Account</th><th>Expo</th><th>Counterparty</th><th></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function render() {
    root.innerHTML = '<div class="lg-head"><div><h1>Expenses</h1><div class="sub">no approval step · corrections are reversals · ' +
      state.list.length + ' shown</div></div></div><div class="lg-stack">' +
      '<div class="card" style="overflow:hidden"><div class="card-head"><span class="card-title">New expense</span>' +
        '<span class="card-eyebrow">currency = the account\'s currency</span></div>' + form() + '</div>' +
      '<div class="card" style="overflow:hidden"><div class="card-head"><span class="card-title">Expenses</span></div>' + list() + '</div></div>';
  }

  function sync() {
    var f = document.getElementById('ex-form');
    if (!f) return;
    var a = accById(f.account_id.value);
    var eur = a && a.currency === 'EUR';
    if (eur) f.exchange_rate.value = '1';
    f.exchange_rate.readOnly = !!eur;
  }

  function load() {
    if (!L.guard(root)) return;
    var f = state.filter, q = [];
    if (f.expo_id) q.push('expo_id=' + encodeURIComponent(f.expo_id));
    if (f.from) q.push('from=' + encodeURIComponent(f.from));
    if (f.to) q.push('to=' + encodeURIComponent(f.to));
    Promise.all([L.api('GET', '/api/ledger/accounts'), L.api('GET', '/api/ledger/reference'), L.api('GET', '/api/expos'),
                 L.api('GET', '/api/ledger/expenses' + (q.length ? '?' + q.join('&') : ''))])
      .then(function (r) {
        if (r[0].status !== 200) { L.httpError(root, r[0], 'accounts'); return; }
        state.accounts = r[0].body; state.ref = r[1].body; state.expos = Array.isArray(r[2].body) ? r[2].body : []; state.list = r[3].body || [];
        render(); sync();
      }).catch(function () { root.innerHTML = '<div class="lg-empty">Could not reach the server. Please retry.</div>'; });
  }

  root.addEventListener('change', function (e) { if (e.target.closest('#ex-form')) sync(); });
  root.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, b = L.formJson(f);
    if (f.id === 'flt') { state.filter = { expo_id: b.expo_id || '', from: b.from || '', to: b.to || '' }; load(); return; }
    L.api('POST', '/api/ledger/expenses', b).then(function (r) {
      if (r.status === 201) load(); else L.say(document.getElementById('ex-msg'), r.body && r.body.error, 'error');
    });
  });
  root.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-rev]');
    if (!b) return;
    if (!confirm('Reverse expense #' + b.getAttribute('data-rev') + '? A negative expense is recorded today.')) return;
    L.api('POST', '/api/ledger/expenses/' + b.getAttribute('data-rev') + '/reverse').then(function (r) {
      if (r.status === 201) load(); else alert(r.body && r.body.error);
    });
  });

  L.ready(load);
})();
</script>
</body>
</html>
