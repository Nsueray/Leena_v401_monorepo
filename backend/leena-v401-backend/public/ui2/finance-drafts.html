<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Finance · Expense drafts</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<div id="ui2-nav"></div>
<div id="ui2-subnav"></div>
<main class="ui-main" id="ui-root"></main>

<script>window.UI2_ACTIVE='finance'; window.UI2_SUBACTIVE='drafts';</script>
<script src="/leena-fetch.js"></script>
<script src="shell.js"></script>
<script src="components.js"></script>
<script src="ledger-ui.js"></script>
<script>
(function () {
  'use strict';
  // P1b-3 (LED-19, YZ-01): yapay zeka / içe aktarım / elle TASLAK yazar; gider yalnız burada,
  // insan "Accept" deyince doğar (mevcut gider yolu, aynı doğrulama). Taslak ledger'a yazmaz.
  // Eksik alanlar kırmızı (C.missing / missing:). Tedarikçi önerisi ÖNERİDİR — kabulde insan seçer (OFS-05).
  // Taslak tutarının EUR karşılığı YOK (henüz kayıt değil, sunucu çevirmez) → tek birimli `money`.
  var C = window.ui2C, L = window.ui2L, root = document.getElementById('ui-root');
  var METHODS = ['bank_transfer', 'cash', 'cheque', 'credit_card', 'other'];   // SEM-01 (tek sözlük)
  var state = { list: [], accounts: [], ref: null, expos: [], suppliers: [], open: null,
                status: L.qs('status') || 'pending', completeness: L.qs('completeness') || '' };

  function self(x) { return x; }
  function types() {
    var out = [];
    (state.ref ? state.ref.expense_categories : []).forEach(function (c) {
      if (!c.is_active) return;
      c.types.forEach(function (t) { if (t.is_active) out.push({ id: t.id, label: c.name + ' / ' + t.name }); });
    });
    return out;
  }
  function typeOpts(sel) { return C.options(types(), function (t) { return t.id; }, function (t) { return t.label; }, sel, '—'); }
  function accOpts(sel) { return C.options(state.accounts, function (a) { return a.id; }, function (a) { return a.name + ' (' + a.currency + ')'; }, sel, '—'); }
  function miss(d, k) { return (d.missing_fields || []).indexOf(k) >= 0; }
  function cell(d, k, html) { return miss(d, k) ? C.missing() : html; }

  function filters() {
    return C.form({ id: 'flt', fields: [
      C.field('Status', C.select('name="status"', C.options(['pending', 'accepted', 'rejected', 'all'], self, self, state.status))),
      C.field('Fields', C.select('name="completeness"',
        C.options([{ v: 'missing', l: 'with missing fields' }, { v: 'complete', l: 'complete' }], function (x) { return x.v; }, function (x) { return x.l; }, state.completeness, 'all')))
    ], actions: [C.button('Filter', { submit: true })] });
  }

  function table() {
    return C.list({ rows: state.list, empty: 'No drafts for this filter.',
      after: function (d) { return state.open === d.id ? review(d) : ''; },
      columns: [
        { label: 'Draft', cell: function (d) { return '#' + d.id + ' ' + L.chip(d.source); } },
        { label: 'Date', cell: function (d) { return cell(d, 'expense_date', C.esc(d.expense_date)); } },
        { label: 'Category / type', cell: function (d) { return cell(d, 'expense_type_id', C.esc(d.expense_category) + ' / ' + C.esc(d.expense_type)); } },
        { label: 'Amount', num: true, cell: function (d) { return cell(d, 'amount', C.money(d.amount, d.currency || d.account_currency)); } },
        { label: 'FX → EUR', num: true, cell: function (d) { return cell(d, 'exchange_rate', C.esc(d.exchange_rate)); } },
        { label: 'Account', cell: function (d) { return cell(d, 'account_id', C.esc(d.account_name)); } },
        { label: 'Method', cell: function (d) { return cell(d, 'payment_method', C.esc(d.payment_method)); } },
        { label: 'Supplier', cell: function (d) {
          return d.supplier_match_id ? C.esc(d.supplier_match_name) + ' ' + C.tag('suggested ' + d.supplier_match_score)
            : (d.supplier_name ? C.esc(d.supplier_name) + ' ' + C.tag('no match') : '—'); } },
        { label: 'Confidence', cell: function (d) { return C.dash(d.confidence_note); } },
        { label: '', cell: function (d) {
          return d.status === 'pending' ? C.button('Review', { kind: 'ghost', attrs: { 'data-open': d.id } })
            : d.status === 'accepted' ? 'expense #' + C.esc(d.expense_id) : 'rejected'; } }
      ] });
  }

  // Kabul formu: taslak değerleriyle dolu; eksik alanlar kırmızı çerçeveli. Tedarikçi seçimi insanındır.
  function review(d) {
    var m = function (k) { return { missing: miss(d, k) }; };
    var supOpts = state.suppliers.map(function (s) { return { id: s.id, label: s.name + ' (' + s.country_code + ')' }; });
    return C.form({ id: 'acc-form', msg: 'acc-msg', attrs: { 'data-id': d.id }, fields: [
      C.field('Category / type', C.select('name="expense_type_id"', typeOpts(d.expense_type_id || ''), m('expense_type_id'))),
      C.field('Paid from account', C.select('name="account_id"', accOpts(d.account_id || ''), m('account_id'))),
      C.field('Amount', C.input('name="amount" value="' + C.esc(d.amount || '') + '"', m('amount'))),
      C.field('FX → EUR', C.input('name="exchange_rate" value="' + C.esc(d.exchange_rate || '') + '"', m('exchange_rate'))),
      C.field('Date', C.input('type="date" name="expense_date" value="' + C.esc(d.expense_date || '') + '"', m('expense_date'))),
      C.field('Method', C.select('name="payment_method"', C.options(METHODS, self, self, d.payment_method || '', '—'), m('payment_method'))),
      C.field('Expo', C.select('name="expo_id"', C.options(state.expos, function (e) { return e.id; }, function (e) { return e.name; }, d.expo_id || '', '—'))),
      C.field('Supplier' + (d.supplier_name ? ' (draft says: ' + d.supplier_name + ')' : ''),
        C.select('name="supplier_id"', C.options(supOpts, function (s) { return s.id; }, function (s) { return s.label; }, d.supplier_match_id || '', '— no supplier —'))),
      C.field('Document link', C.input('name="document_url" value="' + C.esc(d.document_url || '') + '"')),
      C.field('Notes', C.input('name="notes" value="' + C.esc(d.notes || '') + '"'))
    ], actions: [
      C.button('Accept → record expense', { kind: 'primary', submit: true }),
      C.button('Reject', { kind: 'ghost', attrs: { 'data-reject': d.id } })
    ] });
  }

  function newDraft() {
    return C.form({ id: 'new-form', msg: 'new-msg', fields: [
      C.field('Category / type', C.select('name="expense_type_id"', typeOpts(''))),
      C.field('Account', C.select('name="account_id"', accOpts(''))),
      C.field('Amount', C.input('name="amount"')),
      C.field('Date', C.input('type="date" name="expense_date"')),
      C.field('Supplier', C.input('name="supplier_name" list="sup-names" autocomplete="off"') +
        '<datalist id="sup-names">' + state.suppliers.map(function (s) { return '<option value="' + C.esc(s.name) + '">'; }).join('') + '</datalist>'),
      C.field('Notes', C.input('name="notes"'))
    ], actions: [C.button('Save draft', { submit: true })] });
  }

  function render() {
    root.innerHTML =
      C.page({ title: 'Expense drafts', sub: 'drafts never touch the ledger · an expense is born only on Accept · ' + state.list.length + ' shown',
        aside: C.links(['<a href="finance-expenses.html">← Expenses</a>']) }) +
      C.stack([
        C.section({ title: 'Pending review', eyebrow: 'missing fields in red · supplier suggestions are not assigned automatically', body: filters() + table() }),
        C.section({ title: 'New draft (manual)', eyebrow: 'partial entry — complete it later on review', body: newDraft() })
      ]);
  }

  function load() {
    if (!L.guard(root)) return;
    L.loading(root);
    var q = ['status=' + encodeURIComponent(state.status)];
    if (state.completeness) q.push('completeness=' + encodeURIComponent(state.completeness));
    Promise.all([L.api('GET', '/api/expense-drafts?' + q.join('&')), L.api('GET', '/api/ledger/accounts'),
                 L.api('GET', '/api/ledger/reference'), L.api('GET', '/api/expos'), L.api('GET', '/api/ledger/suppliers')])
      .then(function (r) {
        if (r[0].status !== 200) {
          root.innerHTML = C.state('error', r[0].status === 503 ? 'Expense drafts are not migrated yet — run scripts/migrate.js.'
            : 'Could not load drafts (HTTP ' + r[0].status + ').');
          return;
        }
        state.list = r[0].body; state.accounts = r[1].body || []; state.ref = r[2].body;
        state.expos = Array.isArray(r[3].body) ? r[3].body : []; state.suppliers = r[4].status === 200 ? r[4].body : [];
        render();
      }).catch(function () { L.offline(root); });
  }

  root.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, b = L.formJson(f);
    if (f.id === 'flt') { state.status = b.status || 'pending'; state.completeness = b.completeness || ''; state.open = null; load(); return; }
    if (f.id === 'new-form') {
      b.source = 'manual';
      L.api('POST', '/api/expense-drafts', b).then(function (r) {
        if (r.status === 201) load(); else C.say(document.getElementById('new-msg'), r.body && r.body.error, 'error');
      });
      return;
    }
    if (f.id === 'acc-form') {
      // Boş bırakılan alan taslağın değerini kullanmasın diye açıkça gönderilir (tedarikçi: insan seçimi).
      ['expo_id', 'supplier_id', 'document_url', 'notes'].forEach(function (k) { if (!(k in b)) b[k] = null; });
      L.api('POST', '/api/expense-drafts/' + f.getAttribute('data-id') + '/accept', b).then(function (r) {
        if (r.status === 201) { state.open = null; load(); }
        else C.say(document.getElementById('acc-msg'), r.body && r.body.error, 'error');
      });
    }
  });
  root.addEventListener('click', function (e) {
    var o = e.target.closest('button[data-open]');
    if (o) { state.open = Number(o.getAttribute('data-open')); render(); return; }
    var rj = e.target.closest('button[data-reject]');
    if (rj) {
      if (!confirm('Reject draft #' + rj.getAttribute('data-reject') + '? It stays on record as rejected; no expense is recorded.')) return;
      L.api('POST', '/api/expense-drafts/' + rj.getAttribute('data-reject') + '/reject').then(function (r) {
        if (r.status === 200) { state.open = null; load(); } else alert(r.body && r.body.error);
      });
    }
  });

  L.ready(load);
})();
</script>
</body>
</html>
