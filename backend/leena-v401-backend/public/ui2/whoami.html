<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Who is signed in</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<div id="ui2-nav"></div>

<main class="ui-main narrow" id="ui-root"></main>

<script>window.UI2_ACTIVE=null; window.UI2_SUBACTIVE='whoami';</script>
<script src="/leena-fetch.js"></script>
<script src="shell.js"></script>
<script src="components.js"></script>
<script>
(function () {
  'use strict';
  // READ-ONLY panel (Detay şablonu). Tek GET: /api/user-auth/me. Buton/form yok.
  var C = window.ui2C, root = document.getElementById('ui-root');
  function yesno(v){ return v ? 'Yes' : 'No'; }
  function show(body){ root.innerHTML = C.page({ title: 'Who is signed in' }) + C.section({ body: body }); }

  function load(){
    show(C.state('loading'));
    window.leenaFetch('/api/user-auth/me').then(function(res){
      if (res.status === 409) {
        // Eski /login.html oturumu — token'da user_id yok. Oturum korunur.
        show(C.detail([
          ['Session type', 'Organizer (classic sign-in)'],
          ['User account', '— ' + C.muted('sign in via ui2/login.html to see the user')]
        ]));
        return;
      }
      if (!res.ok) { show(C.state('error', 'Could not load (HTTP '+res.status+').')); return; }
      return res.json().then(function(u){
        show(C.detail([
          ['Name', C.dash(u.display_name)],
          ['Email', C.dash(u.email)],
          ['Role', C.dash((u.role && u.role.name) || u.display_role)],
          ['Owner', yesno(u.is_owner)],
          ['Office', C.dash(u.office && u.office.name)],
          ['Access', u.permissions ? (u.permissions.owner ? 'Everything (Owner)' : C.dash((u.permissions.areas || []).join(', '))) : '—'],
          ['Session type', 'User'],
          ['Password change required', yesno(u.password_must_change)]
        ]));
      });
    }).catch(function(err){
      if (err && err.status === 401) { window.location.href = '/ui2/login.html'; return; }
      show(C.state('error', 'Could not reach the server. Please retry.'));
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load);
  else load();
})();
</script>
</body>
</html>
