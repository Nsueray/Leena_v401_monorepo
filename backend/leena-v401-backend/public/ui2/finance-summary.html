<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Finance · Summary</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<div id="ui2-nav"></div>
<div id="ui2-subnav"></div>
<main class="ui-main" id="ui-root"></main>

<script>window.UI2_ACTIVE='finance'; window.UI2_SUBACTIVE='summary';</script>
<script src="/leena-fetch.js"></script>
<script src="shell.js"></script>
<script src="components.js"></script>
<script src="ledger-ui.js"></script>
<script>
(function () {
  'use strict';
  // L-6 (R12/R15): okuma anında türetilen özet, EUR (RAP-01). Dışarıda kalan her şey sayaçta (RAP-02).
  // Özet kartları kayda iner (UI-03 / D2): nakit → hesaplar, alacak → kontratlar, komisyon → Commissions.
  var C = window.ui2C, L = window.ui2L, root = document.getElementById('ui-root');

  function render(s) {
    var rc = s.receivables, cm = s.commissions, n = s.not_in_ledger;
    root.innerHTML =
      C.page({ title: 'Finance summary', sub: 'derived at read time · EUR at each entry\'s frozen rate · ' +
        String(s.as_of).slice(0, 16).replace('T', ' ') + ' UTC' }) +
      C.stats([
        { label: 'Total cash (bank + cash)', value: C.eur(s.total_cash_eur), href: 'finance-accounts.html' },
        { label: 'Open receivables', value: C.eur(rc.open_eur), note: rc.open_contracts + ' contracts', href: 'finance-contracts.html' },
        { label: 'Commission payable', value: C.eur(cm.payable_eur), note: cm.payable_agents + ' agents', href: 'placeholder.html?id=commissions' },
        { label: 'Owner current account', value: C.eur(s.person_accounts_eur), neg: Number(s.person_accounts_eur) < 0,
          note: 'negative = company owes the owner', href: 'finance-accounts.html' }
      ]) +
      C.stack([
        C.section({ title: 'Account balances', body: C.list({
          rows: s.accounts, empty: 'No accounts yet.',
          href: function (a) { return 'finance-account.html?account=' + a.id; },
          columns: [
            { label: 'Account', cell: function (a) { return '<a href="finance-account.html?account=' + a.id + '">' + C.esc(a.name) + '</a>' + (a.is_active ? '' : C.tag('inactive')); } },
            { label: 'Type', cell: function (a) { return L.chip(a.account_type); } },
            { label: 'Balance · EUR', num: true, neg: function (a) { return Number(a.balance) < 0; },
              cell: function (a) { return C.pair(a.balance, a.currency, a.balance_eur); } }
          ] }) }),
        C.section({ title: 'Kept apart — never netted, never hidden', body: C.lines([
          'Overpaid contracts: ' + rc.overpaid_contracts + ' (' + C.eur(rc.overpaid_eur) + ') — not subtracted from receivables.',
          'On Hold contracts\' open balance (included above): ' + C.eur(rc.on_hold_open_eur) + '.',
          'Excluded from receivables: ' + rc.excluded_transferred + ' Transferred · ' + rc.excluded_cancelled + ' Cancelled · ' +
            rc.missing_revenue_eur + ' without EUR revenue.',
          'Agents owing us (negative commission balance): ' + cm.owing_agents + ' (' + C.eur(cm.agents_owe_eur) + ') — not subtracted from payable.',
          'Not in the ledger: ' + n.payments_count + ' payments (' + C.eur(n.payments_eur) + ') · ' + n.payouts_count + ' payouts (' +
            C.eur(n.payouts_eur) + ') — recorded before the ledger or without an account; cash balances do not include them.'
        ]) })
      ]);
  }

  function load() {
    if (!L.guard(root)) return;
    L.loading(root);
    L.api('GET', '/api/ledger/summary').then(function (r) {
      if (r.status !== 200) { L.httpError(root, r, 'summary'); return; }
      render(r.body);
    }).catch(function () { L.offline(root); });
  }

  L.ready(load);
})();
</script>
</body>
</html>
