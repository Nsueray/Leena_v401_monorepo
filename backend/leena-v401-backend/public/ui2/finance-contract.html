<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Finance · Contract</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<div id="ui2-nav"></div>
<div id="ui2-subnav"></div>
<main class="ui-main" id="ui-root"></main>

<script>window.UI2_ACTIVE='finance'; window.UI2_SUBACTIVE='contract';</script>
<script src="/leena-fetch.js"></script>
<script src="shell.js"></script>
<script src="components.js"></script>
<script src="ledger-ui.js"></script>
<script>
(function () {
  'use strict';
  // Detay şablonu. Sunucu string'i (ör. "342.00") olduğu gibi gösterilir — client YENİDEN HESAPLAMAZ (RAP-02).
  // Kalem birim fiyatının EUR karşılığı API'de YOK (backend kuyruğu) → tek birimli `money`; diğer tutarlar para çifti.
  var C = window.ui2C, L = window.ui2L, root = document.getElementById('ui-root');
  var TONE = { 'Active': 'primary', 'On Hold': 'warn', 'Cancelled': 'dang' };

  function statusChip(st) { return st ? C.chip(st, TONE[st] || 'neutral') : ''; }

  function lineItems(items) {
    return C.list({ rows: items, empty: 'No line items on this contract.', columns: [
      { label: 'Description', cell: function (it) {
        return C.dash(it.description) + (it.is_registration_fee ? C.tag('reg. fee', 'warn') : '') +
          (it.product_code ? ' ' + C.muted('·' + C.esc(it.product_code)) : ''); } },
      { label: 'Qty', num: true, cell: function (it) { return C.dash(it.quantity); } },
      { label: 'Unit price', num: true, cell: function (it) { return C.money(it.unit_price, it.currency); } }
    ] });
  }

  function commission(comm) {
    if (!comm) return C.state('empty', 'Commission unavailable — ' + (comm && comm.commission_reason || '—') + '.');
    return C.list({ rows: comm.roles, empty: 'No commission roles assigned.', columns: [
      { label: 'Role', cell: function (r) { return C.esc((r.role || '').toUpperCase()); } },
      { label: 'Agent', cell: function (r) { return C.dash(r.agent_name); } },
      { label: 'Rate', num: true, cell: function (r) { return r.pct_used == null ? '—' : C.esc(r.pct_used) + '%'; } },
      { label: 'Earned (EUR)', num: true, cell: function (r) { return r.earned_eur == null ? C.muted(C.dash(r.reason)) : C.eur(r.earned_eur); } }
    ] });
  }

  function payments(list) {
    return C.list({ rows: list, empty: 'No payments recorded.', columns: [
      { label: 'Date', cell: function (p) { return C.dash(p.payment_date) + (p.reverses_payment_id != null ? C.tag('reversal', 'dang') : ''); } },
      { label: 'Method', cell: function (p) { return C.dash(p.payment_method); } },
      { label: 'Amount · EUR booked', num: true, cell: function (p) { return C.pair(p.amount, p.currency, p.amount_eur); } },
      { label: 'FX rate', num: true, cell: function (p) { return C.dash(p.exchange_rate); } }
    ] });
  }

  function render(c, pay) {
    var comm = c.commission;
    var commEyebrow = comm ? ('Base ' + C.eur(comm.base) + ' · ratio ' + C.dash(comm.ratio) + (comm.overpayment ? ' · overpaid' : '')) : '';
    root.innerHTML =
      C.page({ titleHtml: C.dash(c.company_name),
        subHtml: C.dash(c.af_number) + (c.expo_name ? ' · ' + C.esc(c.expo_name) : '') + (c.contract_date ? ' · ' + C.esc(c.contract_date) : ''),
        aside: statusChip(c.status) }) +
      C.stats([
        { label: 'Revenue', value: C.pair(c.revenue, c.currency, c.revenue_eur), note: 'EUR booked at the contract rate', href: '#line-items' },
        { label: 'Paid', value: C.eur(c.paid_eur), href: '#payments' },
        { label: 'Balance', value: C.eur(c.balance_eur), href: '#payments' }
      ]) +
      C.stack([
        C.section({ id: 'line-items', title: 'Line items', eyebrow: 'Transaction currency', body: lineItems(c.line_items) }),
        C.section({ id: 'commission', title: 'Commission', eyebrow: commEyebrow, body: commission(comm) }),
        C.section({ id: 'payments', title: 'Payments', eyebrow: 'FX captured at settlement', body: payments(pay && pay.payments) })
      ]);
  }

  function jsonOrNull(res) { return res.ok ? res.json() : Promise.resolve({ __http: res.status }); }

  function load() {
    // Yetki TEK NOKTADAN sorulur — ekran kendi kuralını yazmaz (kural #3).
    if (!L.guard(root)) return;
    L.loading(root);
    var cid = new URLSearchParams(location.search).get('contract') || '4';
    Promise.all([
      window.leenaFetch('/api/contracts/' + encodeURIComponent(cid)).then(jsonOrNull),
      window.leenaFetch('/api/contracts/' + encodeURIComponent(cid) + '/payments').then(jsonOrNull)
    ]).then(function (r) {
      var c = r[0], pay = r[1];
      if (c && c.__http === 404) {
        root.innerHTML = C.state('empty', 'Contract #' + cid + ' not found.', { html: ' <a href="finance-contracts.html">Open the contract list</a>.' });
        return;
      }
      if (c && c.__http) { root.innerHTML = C.state('error', 'Could not load contract (HTTP ' + c.__http + ').'); return; }
      render(c, (pay && pay.__http) ? null : pay);
    }).catch(function (err) {
      // 401: leena-fetch göreli login.html'e gider (/ui2'den yanlış çözülür) — mutlakla önceliyoruz.
      if (err && err.status === 401) { window.location.href = '/login.html'; return; }
      L.offline(root);
    });
  }

  // shell.js DOMContentLoaded'da nav/subnav kurar; veri yüklemesini de aynı ana bağla.
  L.ready(load);
})();
</script>
</body>
</html>
