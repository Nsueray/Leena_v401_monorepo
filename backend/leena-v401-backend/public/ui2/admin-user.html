<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Admin · User</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<div id="ui2-nav"></div>
<div id="ui2-subnav"></div>
<main class="ui-main" id="ui-root"></main>

<script>window.UI2_ACTIVE='admin'; window.UI2_SUBACTIVE='users';</script>
<script src="/leena-fetch.js"></script>
<script src="shell.js"></script>
<script src="components.js"></script>
<script src="ledger-ui.js"></script>
<script src="admin-ui.js"></script>
<script>
(function () {
  'use strict';
  // P2-1 + P2-2: kullanıcı detayı — profil · aktif/pasif (sebep zorunlu, B12) · davet · şablon +
  // kişi başı yetki (grant + kapsam | revoke). Etkin yetki SUNUCUDA çözülür (utils/permissions.js);
  // bu ekran yalnız gösterir. Kendi kaydında rol/yetki/ofis değiştirilemez (B32); Owner sabittir.
  var C = window.ui2C, L = window.ui2L, A = window.ui2A, root = document.getElementById('ui-root');
  var id = L.qs('user');
  var st = { d: null, opts: null, lastInvite: null };

  function profileCard(u) {
    var o = st.opts, lockOffice = st.d.is_self || !o.actor.can_matrix;
    return C.form({ id: 'prof-form', msg: 'prof-msg', fields: [
      C.field('Name', C.input('name="display_name" value="' + C.esc(u.display_name || '') + '"')),
      C.field('Office' + (lockOffice ? ' (needs permissions.write, not on yourself)' : ''),
        C.select('name="office_id"' + (lockOffice ? ' disabled' : ''),
          C.options(o.offices, function (x) { return x.id; }, function (x) { return x.name; }, u.office_id == null ? '' : u.office_id, '— none —'))),
      C.field('Sales agent link', C.select('name="sales_agent_id"', A.agentOptions(o.agents, '', u.sales_agent_id, u.sales_agent_name)))
    ], actions: [o.actor.can_write ? C.button('Save profile', { kind: 'primary', submit: true }) : ''] });
  }

  function statusCard(u) {
    if (st.d.is_self) return C.state('empty', 'This is you — your own status cannot be changed here.');
    if (!st.opts.actor.can_write) return C.state('empty', 'Status: ', { html: A.statusChip(u.status) });
    if (u.is_active) {
      return C.form({ id: 'deact-form', msg: 'st-msg', fields: [
          A.statusChip(u.status),
          C.field('Reason (required)', C.input('name="reason" required'), { wide: true })
        ], actions: [C.button('Deactivate', { submit: true })] }) +
        C.text(C.note('Deactivation signs the person out everywhere on their next request and cancels open invitations.'));
    }
    return C.form({ id: 'act-form', msg: 'st-msg', fields: [
      A.statusChip(u.status),
      C.field('Reason (optional)', C.input('name="reason"'), { wide: true })
    ], actions: [C.button('Activate', { kind: 'primary', submit: true })] });
  }

  function inviteCard(u) {
    if (u.has_password) return C.state('empty', 'Password set — invitation accepted.');
    var line = 'Invitation: ' + C.esc(u.invite_state || 'none') + (u.invite_expires_at ? ' · expires ' + C.esc(String(u.invite_expires_at).replace('T', ' ').slice(0, 16)) + ' UTC' : '');
    return C.form({ id: 'inv-line', msg: 'inv-msg', fields: [line],
      actions: [st.opts.actor.can_write && u.is_active ? C.button('Resend invitation', { attrs: 'id="resend"' }) : ''] }) +
      '<div id="inv-link"></div>';
  }

  function matrixCard(u) {
    var o = st.opts, d = st.d;
    if (u.is_owner) return C.state('empty', 'Owner — full access by definition. Role and permissions cannot be changed.');
    if (d.is_self) return C.state('empty', 'This is you — no one can change their own role or permissions (B32).');
    var edit = o.actor.can_matrix;
    var roleSel = C.form({ id: 'role-form', msg: 'role-msg', fields: [
      C.field('Role (template)', C.select('name="role_id"' + (edit ? '' : ' disabled'),
        C.options(o.roles.filter(function (r) { return !r.owner_template; }), function (r) { return r.id; }, function (r) { return r.name; },
          u.role_id == null ? '' : u.role_id, '— no role —')))
    ], actions: [edit ? C.button('Save role', { kind: 'primary', submit: true }) : ''] });
    var fromRole = {}, over = {};
    d.role_permissions.forEach(function (p) { fromRole[p.code] = p.scope; });
    d.overrides.forEach(function (p) { over[p.code] = p; });
    var cur = function (p) { var ov = over[p.code]; return ov ? (ov.effect === 'revoke' ? 'revoke' : 'grant:' + ov.scope) : ''; };
    var choices = [{ v: '', t: '— none —' }, { v: 'revoke', t: 'revoke' }].concat(o.scopes.map(function (s) { return { v: 'grant:' + s, t: 'grant · ' + s }; }));
    var matrix = C.list({ rows: o.registry, empty: 'No permissions registered.', columns: [
      { label: 'Permission', cell: function (p) { return '<code>' + C.esc(p.code) + '</code>' + C.note(C.esc(p.description)); } },
      { label: 'Area', cell: function (p) { return C.esc(p.area); } },
      { label: 'From role', cell: function (p) { return C.dash(fromRole[p.code]); } },
      { label: 'Per-user override', cell: function (p) {
        return edit ? C.select({ 'data-code': p.code }, C.options(choices, function (c) { return c.v; }, function (c) { return c.t; }, cur(p))) : C.dash(cur(p)); } },
      { label: 'Effective', cell: function (p) { return d.effective.codes[p.code] ? '<strong>' + C.esc(d.effective.codes[p.code]) + '</strong>' : '—'; } }
    ] });
    return roleSel + matrix +
      (edit ? C.form({ id: 'ov-form', msg: 'ov-msg', fields: [C.field('Reason for override changes (optional)', C.input('name="reason"'), { wide: true })],
        actions: [C.button('Save overrides', { kind: 'primary', submit: true })] }) : '');
  }

  function historyCard() {
    var h = st.d.history;
    if (!h) return '';
    return C.section({ title: 'History', eyebrow: 'Audit log · Owner only', body: C.list({ rows: h, empty: 'No events yet.', columns: [
      { label: 'When (UTC)', cell: function (e) { return C.esc(String(e.created_at).replace('T', ' ').slice(0, 16)); } },
      { label: 'Event', cell: function (e) { return '<code>' + C.esc(e.action) + '</code>'; } },
      { label: 'By', cell: function (e) { return C.dash(e.actor_name); } },
      { label: 'Reason', cell: function (e) { return C.dash(e.reason); } },
      { label: 'Change', cell: function (e) { return '<code>' + C.esc(JSON.stringify(e.diff)) + '</code>'; } }
    ] }) });
  }

  function render() {
    var u = st.d.user;
    root.innerHTML =
      C.page({ titleHtml: C.esc(u.display_name || u.email) + (u.is_owner ? ' ' + C.tag('owner') : ''),
        sub: u.email + ' · ' + (u.role_name || 'no role') + ' · ' + (u.office_name || 'no office'),
        aside: C.links(['<a href="admin-users.html">← Users</a>']) }) +
      C.stack([
        C.section({ title: 'Profile', body: profileCard(u) }),
        C.section({ title: 'Status', eyebrow: 'Deactivate instead of delete', body: statusCard(u) }),
        C.section({ title: 'Invitation', body: inviteCard(u) }),
        C.section({ title: 'Role & permissions', eyebrow: 'Effective = role + per-user overrides', body: matrixCard(u) }),
        historyCard()
      ]);
    if (st.lastInvite) A.showInviteResult(document.getElementById('inv-msg'), document.getElementById('inv-link'), st.lastInvite);
  }

  function load() {
    if (!id) { root.innerHTML = C.state('error', 'Missing user parameter.'); return; }
    L.loading(root);
    Promise.all([L.api('GET', '/api/users/' + encodeURIComponent(id)), L.api('GET', '/api/users/options')]).then(function (r) {
      if (r[0].status !== 200) { A.httpError(root, r[0], 'the user'); return; }
      if (r[1].status !== 200) { A.httpError(root, r[1], 'user options'); return; }
      st.d = r[0].body; st.opts = r[1].body;
      render();
    }).catch(function () { L.offline(root); });
  }

  function after(msgId, okText) {
    return function (r) {
      if (r.status === 200 || r.status === 201) { load(); if (okText) setTimeout(function () { C.say(document.getElementById(msgId), okText, 'ok'); }, 300); }
      else C.say(document.getElementById(msgId), A.errorText(r), 'error');
    };
  }

  root.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, b = L.formJson(f), base = '/api/users/' + encodeURIComponent(id);
    if (f.id === 'prof-form') {
      var body = { display_name: b.display_name || '', sales_agent_id: b.sales_agent_id || null };
      if (!f.elements.office_id.disabled) body.office_id = b.office_id || null;
      L.api('PUT', base, body).then(after('prof-msg', 'Saved.'));
    } else if (f.id === 'deact-form') {
      L.api('POST', base + '/deactivate', { reason: b.reason }).then(after('st-msg', 'Deactivated.'));
    } else if (f.id === 'act-form') {
      L.api('POST', base + '/activate', { reason: b.reason }).then(after('st-msg', 'Activated.'));
    } else if (f.id === 'role-form') {
      L.api('PUT', base + '/role', { role_id: b.role_id || null }).then(after('role-msg', 'Role saved.'));
    } else if (f.id === 'ov-form') {
      // Yalnız değişen satırlar gönderilir (her biri ayrı denetim kaydı).
      var cur = {};
      st.d.overrides.forEach(function (p) { cur[p.code] = p.effect === 'revoke' ? 'revoke' : 'grant:' + p.scope; });
      var calls = [];
      root.querySelectorAll('select[data-code]').forEach(function (s) {
        var code = s.getAttribute('data-code'), v = s.value;
        if (v === (cur[code] || '')) return;
        var url = base + '/permissions/' + encodeURIComponent(code);
        if (!v) calls.push(L.api('DELETE', url, { reason: b.reason || undefined }));
        else if (v === 'revoke') calls.push(L.api('PUT', url, { effect: 'revoke', reason: b.reason || undefined }));
        else calls.push(L.api('PUT', url, { effect: 'grant', scope: v.split(':')[1], reason: b.reason || undefined }));
      });
      if (!calls.length) { C.say(document.getElementById('ov-msg'), 'Nothing changed.', 'warn'); return; }
      Promise.all(calls).then(function (rs) {
        var bad = rs.filter(function (r) { return r.status !== 200; });
        if (bad.length) { C.say(document.getElementById('ov-msg'), A.errorText(bad[0]), 'error'); return; }
        load();
      });
    }
  });
  root.addEventListener('click', function (e) {
    if (e.target.id !== 'resend') return;
    L.api('POST', '/api/users/' + encodeURIComponent(id) + '/invite').then(function (r) {
      if (r.status === 201) { st.lastInvite = { email: st.d.user.email, expires_at: r.body.invite.expires_at, invite_url: r.body.invite_url }; load(); }
      else C.say(document.getElementById('inv-msg'), A.errorText(r), 'error');
    });
  });

  L.ready(load);
})();
</script>
</body>
</html>
