<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Finance · Contracts</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<div id="ui2-nav"></div>
<div id="ui2-subnav"></div>
<main class="ui-main" id="ui-root"></main>

<script>window.UI2_ACTIVE='finance'; window.UI2_SUBACTIVE='contract';</script>
<script src="/leena-fetch.js"></script>
<script src="shell.js"></script>
<script src="components.js"></script>
<script src="ledger-ui.js"></script>
<script>
(function () {
  'use strict';
  // READ-ONLY liste (Liste şablonu). Tek GET: /api/contracts. paid_eur / balance_eur sunucuda
  // hesaplanır (routes/contracts.js D2) — client YENİDEN HESAPLAMAZ (RAP-02).
  var C = window.ui2C, L = window.ui2L, root = document.getElementById('ui-root');
  var TONE = { 'Active': 'primary', 'On Hold': 'warn', 'Cancelled': 'dang' };

  function statusChip(st) { return st ? C.chip(st, TONE[st] || 'neutral') : '—'; }
  function detailHref(id) { return 'finance-contract.html?contract=' + encodeURIComponent(id); }

  function render(list) {
    root.innerHTML =
      C.page({ title: 'Contracts', sub: list.length + ' contract' + (list.length === 1 ? '' : 's') + ' · read-only' }) +
      C.section({ body: C.list({
        rows: list, empty: 'No contracts yet.', href: function (c) { return detailHref(c.id); },
        columns: [
          { label: 'AF no', cell: function (c) { return '<a href="' + detailHref(c.id) + '">' + C.dash(c.af_number) + '</a>'; } },
          { label: 'Company', cell: function (c) { return C.dash(c.company_name); } },
          { label: 'Expo', cell: function (c) { return C.dash(c.expo_name); } },
          { label: 'Status', cell: function (c) { return statusChip(c.status); } },
          { label: 'Revenue · EUR', num: true, cell: function (c) { return C.pair(c.revenue, c.currency, c.revenue_eur); } },
          { label: 'Paid (EUR)', num: true, cell: function (c) { return C.eur(c.paid_eur); } },
          { label: 'Balance (EUR)', num: true, cell: function (c) { return C.eur(c.balance_eur); } }
        ] }) });
  }

  function load() {
    // Yetki TEK NOKTADAN sorulur — ekran kendi kuralını yazmaz.
    if (!L.guard(root)) return;
    L.loading(root);
    window.leenaFetch('/api/contracts').then(function (res) {
      if (!res.ok) { root.innerHTML = C.state('error', 'Could not load contracts (HTTP ' + res.status + ').'); return; }
      return res.json().then(function (list) { render(Array.isArray(list) ? list : []); });
    }).catch(function (err) {
      // 401: leena-fetch göreli login.html'e gider (/ui2'den yanlış çözülür) — mutlakla önceliyoruz.
      if (err && err.status === 401) { window.location.href = '/login.html'; return; }
      L.offline(root);
    });
  }

  L.ready(load);
})();
</script>
</body>
</html>
