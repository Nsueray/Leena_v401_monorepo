<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Finance · Suppliers</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<div id="ui2-nav"></div>
<div id="ui2-subnav"></div>
<main class="ui-main" id="ui-root"></main>

<script>window.UI2_ACTIVE='finance'; window.UI2_SUBACTIVE='suppliers';</script>
<script src="/leena-fetch.js"></script>
<script src="shell.js"></script>
<script src="components.js"></script>
<script src="ledger-ui.js"></script>
<script>
(function () {
  'use strict';
  // P1b-1: tedarikçi (para karşı tarafı) kaydı. Silinmez, pasiflenir. Toplamlar SUNUCUDA
  // ledger'dan türetilir (D2) — istemci hesaplamaz.
  var C = window.ui2C, L = window.ui2L, root = document.getElementById('ui-root');
  var state = { list: [], opts: null, offices: [], q: L.qs('q') || '', all: L.qs('all') === '1' };
  function self(x) { return x; }
  function href(s) { return 'finance-supplier.html?supplier=' + s.id; }

  function table() {
    return C.list({
      rows: state.list, href: href,
      empty: state.q ? 'No supplier matches "' + state.q + '".' : 'No suppliers yet — add the first one below.',
      columns: [
        { label: 'Supplier', cell: function (s) {
          return '<a href="' + href(s) + '">' + C.esc(s.name) + '</a>' +
            (s.is_active ? '' : C.tag('inactive')) + (s.score != null ? C.tag('match ' + s.score) : ''); } },
        { label: 'Type', cell: function (s) { return L.chip(s.supplier_type); } },
        { label: 'Country', cell: function (s) { return C.esc(s.country_name); } },
        { label: 'Office', cell: function (s) { return C.dash(s.office_name); } },
        { label: 'Tax no.', cell: function (s) { return C.dash(s.tax_number); } },
        { label: 'Expenses', num: true, cell: function (s) { return C.esc(s.expense_count); } },
        { label: 'Paid (EUR)', num: true, cell: function (s) { return C.eur(s.paid_eur); } },
        { label: 'Last', cell: function (s) { return C.dash(s.last_expense_date); } },
        { label: '', cell: function (s) {
          return C.button(s.is_active ? 'Deactivate' : 'Activate', { kind: 'ghost',
            attrs: { 'data-act': 'toggle', 'data-id': s.id, 'data-active': String(s.is_active) } }); } }
      ] });
  }

  function searchForm() {
    return C.form({ id: 'flt', fields: [
      C.field('Search by name', C.input('name="q" value="' + C.esc(state.q) + '"')),
      C.field('Inactive', C.check('name="all"' + (state.all ? ' checked' : ''), 'include'))
    ], actions: [C.button('Filter', { submit: true })] });
  }

  function newForm() {
    return C.form({ id: 'new-form', msg: 'new-msg', fields: [
      C.field('Name', C.input('name="name" required')),
      C.field('Type', C.select('name="supplier_type"', C.options(state.opts.types, self, self, 'supplier'))),
      C.field('Country', C.select('name="country_code" required',
        C.options(state.opts.countries, function (c) { return c.code; }, function (c) { return c.name; }, '', '—'))),
      C.field('Office (optional)', C.select('name="office_id"',
        C.options(state.offices, function (o) { return o.id; }, function (o) { return o.name; }, '', '— none —'))),
      C.field('Tax number (optional)', C.input('name="tax_number"')),
      C.field('Notes', C.input('name="notes"'))
    ], actions: [C.button('Add supplier', { kind: 'primary', submit: true })] });
  }

  function render() {
    root.innerHTML =
      C.page({ title: 'Suppliers', sub: 'money counterparties · ' + state.list.length + ' shown · totals derived from ledger entries',
        aside: C.links(['<a href="finance-expenses.html">← Expenses</a>']) }) +
      C.stack([
        C.section({ title: 'Suppliers', eyebrow: 'Never deleted — deactivate instead', body: searchForm() + table() }),
        C.section({ title: 'Add supplier', eyebrow: 'Type is not an expo-partner role — this is who we pay', body: newForm() })
      ]);
  }

  function load() {
    if (!L.guard(root)) return;
    L.loading(root);
    var qs = [];
    if (state.q) qs.push('q=' + encodeURIComponent(state.q));
    if (state.all) qs.push('include_inactive=1');
    Promise.all([L.api('GET', '/api/ledger/suppliers' + (qs.length ? '?' + qs.join('&') : '')),
                 L.api('GET', '/api/ledger/suppliers/options'), L.api('GET', '/api/offices')])
      .then(function (r) {
        if (r[0].status !== 200) { L.httpError(root, r[0], 'suppliers'); return; }
        state.list = r[0].body; state.opts = r[1].body; state.offices = Array.isArray(r[2].body) ? r[2].body.filter(function (o) { return o.is_active !== false; }) : [];
        render();
      }).catch(function () { L.offline(root); });
  }

  root.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, b = L.formJson(f);
    if (f.id === 'flt') { state.q = b.q || ''; state.all = !!b.all; load(); return; }
    L.api('POST', '/api/ledger/suppliers', b).then(function (r) {
      if (r.status === 201) load(); else C.say(document.getElementById('new-msg'), r.body && r.body.error, 'error');
    });
  });
  // Satır tıklaması → detay: components.js (data-href). Burada yalnız aktif/pasif düğmesi.
  root.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act="toggle"]');
    if (!btn) return;
    L.api('PUT', '/api/ledger/suppliers/' + btn.getAttribute('data-id'), { is_active: btn.getAttribute('data-active') !== 'true' })
      .then(function (r) { if (r.status === 200) load(); else alert(r.body && r.body.error); });
  });

  L.ready(load);
})();
</script>
</body>
</html>
