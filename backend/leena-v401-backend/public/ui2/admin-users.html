<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — Admin · Users</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<div id="ui2-nav"></div>
<div id="ui2-subnav"></div>
<main class="ui-main" id="ui-root"></main>

<script>window.UI2_ACTIVE='admin'; window.UI2_SUBACTIVE='users';</script>
<script src="/leena-fetch.js"></script>
<script src="shell.js"></script>
<script src="components.js"></script>
<script src="ledger-ui.js"></script>
<script src="admin-ui.js"></script>
<script>
(function () {
  'use strict';
  // P2-1: kullanıcı listesi + davet. Durum (active / invited / invite_expired / inactive) sunucuda
  // türetilir; yetki sunucuda denetlenir (bu ekran yalnız gösterir). Şablon seçimi permissions.write ister.
  var C = window.ui2C, L = window.ui2L, A = window.ui2A, root = document.getElementById('ui-root');
  var state = { users: [], opts: null, lastInvite: null };
  function userHref(u) { return 'admin-user.html?user=' + encodeURIComponent(u.id); }

  function table() {
    return C.list({ rows: state.users, empty: 'No users.', href: userHref, columns: [
      { label: 'User', cell: function (u) { return '<a href="' + userHref(u) + '">' + C.esc(u.display_name || u.email) + '</a>' + (u.is_owner ? C.tag('owner') : ''); } },
      { label: 'Email', cell: function (u) { return C.esc(u.email); } },
      { label: 'Role', cell: function (u) { return C.dash(u.role_name); } },
      { label: 'Office', cell: function (u) { return C.dash(u.office_name); } },
      { label: 'Sales agent', cell: function (u) { return C.dash(u.sales_agent_name); } },
      { label: 'Status', cell: function (u) { return A.statusChip(u.status); } }
    ] });
  }

  function inviteForm() {
    var o = state.opts;
    if (!o.actor.can_write) return C.state('empty', 'You can see users but not invite them (needs users.write).');
    var roles = o.roles.filter(function (r) { return !r.owner_template; });
    return C.form({ id: 'inv-form', msg: 'inv-msg', fields: [
      C.field('Email', C.input('name="email" type="email" required')),
      C.field('Name (optional)', C.input('name="display_name"')),
      o.actor.can_matrix
        ? C.field('Role', C.select('name="role_id"', C.options(roles, function (r) { return r.id; }, function (r) { return r.name; }, '', '— no role —')))
        : '',
      C.field('Office', C.select('name="office_id"', C.options(o.offices, function (x) { return x.id; }, function (x) { return x.name; }, '', '— none —'))),
      C.field('Sales agent link', C.select('name="sales_agent_id" id="inv-agent"', A.agentOptions(o.agents, '')))
    ], actions: [C.button('Send invitation', { kind: 'primary', submit: true })] }) +
      '<div id="inv-link"></div>' +
      C.text(C.note('The invitation link works once and expires after ' + C.esc(o.invite_ttl_hours) +
        ' hours. A sales agent whose email matches is suggested — the link is only made if you keep it selected.'));
  }

  function render() {
    root.innerHTML = C.page({ title: 'Users', sub: state.users.length + ' shown · people who sign in · permissions are checked on the server' }) +
      C.stack([
        C.section({ title: 'Users', eyebrow: 'Deactivate instead of delete', body: table() }),
        C.section({ title: 'Invite a user', eyebrow: 'One-time link, emailed', body: inviteForm() })
      ]);
    if (state.lastInvite) A.showInviteResult(document.getElementById('inv-msg'), document.getElementById('inv-link'), state.lastInvite);
  }

  function load() {
    L.loading(root);
    Promise.all([L.api('GET', '/api/users'), L.api('GET', '/api/users/options')]).then(function (r) {
      if (r[0].status !== 200) { A.httpError(root, r[0], 'users'); return; }
      if (r[1].status !== 200) { A.httpError(root, r[1], 'user options'); return; }
      state.users = r[0].body; state.opts = r[1].body;
      render();
    }).catch(function () { L.offline(root); });
  }

  // E-posta eşleşmesi → temsilci ÖNERİSİ (seçili gelir; kullanıcı değiştirebilir — OFS-05).
  root.addEventListener('input', function (e) {
    if (!e.target.form || e.target.form.id !== 'inv-form' || e.target.name !== 'email') return;
    var sel = document.getElementById('inv-agent');
    if (sel && !sel.dataset.touched) sel.innerHTML = A.agentOptions(state.opts.agents, e.target.value);
  });
  root.addEventListener('change', function (e) { if (e.target.id === 'inv-agent') e.target.dataset.touched = '1'; });

  root.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id !== 'inv-form') return;
    var b = L.formJson(e.target), msg = document.getElementById('inv-msg');
    L.api('POST', '/api/users/invite', b).then(function (r) {
      if (r.status === 201) { state.lastInvite = { email: r.body.user.email, expires_at: r.body.invite.expires_at, invite_url: r.body.invite_url }; load(); }
      else C.say(msg, A.errorText(r), 'error');
    });
  });
  // Satır tıklaması → kullanıcı detayı: components.js (data-href).

  L.ready(load);
})();
</script>
</body>
</html>
