<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIZA — ui2</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('eliza-theme')||'vermillion');}catch(e){document.documentElement.setAttribute('data-theme','vermillion');}</script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/signal.css">
</head>
<body>
<!-- Nav TEK KAYNAK nav.json (shell.js okur). Bu sayfa yalnız girişi yönlendirir. -->
<div id="ui2-nav"></div>
<main class="ui-main narrow" id="ui-root"></main>

<script>window.UI2_ACTIVE=null; window.UI2_SUBACTIVE='home';</script>
<script src="/leena-fetch.js"></script>
<script src="shell.js"></script>
<script src="components.js"></script>
<script>
(function () {
  'use strict';
  // ui2 girişi → Finance özet (UI-06 asgarisi). Hedef nav.json `landing`'den; kullanıcı Finance'ı
  // göremiyorsa ilk görünen alana (ui2Landing, shell.js). Token yoksa shell.js /login.html'e gönderir.
  var C = window.ui2C, root = document.getElementById('ui-root');
  root.innerHTML = C.state('loading', 'Opening ELIZA…');
  document.addEventListener('DOMContentLoaded', function () {
    if (!localStorage.getItem('token')) return;
    window.ui2LoadNav().then(function () { window.location.replace(window.ui2Landing()); },
      function () { root.innerHTML = C.state('error', 'Navigation unavailable — reload the page.'); });
  });
})();
</script>
</body>
</html>
