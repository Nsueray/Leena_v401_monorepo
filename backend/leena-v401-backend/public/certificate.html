<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
    <title>Conference Certificate - Leena EMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4a6fa5;
            --gold: #c9a84c;
            --gold-light: #f5ecd7;
            --text: #1e293b;
            --text-sec: #475569;
            --bg: #f0f2f5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

        /* Loading */
        .loading { text-align: center; padding: 60px 20px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Error */
        .error-state { text-align: center; padding: 60px 20px; max-width: 400px; }
        .error-state .icon { font-size: 48px; margin-bottom: 16px; }
        .error-state h2 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
        .error-state p { color: var(--text-sec); font-size: 14px; }

        /* Certificate */
        .certificate-wrapper { width: 100%; max-width: 800px; }

        .certificate {
            background: #fff;
            border: 3px solid var(--gold);
            border-radius: 4px;
            padding: 60px 50px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        /* Decorative inner border */
        .certificate::before {
            content: '';
            position: absolute;
            top: 12px; right: 12px; bottom: 12px; left: 12px;
            border: 1px solid var(--gold);
            border-radius: 2px;
            pointer-events: none;
        }

        /* Corner ornaments */
        .certificate::after {
            content: '';
            position: absolute;
            top: 20px; right: 20px; bottom: 20px; left: 20px;
            border: 1px solid rgba(201,168,76,0.3);
            pointer-events: none;
        }

        .cert-logo { height: 40px; margin-bottom: 20px; opacity: 0.7; }
        .cert-title { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: var(--gold); margin-bottom: 6px; letter-spacing: 2px; text-transform: uppercase; }
        .cert-subtitle { font-size: 14px; color: var(--text-sec); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 36px; }

        .cert-preamble { font-size: 15px; color: var(--text-sec); margin-bottom: 12px; }

        .cert-name {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .cert-company { font-size: 15px; color: var(--primary); font-weight: 500; margin-bottom: 28px; }

        .cert-session-label { font-size: 14px; color: var(--text-sec); margin-bottom: 8px; }
        .cert-topic {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 32px;
            padding: 16px 24px;
            background: var(--gold-light);
            border-radius: 8px;
            display: inline-block;
        }

        .cert-divider { width: 120px; height: 2px; background: var(--gold); margin: 0 auto 24px; }

        .cert-date { font-size: 14px; color: var(--text-sec); margin-bottom: 6px; }
        .cert-expo { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 32px; }

        .cert-footer { font-size: 12px; color: #94a3b8; }

        /* Actions */
        .actions { margin-top: 24px; text-align: center; }
        .btn-save {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 32px; background: var(--primary); color: white;
            border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
            cursor: pointer; font-family: 'Inter', sans-serif;
        }
        .btn-save:hover { background: #3d5d8a; }
        .save-hint { font-size: 12px; color: var(--text-sec); margin-top: 8px; }

        .hidden { display: none !important; }

        /* Print Styles */
        @media print {
            @page {
                size: A4 landscape;
                margin: 0;
            }
            body {
                background: white;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .actions { display: none !important; }
            .certificate-wrapper {
                max-width: 100%;
                width: 100%;
            }
            .certificate {
                border-width: 3px;
                box-shadow: none;
                padding: 50px 40px;
                page-break-inside: avoid;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .certificate { padding: 40px 24px; }
            .cert-title { font-size: 24px; }
            .cert-name { font-size: 28px; }
            .cert-topic { font-size: 20px; padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div id="loadingState">
        <div class="loading">
            <div class="spinner"></div>
            <p style="color:var(--text-sec);">Loading certificate...</p>
        </div>
    </div>

    <!-- Error -->
    <div id="errorState" class="hidden">
        <div class="error-state">
            <div class="icon">!</div>
            <h2 id="errorTitle">Certificate Not Found</h2>
            <p id="errorMsg">This certificate link may be invalid or expired.</p>
        </div>
    </div>

    <!-- Certificate -->
    <div id="certificateState" class="hidden">
        <div class="certificate-wrapper">
            <div class="certificate">
                <img src="/assets/Leena_logo_white_nobg.png" alt="Leena" class="cert-logo" style="filter:grayscale(100%) brightness(0.4);">

                <div class="cert-title">Certificate</div>
                <div class="cert-subtitle">of Attendance</div>

                <div class="cert-preamble">This is to certify that</div>
                <div class="cert-name" id="certName">-</div>
                <div class="cert-company" id="certCompany"></div>

                <div class="cert-session-label">has attended the conference session</div>
                <div class="cert-topic" id="certTopic">-</div>

                <div class="cert-divider"></div>

                <div class="cert-date" id="certDate">-</div>
                <div class="cert-expo" id="certExpo">-</div>

                <div class="cert-footer">Powered by Leena EMS</div>
            </div>

            <div class="actions">
                <button class="btn-save" onclick="window.print()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                    Save as PDF
                </button>
                <div class="save-hint">Use "Save as PDF" option in the print dialog</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadCertificate);

        async function loadCertificate() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                showError('Missing Token', 'No certificate token provided in the URL.');
                return;
            }

            try {
                const res = await fetch(`/api/conference-certificates/verify/${encodeURIComponent(token)}`);
                const data = await res.json();

                if (!res.ok || !data.success) {
                    showError('Certificate Not Found', data.error || 'This certificate link may be invalid or expired.');
                    return;
                }

                const cert = data.certificate;

                // Populate certificate
                const fullName = [cert.name, cert.last_name].filter(Boolean).join(' ') || 'Guest';
                document.getElementById('certName').textContent = fullName;
                document.getElementById('certCompany').textContent = cert.company || '';
                document.getElementById('certTopic').textContent = cert.conference_topic || '-';
                document.getElementById('certDate').textContent = cert.date || '-';
                document.getElementById('certExpo').textContent = cert.expo_name || '-';

                // Update page title
                document.title = `Certificate — ${fullName} — ${cert.conference_topic}`;

                // Hide company if empty
                if (!cert.company) {
                    document.getElementById('certCompany').style.display = 'none';
                }

                // Show certificate
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('certificateState').classList.remove('hidden');

            } catch (err) {
                showError('Connection Error', 'Could not load the certificate. Please check your internet connection and try again.');
            }
        }

        function showError(title, message) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorState').classList.remove('hidden');
            document.getElementById('errorTitle').textContent = title;
            document.getElementById('errorMsg').textContent = message;
        }
    </script>
</body>
</html>
