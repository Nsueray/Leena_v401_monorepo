<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Leena EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4a6fa5; --primary-hover: #3d5d8a; --primary-light: #eef2f7;
            --sidebar-bg: #1a1a2e; --sidebar-hover: #252542; --sidebar-text: #9ca3af; --sidebar-text-active: #fff;
            --bg-main: #f8fafc; --bg-card: #fff; --border-color: #e2e8f0;
            --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
            --success: #10b981; --success-bg: #d1fae5; 
            --info: #3b82f6; --info-bg: #dbeafe;
            --warning: #f59e0b; --warning-bg: #fef3c7;
            --danger: #ef4444; --danger-bg: #fee2e2;
            --purple: #8b5cf6; --purple-bg: #ede9fe;
            --radius-md: 8px; --radius-lg: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-primary); font-size: 14px; }
        .app-shell { display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 256px; background: var(--sidebar-bg); position: fixed; top: 0; left: 0; bottom: 0; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #252542; }
        .sidebar-logo { height: 80px; }
        .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--sidebar-text); padding: 0 12px 8px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: var(--sidebar-text); text-decoration: none; border-radius: var(--radius-md); margin-bottom: 2px; transition: all 0.15s; }
        .nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
        .nav-item.active { background: #2d2d4a; color: var(--sidebar-text-active); }
        .nav-item i { font-size: 18px; width: 20px; }
        .nav-item span { font-size: 13px; font-weight: 500; }
        .nav-divider { height: 1px; background: #252542; margin: 16px 12px; }
        
        /* Main Content */
        .main-wrapper { flex: 1; margin-left: 256px; display: flex; flex-direction: column; }
        .main-header { height: 64px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 50; }
        .main-header h1 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .main-header h1 i { color: var(--primary); }
        .header-actions { display: flex; gap: 10px; }
        .main-content { flex: 1; padding: 24px; }
        
        /* Buttons */
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; font-size: 13px; font-weight: 500; border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer; transition: all 0.15s; }
        .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border-color: var(--border-color); }
        .btn-secondary:hover { background: var(--bg-main); }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; }
        .stat-card .stat-icon { width: 44px; height: 44px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px; }
        .stat-card .stat-icon.blue { background: var(--info-bg); color: var(--info); }
        .stat-card .stat-icon.green { background: var(--success-bg); color: var(--success); }
        .stat-card .stat-icon.orange { background: var(--warning-bg); color: var(--warning); }
        .stat-card .stat-icon.red { background: var(--danger-bg); color: var(--danger); }
        .stat-card .stat-icon.purple { background: var(--purple-bg); color: var(--purple); }
        .stat-card .stat-value { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        .stat-card .stat-label { font-size: 13px; color: var(--text-secondary); }
        .stat-card .stat-change { font-size: 12px; margin-top: 8px; }
        .stat-card .stat-change.up { color: var(--success); }
        .stat-card .stat-change.down { color: var(--danger); }
        
        /* Charts Grid */
        .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
        .chart-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; }
        .chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .chart-card h3 i { color: var(--primary); }
        .chart-container { position: relative; height: 280px; }
        
        /* Lists Grid */
        .lists-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 24px; }
        .list-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; }
        .list-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .list-card h3 i { color: var(--primary); }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .list-item:last-child { border-bottom: none; }
        .list-item .name { font-size: 13px; color: var(--text-primary); }
        .list-item .count { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
        .list-item .bar-container { flex: 1; margin: 0 12px; height: 6px; background: var(--bg-main); border-radius: 3px; overflow: hidden; }
        .list-item .bar { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.5s ease; }
        
        /* Bottom Grid */
        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        
        /* Loading */
        .loading-spinner { display: flex; justify-content: center; align-items: center; min-height: 200px; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Error State */
        .error-state { text-align: center; padding: 40px; color: var(--text-muted); }
        
        /* Responsive */
        @media (max-width: 1400px) { 
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .bottom-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 1200px) { 
            .charts-grid { grid-template-columns: 1fr; }
            .lists-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) { 
            .sidebar { display: none; } 
            .main-wrapper { margin-left: 0; } 
            .stats-grid { grid-template-columns: 1fr; }
            .bottom-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <img src="assets/Leena_logo_white_nobg.png" alt="Leena" class="sidebar-logo">
            </div>
            <div class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Overview</div>
                    <a class="nav-item" href="main-panel-v2.html"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Management</div>
                    <a class="nav-item" href="visitorlog-paginated.html"><i class="bi bi-people"></i><span>Visitors</span></a>
                    <a class="nav-item" href="form-builder.html"><i class="bi bi-ui-checks-grid"></i><span>Forms</span></a>
                    <a class="nav-item" href="checkins.html"><i class="bi bi-check2-square"></i><span>Check-ins</span></a>
                    <a class="nav-item" href="terminals.html"><i class="bi bi-pc-display"></i><span>Terminals</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Communication</div>
                    <a class="nav-item" href="email-templates.html"><i class="bi bi-envelope"></i><span>Email Templates</span></a>
                    <a class="nav-item" href="email-send.html"><i class="bi bi-send"></i><span>Send Emails</span></a>
                    <a class="nav-item" href="email-segments.html"><i class="bi bi-megaphone"></i><span>Email Segments</span></a>
                </div>
                <div class="nav-divider"></div>
                <div class="nav-section">
                    <div class="nav-section-title">Tools</div>
                    <a class="nav-item active" href="reports.html"><i class="bi bi-graph-up"></i><span>Reports</span></a>
                    <a class="nav-item" href="import.html"><i class="bi bi-download"></i><span>Import</span></a>
                </div>
            </div>
        </nav>
        
        <!-- Main Content -->
        <div class="main-wrapper">
            <header class="main-header">
                <h1><i class="bi bi-graph-up"></i> <span id="expoName">Expo Reports</span></h1>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="exportReport()"><i class="bi bi-download"></i> Export CSV</button>
                    <button class="btn btn-primary" onclick="loadReport()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                    <button class="btn btn-secondary" onclick="window.location.href='main-panel-v2.html'"><i class="bi bi-arrow-left"></i> Back</button>
                </div>
            </header>
            
            <main class="main-content" id="reportContent">
                <div class="loading-spinner"><div class="spinner"></div></div>
            </main>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const expoId = localStorage.getItem('selectedExpoId');
        let reportData = null;

        // Chart instances
        let dailyChart = null;
        let sourceChart = null;
        let sectorChart = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) { window.location.href = 'login_new.html'; return; }
            if (!expoId) { alert('No expo selected.'); window.location.href = 'main-panel-v2.html'; return; }
            loadReport();
        });

        async function loadReport() {
            document.getElementById('reportContent').innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
            
            try {
                const res = await fetch(`/api/reports/summary?expo_id=${expoId}&include_details=true`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) throw new Error('Failed to load report');
                
                reportData = await res.json();
                console.log('Report data:', reportData);
                
                // Update expo name
                if (reportData.expo_info) {
                    document.getElementById('expoName').textContent = reportData.expo_info.name + ' - Reports';
                }
                
                renderReport(reportData);
            } catch (e) {
                console.error('Report error:', e);
                document.getElementById('reportContent').innerHTML = `
                    <div class="error-state">
                        <i class="bi bi-exclamation-circle" style="font-size:48px;"></i>
                        <h3>Failed to load report</h3>
                        <p>Please try again</p>
                    </div>
                `;
            }
        }

        function renderReport(data) {
            const vm = data.visitor_metrics || {};
            const cm = data.checkin_metrics || {};
            const em = data.email_metrics || {};
            
            const totalVisitors = vm.total_visitors || 0;
            const checkedIn = cm.unique_visitors_checked_in || 0;
            const checkinRate = cm.checkin_rate || 0;
            const noshows = totalVisitors - checkedIn;
            const todayReg = vm.registrations_today || 0;
            
            document.getElementById('reportContent').innerHTML = `
                <!-- Stats Cards -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon blue"><i class="bi bi-people"></i></div>
                        <div class="stat-value">${totalVisitors.toLocaleString()}</div>
                        <div class="stat-label">Total Registered</div>
                        <div class="stat-change up">+${todayReg} today</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green"><i class="bi bi-check2-circle"></i></div>
                        <div class="stat-value">${checkedIn.toLocaleString()}</div>
                        <div class="stat-label">Checked In</div>
                        <div class="stat-change">${cm.checkins_today || 0} today</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon purple"><i class="bi bi-percent"></i></div>
                        <div class="stat-value">${checkinRate}%</div>
                        <div class="stat-label">Check-in Rate</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange"><i class="bi bi-person-x"></i></div>
                        <div class="stat-value">${noshows.toLocaleString()}</div>
                        <div class="stat-label">Not Yet Checked In</div>
                    </div>
                </div>
                
                <!-- Charts Row -->
                <div class="charts-grid">
                    <div class="chart-card">
                        <h3><i class="bi bi-bar-chart"></i> Daily Registrations (Last 14 Days)</h3>
                        <div class="chart-container">
                            <canvas id="dailyChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <h3><i class="bi bi-pie-chart"></i> By Origin</h3>
                        <div class="chart-container">
                            <canvas id="sourceChart"></canvas>
                        </div>
                    </div>
                </div>
                
                <!-- Lists Row -->
                <div class="lists-grid">
                    <div class="list-card">
                        <h3><i class="bi bi-globe"></i> Top Countries</h3>
                        <div id="countriesList"></div>
                    </div>
                    <div class="list-card">
                        <h3><i class="bi bi-building"></i> Top Companies</h3>
                        <div id="companiesList"></div>
                    </div>
                </div>
                
                <!-- Bottom Row -->
                <div class="bottom-grid">
                    <div class="chart-card">
                        <h3><i class="bi bi-tags"></i> By Sector</h3>
                        <div class="chart-container" style="height: 220px;">
                            <canvas id="sectorChart"></canvas>
                        </div>
                    </div>
                    <div class="list-card">
                        <h3><i class="bi bi-megaphone"></i> Top Sources</h3>
                        <div id="originList"></div>
                    </div>
                    <div class="list-card">
                        <h3><i class="bi bi-envelope-check"></i> Email Stats</h3>
                        <div id="emailStats">
                            <div class="list-item">
                                <span class="name">Total Sent</span>
                                <span class="count">${em.total_sent || 0}</span>
                            </div>
                            <div class="list-item">
                                <span class="name">Delivered</span>
                                <span class="count" style="color: var(--success);">${em.delivered || 0}</span>
                            </div>
                            <div class="list-item">
                                <span class="name">Failed</span>
                                <span class="count" style="color: var(--danger);">${em.failed || 0}</span>
                            </div>
                            <div class="list-item">
                                <span class="name">Delivery Rate</span>
                                <span class="count">${em.delivery_rate || 0}%</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Render charts
            renderDailyChart(data.daily_trend || []);
            renderSourceChart(data.registration_sources || []);
            renderSectorChart(data);
            
            // Render lists
            renderList('countriesList', data.top_countries || [], totalVisitors);
            renderList('companiesList', data.top_companies || [], totalVisitors, 'company');
            renderOriginList(data.registration_sources || []);
        }

        function renderDailyChart(dailyData) {
            const ctx = document.getElementById('dailyChart');
            if (!ctx) return;
            
            // Sort by date and take last 14 days
            const sorted = [...dailyData].sort((a, b) => a.date.localeCompare(b.date)).slice(-14);
            
            const labels = sorted.map(d => {
                const date = new Date(d.date);
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            });
            const values = sorted.map(d => parseInt(d.registrations) || 0);
            
            if (dailyChart) dailyChart.destroy();
            
            dailyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Registrations',
                        data: values,
                        backgroundColor: 'rgba(74, 111, 165, 0.8)',
                        borderColor: 'rgba(74, 111, 165, 1)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        datalabels: { display: false }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true,
                            ticks: { stepSize: 100 }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                },
                plugins: [{
                    id: 'valueLabels',
                    afterDatasetsDraw(chart) {
                        const ctx = chart.ctx;
                        chart.data.datasets.forEach((dataset, i) => {
                            const meta = chart.getDatasetMeta(i);
                            meta.data.forEach((bar, index) => {
                                const value = dataset.data[index];
                                if (value > 0) {
                                    ctx.fillStyle = '#475569';
                                    ctx.font = 'bold 11px Inter';
                                    ctx.textAlign = 'center';
                                    ctx.fillText(value, bar.x, bar.y - 5);
                                }
                            });
                        });
                    }
                }]
            });
        }

        function renderSourceChart(sources) {
            const ctx = document.getElementById('sourceChart');
            if (!ctx) return;
            
            // Group by origin (extract from source name or use default)
            const originCounts = {};
            sources.forEach(s => {
                // Try to determine origin from source name
                let origin = 'Other';
                const sourceLower = (s.source || '').toLowerCase();
                
                if (sourceLower.includes('zoho') || sourceLower.includes('registration')) {
                    origin = 'Zoho Form';
                } else if (sourceLower.includes('manual')) {
                    origin = 'Manual Entry';
                } else if (sourceLower.includes('import')) {
                    origin = 'Import';
                } else if (sourceLower.includes('onsite') || sourceLower.includes('walk')) {
                    origin = 'Onsite';
                } else if (sourceLower.includes('api') || sourceLower.includes('webhook')) {
                    origin = 'API/Webhook';
                }
                
                originCounts[origin] = (originCounts[origin] || 0) + (parseInt(s.count) || 0);
            });
            
            // Convert to arrays and sort
            const origins = Object.entries(originCounts)
                .map(([name, count]) => ({ name, count }))
                .sort((a, b) => b.count - a.count);
            
            const total = origins.reduce((sum, o) => sum + o.count, 0);
            
            // Add percentage to labels
            const labels = origins.map(o => {
                const pct = total > 0 ? Math.round(o.count / total * 100) : 0;
                return `${o.name} (${pct}%)`;
            });
            const values = origins.map(o => o.count);
            
            const colors = [
                'rgba(74, 111, 165, 0.8)',
                'rgba(16, 185, 129, 0.8)',
                'rgba(245, 158, 11, 0.8)',
                'rgba(139, 92, 246, 0.8)',
                'rgba(239, 68, 68, 0.8)',
                'rgba(59, 130, 246, 0.8)'
            ];
            
            if (sourceChart) sourceChart.destroy();
            
            sourceChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                boxWidth: 12,
                                padding: 8,
                                font: { size: 11 }
                            }
                        }
                    }
                }
            });
        }

        function renderSectorChart(data) {
            const ctx = document.getElementById('sectorChart');
            if (!ctx) return;
            
            // Get sectors from top_countries or create from visitor data
            // Since we don't have direct sector data, we'll try to get it from custom_fields
            // For now, use a placeholder or fetch separately
            
            // Try to get sector distribution
            let sectors = [];
            if (data.recent_activity && data.recent_activity.recent_registrations) {
                // Count sectors from recent registrations
                const sectorCounts = {};
                data.recent_activity.recent_registrations.forEach(r => {
                    const sector = r.sector || 'Other';
                    sectorCounts[sector] = (sectorCounts[sector] || 0) + 1;
                });
                sectors = Object.entries(sectorCounts).map(([name, count]) => ({ name, count }));
            }
            
            // If no sector data, show message
            if (sectors.length === 0) {
                ctx.parentElement.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 40px;">No sector data available</p>';
                return;
            }
            
            const labels = sectors.map(s => s.name);
            const values = sectors.map(s => s.count);
            
            const colors = [
                'rgba(74, 111, 165, 0.8)',
                'rgba(16, 185, 129, 0.8)',
                'rgba(245, 158, 11, 0.8)',
                'rgba(139, 92, 246, 0.8)',
                'rgba(239, 68, 68, 0.8)'
            ];
            
            if (sectorChart) sectorChart.destroy();
            
            sectorChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                boxWidth: 12,
                                padding: 8,
                                font: { size: 11 }
                            }
                        }
                    }
                }
            });
        }

        function renderList(containerId, items, total, nameField = 'country') {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            if (!items || items.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">No data available</p>';
                return;
            }
            
            const maxCount = Math.max(...items.map(i => parseInt(i.count) || 0));
            
            container.innerHTML = items.slice(0, 8).map(item => {
                const name = item[nameField] || 'Unknown';
                const count = parseInt(item.count) || 0;
                const percent = maxCount > 0 ? (count / maxCount * 100) : 0;
                
                return `
                    <div class="list-item">
                        <span class="name">${escapeHtml(name)}</span>
                        <div class="bar-container">
                            <div class="bar" style="width: ${percent}%"></div>
                        </div>
                        <span class="count">${count.toLocaleString()}</span>
                    </div>
                `;
            }).join('');
        }

        function renderOriginList(sources) {
            const container = document.getElementById('originList');
            if (!container) return;
            
            if (!sources || sources.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">No data available</p>';
                return;
            }
            
            // Calculate total
            const total = sources.reduce((sum, s) => sum + (parseInt(s.count) || 0), 0);
            
            // Show top 5 sources with percentages
            const topSources = sources.slice(0, 5);
            
            container.innerHTML = topSources.map(s => {
                const count = parseInt(s.count) || 0;
                const pct = total > 0 ? Math.round(count / total * 100) : 0;
                const name = s.source || 'Unknown';
                
                return `
                    <div class="list-item" style="flex-direction: column; align-items: flex-start; gap: 4px;">
                        <span class="name" style="font-size: 12px; line-height: 1.4;">${escapeHtml(name)}</span>
                        <span class="count" style="font-size: 13px; font-weight: 600; color: var(--primary);">${count.toLocaleString()} (${pct}%)</span>
                    </div>
                `;
            }).join('');
        }

        async function exportReport() {
            if (!reportData) {
                alert('Please wait for report to load');
                return;
            }
            
            try {
                const res = await fetch(`/api/reports/export?expo_id=${expoId}&format=csv`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) throw new Error('Export failed');
                
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `report_${expoId}_${Date.now()}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (e) {
                console.error('Export error:', e);
                alert('Failed to export report');
            }
        }

        function escapeHtml(t) { 
            const d = document.createElement('div'); 
            d.textContent = t || ''; 
            return d.innerHTML; 
        }
    </script>
</body>
</html>
