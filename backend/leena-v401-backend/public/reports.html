<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Leena EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4a6fa5; --primary-hover: #3d5d8a; --primary-light: #eef2f7;
            --sidebar-bg: #1a1a2e; --sidebar-hover: #252542; --sidebar-text: #9ca3af; --sidebar-text-active: #fff;
            --bg-main: #f8fafc; --bg-card: #fff; --border-color: #e2e8f0;
            --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
            --success: #10b981; --success-bg: #d1fae5; --info: #3b82f6; --info-bg: #dbeafe;
            --radius-md: 8px; --radius-lg: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-primary); font-size: 14px; }
        .app-shell { display: flex; min-height: 100vh; }
        .sidebar { width: 256px; background: var(--sidebar-bg); position: fixed; top: 0; left: 0; bottom: 0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #252542; }
        .sidebar-logo { height: 80px; }
        .sidebar-nav { flex: 1; padding: 16px 12px; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--sidebar-text); padding: 0 12px 8px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: var(--sidebar-text); text-decoration: none; border-radius: var(--radius-md); margin-bottom: 2px; transition: all 0.15s; }
        .nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
        .nav-item.active { background: #2d2d4a; color: var(--sidebar-text-active); }
        .nav-item i { font-size: 18px; width: 20px; }
        .nav-item span { font-size: 13px; font-weight: 500; }
        .nav-divider { height: 1px; background: #252542; margin: 16px 12px; }
        .main-wrapper { flex: 1; margin-left: 256px; display: flex; flex-direction: column; }
        .main-header { height: 64px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 50; }
        .main-header h1 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .main-header h1 i { color: var(--primary); }
        .header-actions { display: flex; gap: 10px; }
        .main-content { flex: 1; padding: 24px; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; font-size: 13px; font-weight: 500; border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer; transition: all 0.15s; }
        .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border-color: var(--border-color); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 24px; }
        .stat-card .stat-icon { width: 48px; height: 48px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 16px; }
        .stat-card .stat-icon.visitors { background: var(--info-bg); color: var(--info); }
        .stat-card .stat-icon.checkins { background: var(--success-bg); color: var(--success); }
        .stat-card .stat-icon.countries { background: #f3e8ff; color: #9333ea; }
        .stat-card .stat-icon.source { background: #fef3c7; color: #f59e0b; }
        .stat-card .stat-value { font-size: 32px; font-weight: 700; margin-bottom: 4px; }
        .stat-card .stat-label { font-size: 13px; color: var(--text-secondary); }
        .report-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 24px; }
        .report-card h3 { font-size: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .report-card h3 i { color: var(--primary); }
        .loading-spinner { display: flex; justify-content: center; align-items: center; min-height: 200px; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-state { text-align: center; padding: 40px; color: var(--text-muted); }
        @media (max-width: 1200px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .sidebar { display: none; } .main-wrapper { margin-left: 0; } .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="app-shell">
        <nav class="sidebar">
            <div class="sidebar-header">
                <img src="assets/Leena_logo_white_nobg.png" alt="Leena" class="sidebar-logo">
            </div>
            <div class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Overview</div>
                    <a class="nav-item" href="main-panel-v2.html"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Management</div>
                    <a class="nav-item" href="visitorlog-paginated.html"><i class="bi bi-people"></i><span>Visitors</span></a>
                    <a class="nav-item" href="main-panel-v2.html" onclick="localStorage.setItem('loadPage','forms')"><i class="bi bi-ui-checks-grid"></i><span>Forms</span></a>
                    <a class="nav-item" href="checkins.html"><i class="bi bi-check2-square"></i><span>Check-ins</span></a>
                    <a class="nav-item" href="terminals.html"><i class="bi bi-pc-display"></i><span>Terminals</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Communication</div>
                    <a class="nav-item" href="email-templates.html"><i class="bi bi-envelope"></i><span>Email Templates</span></a>
                    <a class="nav-item" href="email-send.html"><i class="bi bi-send"></i><span>Send Emails</span></a>
                    <a class="nav-item" href="email-segments.html"><i class="bi bi-megaphone"></i><span>Email Segments</span></a>
                </div>
                <div class="nav-divider"></div>
                <div class="nav-section">
                    <div class="nav-section-title">Tools</div>
                    <a class="nav-item active" href="reports.html"><i class="bi bi-graph-up"></i><span>Reports</span></a>
                    <a class="nav-item" href="import.html"><i class="bi bi-download"></i><span>Import</span></a>
                </div>
            </div>
        </nav>
        
        <div class="main-wrapper">
            <header class="main-header">
                <h1><i class="bi bi-graph-up"></i> Expo Reports</h1>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="loadReport()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                    <button class="btn btn-secondary" onclick="window.location.href='main-panel-v2.html'"><i class="bi bi-arrow-left"></i> Back</button>
                </div>
            </header>
            
            <main class="main-content">
                <div id="reportContent">
                    <div class="loading-spinner"><div class="spinner"></div></div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const expoId = localStorage.getItem('selectedExpoId');

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) { window.location.href = 'login_new.html'; return; }
            if (!expoId) { alert('No expo selected.'); window.location.href = 'dashboard_new.html'; return; }
            loadReport();
        });

        async function loadReport() {
            document.getElementById('reportContent').innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
            
            try {
                const res = await fetch(`/api/reports?expoId=${expoId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const report = await res.json();

                if (res.ok) {
                    document.getElementById('reportContent').innerHTML = `
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-icon visitors"><i class="bi bi-people"></i></div>
                                <div class="stat-value">${(report.total_visitors || 0).toLocaleString()}</div>
                                <div class="stat-label">Total Registered Visitors</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon checkins"><i class="bi bi-check2-square"></i></div>
                                <div class="stat-value">${(report.total_checkins || 0).toLocaleString()}</div>
                                <div class="stat-label">Total Check-ins</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon countries"><i class="bi bi-globe"></i></div>
                                <div class="stat-value">${report.unique_countries || 0}</div>
                                <div class="stat-label">Unique Countries</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon source"><i class="bi bi-tag"></i></div>
                                <div class="stat-value">${escapeHtml(report.top_source || 'N/A')}</div>
                                <div class="stat-label">Top Source</div>
                            </div>
                        </div>
                        
                        <div class="report-card">
                            <h3><i class="bi bi-bar-chart"></i> Summary</h3>
                            <p style="color:var(--text-secondary);">
                                This expo has <strong>${(report.total_visitors || 0).toLocaleString()}</strong> registered visitors 
                                from <strong>${report.unique_countries || 0}</strong> countries. 
                                A total of <strong>${(report.total_checkins || 0).toLocaleString()}</strong> check-ins have been recorded.
                                The most common registration source is <strong>${escapeHtml(report.top_source || 'N/A')}</strong>.
                            </p>
                        </div>
                    `;
                } else {
                    document.getElementById('reportContent').innerHTML = `<div class="error-state"><i class="bi bi-exclamation-circle" style="font-size:48px;"></i><h3>Error loading report</h3><p>${report.error || 'Unknown error'}</p></div>`;
                }
            } catch (e) {
                document.getElementById('reportContent').innerHTML = `<div class="error-state"><i class="bi bi-exclamation-circle" style="font-size:48px;"></i><h3>Failed to load report</h3><p>Please try again</p></div>`;
            }
        }

        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }
    </script>
</body>
</html>
