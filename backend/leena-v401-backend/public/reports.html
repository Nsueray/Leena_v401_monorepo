<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expo Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/assets/leena.css">
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-header">
      <img src="/logo.png" alt="Leena logo" class="sidebar-logo">
      <span>Leena EMS</span>
    </div>
    <ul class="sidebar-menu">
      <li><a href="dashboard.html"><i class="bi bi-grid"></i> All Expos</a></li>
      <li><a href="main-panel.html"><i class="bi bi-columns-gap"></i> Expo Panel</a></li>
      <li><a href="main-panel.html" onclick="localStorage.setItem('loadPage', 'visitors')"><i class="bi bi-people"></i> Visitors</a></li>
      <li><a href="main-panel.html" onclick="localStorage.setItem('loadPage', 'forms')"><i class="bi bi-card-list"></i> Forms</a></li>
      <li><a href="checkins.html"><i class="bi bi-check2-square"></i> Check-ins</a></li>
      <li><a href="terminals.html"><i class="bi bi-pc-display"></i> Terminals</a></li>
      <li><a href="email-templates.html"><i class="bi bi-envelope"></i> Email Templates</a></li>
      <li><a href="email-send.html"><i class="bi bi-send"></i> Send Emails</a></li>
      <li><a href="email-segments.html"><i class="bi bi-megaphone"></i> Email Segments</a></li>
      <li><a class="active" href="reports.html"><i class="bi bi-graph-up"></i> Reports</a></li>
      <li><a href="import.html"><i class="bi bi-download"></i> Import</a></li>
      <li><a href="visitorlog-paginated.html" target="_blank"><i class="bi bi-journals"></i> Visitor Log</a></li>
      <li><a href="admin-dashboard.html"><i class="bi bi-shield-lock"></i> Admin Panel</a></li>
    </ul>
  </nav>

  <div class="main-wrapper">
    <header class="page-header">
      <div>
        <h1>
          <i class="bi bi-graph-up"></i>
          Expo Summary Report
        </h1>
        <div class="subtitle">Live snapshot of attendance and engagement</div>
      </div>
      <div class="header-buttons">
        <button class="btn btn-primary" id="refreshBtn" onclick="loadReport()">
          <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
      </div>
    </header>

    <main class="main-container">
      <div class="report-box" id="reportSection">
        <h3>Loading...</h3>
      </div>
    </main>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const expoId = localStorage.getItem('selectedExpoId');

    async function loadReport() {
      // Use relative path that works both locally and in production
      const res = await fetch(`/api/reports?expoId=${expoId}`, {
        headers: { 
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });

      const report = await res.json();
      const section = document.getElementById('reportSection');

      if (res.ok) {
        section.innerHTML = `
          <h3>Overview</h3>
          <p><strong>Total Registered Visitors:</strong> ${report.total_visitors}</p>
          <p><strong>Total Check-ins:</strong> ${report.total_checkins}</p>
          <p><strong>Unique Countries:</strong> ${report.unique_countries}</p>
          <p><strong>Most Popular Source:</strong> ${report.top_source}</p>
        `;
      } else {
        section.innerHTML = `<h3>Error loading report</h3><p>${report.error || 'Unknown error'}</p>`;
      }
    }

    loadReport();
  </script>
</body>
</html>
