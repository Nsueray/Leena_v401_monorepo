<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Print Your Event Badge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 { font-size: 28px; margin-bottom: 10px; }
    .badge-container { padding: 40px; text-align: center; }
    .badge {
      border: 3px solid #e0e0e0;
      border-radius: 15px;
      padding: 30px;
      display: inline-block;
      background: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .badge-header { margin-bottom: 20px; }
    .badge-title {
      font-size: 18px;
      color: #333;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .badge-subtitle { font-size: 14px; color: #666; }
    .visitor-info { margin: 20px 0; text-align: left; }
    .info-row {
      padding: 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    .info-label {
      font-weight: 600;
      color: #666;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .info-value { color: #333; font-size: 16px; }
    .qr-section {
      margin: 30px 0;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 10px;
    }
    .qr-code {
      width: 200px;
      height: 200px;
      margin: 0 auto;
      padding: 10px;
      background: white;
      border-radius: 10px;
    }
    .badge-footer {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px dashed #e0e0e0;
      font-size: 12px;
      color: #999;
    }
    .actions {
      padding: 30px;
      background: #f8f9fa;
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }
    .btn-secondary:hover {
      background: #667eea;
      color: white;
    }
    .loading {
      text-align: center;
      padding: 60px;
    }
    .loading-spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error {
      text-align: center;
      padding: 60px;
      color: #dc3545;
    }
    .error i {
      font-size: 60px;
      margin-bottom: 20px;
    }
    @media print {
      body { background: white; padding: 0; }
      .container {
        box-shadow: none;
        max-width: 100%;
      }
      .header, .actions { display: none; }
      .badge-container { padding: 0; }
      .badge {
        border: 2px solid #333;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎫 Your Event Badge</h1>
      <p>Print or save your badge for the event</p>
    </div>

    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading your badge...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script>
    const API_URL = 'http://localhost:3000/api';

    function getQRFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('qr');
    }

    async function loadBadge() {
      const qrCode = getQRFromURL();

      if (!qrCode) {
        showError('Invalid badge link');
        return;
      }

      displayBadge({
        qr_code: qrCode,
        name: 'Loading...',
        company: '',
        badge_id: 'Loading...'
      });

      fetchVisitorData(qrCode);
    }

    async function fetchVisitorData(qrCode) {
      try {
        const response = await fetch(`${API_URL}/visitors/badge/${qrCode}`);
        if (response.ok) {
          const data = await response.json();
          displayBadge(data.visitor);
        }
      } catch (error) {
        console.log('Could not fetch visitor data, using QR code only');
      }
    }

    function displayBadge(visitor) {
      const content = document.getElementById('content');
      const qrCodeValue = visitor.qr_code || getQRFromURL();
      const visitorName = visitor.name && visitor.name !== 'Loading...' ? visitor.name : 'Guest';
      const badgeId = visitor.badge_id || qrCodeValue.substr(0, 8).toUpperCase();

      content.innerHTML = `
        <div class="badge-container">
          <div class="badge">
            <div class="badge-header">
              <div class="badge-title">EVENT BADGE</div>
              <div class="badge-subtitle">Leena Events 2025</div>
            </div>
            <div class="visitor-info">
              <div class="info-row">
                <div class="info-label">Name</div>
                <div class="info-value">${visitorName}</div>
              </div>
              ${visitor.company ? `
              <div class="info-row">
                <div class="info-label">Company</div>
                <div class="info-value">${visitor.company}</div>
              </div>` : ''}
              <div class="info-row">
                <div class="info-label">Badge ID</div>
                <div class="info-value">${badgeId}</div>
              </div>
            </div>
            <div class="qr-section">
              <div class="qr-code" id="qrcode"></div>
              <p style="margin-top: 10px; color: #666; font-size: 12px;">
                Scan for quick check-in
              </p>
            </div>
            <div class="badge-footer">
              <p>Please wear this badge at all times during the event</p>
              <p style="margin-top: 5px;">© ${new Date().getFullYear()} Leena Events</p>
            </div>
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" onclick="window.print()">
            🖨️ Print Badge
          </button>
          <button class="btn btn-secondary" onclick="downloadBadge()">
            💾 Save as Image
          </button>
        </div>
      `;

      // ✅ FIXED QR CODE GENERATION
      QRCode.toDataURL(qrCodeValue, {
        width: 180,
        margin: 1,
        color: {
          dark: '#000000',
          light: '#FFFFFF'
        }
      }, function (error, url) {
        if (error) {
          console.error('QR Code generation error:', error);
          document.getElementById('qrcode').innerHTML = '<p>QR Code generation failed</p>';
        } else {
          const img = document.createElement('img');
          img.src = url;
          img.alt = 'QR Code';
          img.width = 180;
          img.height = 180;
          document.getElementById('qrcode').appendChild(img);
        }
      });
    }

    function showError(message) {
      const content = document.getElementById('content');
      content.innerHTML = `
        <div class="error">
          <p style="font-size: 60px;">⚠️</p>
          <h3>Oops!</h3>
          <p>${message}</p>
          <p style="margin-top: 20px;">
            <a href="/" class="btn btn-primary">Go to Homepage</a>
          </p>
        </div>
      `;
    }

    function downloadBadge() {
      alert('Save feature coming soon! Please use Print > Save as PDF for now.');
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadBadge();
    });
  </script>
</body>
</html>
