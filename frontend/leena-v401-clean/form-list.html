<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f9f9f9;
    }
    h1 {
      color: #d32f2f;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      background: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.6rem;
      text-align: left;
    }
    th {
      background-color: #eee;
    }
    a {
      color: #1565c0;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>All Forms for This Expo</h1>
  <table id="formsTable">
    <thead>
      <tr>
        <th>Form Name</th>
        <th>Slug</th>
        <th>Source</th>
        <th>Origin</th>
        <th>Created At</th>
        <th>Link</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const expoId = localStorage.getItem('selectedExpoId');
    const token = localStorage.getItem('token');
    const expoSlug = localStorage.getItem('selectedExpoSlug');

    async function loadForms() {
      const res = await fetch(`http://localhost:3000/api/forms/by-expo/${expoId}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      if (res.ok) {
        const tbody = document.querySelector('#formsTable tbody');
        tbody.innerHTML = '';
        data.forEach(form => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${form.form_name}</td>
            <td>${form.slug || '-'}</td>
            <td>${form.source || '-'}</td>
            <td>${form.origin || '-'}</td>
            <td>${form.created_at ? form.created_at.slice(0, 19).replace('T', ' ') : '-'}</td>
            <td><a href="form-public.html?expoSlug=${expoSlug}&formSlug=${form.slug}" target="_blank">Open Form</a></td>
          `;
          tbody.appendChild(tr);
        });
      } else {
        alert('Error loading forms');
      }
    }

    loadForms();
  </script>
</body>
</html>
